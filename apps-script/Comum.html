<script>
// ===== Funções comuns (sistema e página do professor) =====
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

function chamar(fn, ...args) {
  return new Promise((ok, falha) => google.script.run.withSuccessHandler(ok).withFailureHandler(falha)[fn](...args));
}
function toast(msg, tipo) {
  const d = document.createElement('div'); d.textContent = msg; if (tipo) d.className = tipo;
  $('toast').appendChild(d); setTimeout(() => d.remove(), tipo === 'erro' ? 6000 : 3000);
}
function ocupado(sim) { $('carregando').hidden = !sim; }
// Logo oficial (azul) ou a versão branca para o topo azul-marinho; se a imagem não carregar, mostra o nome da escola
function logoHtml(cfg, branco) {
  const src = branco ? cfg.logoBranco : cfg.logo;
  return src ? `<img class="logo" src="${esc(src)}" alt="${esc(cfg.escola)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="logo-txt" hidden>${esc(cfg.escola)}</span>`
    : `<span class="logo-txt">${esc(cfg.escola)}</span>`;
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); toast('Copiado!'); return; } catch (e) { }
  const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { }
  t.remove(); ok ? toast('Copiado!') : window.prompt('Copie o texto abaixo:', texto);
}
// Horários: "07:40" <-> 460 minutos
const minutos = h => { const m = /^(\d{1,2}):(\d{2})/.exec(String(h || '')); return m ? +m[1] * 60 + +m[2] : NaN; };
const hora = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
const faixaTxt = (ini, fim) => hora(ini) + '–' + hora(fim);
function aulasDe(g) { return g ? g.itens.filter(i => i.tipo !== 'intervalo').map(i => ({ ini: minutos(i.ini), fim: minutos(i.fim) })) : []; }

// ===== Quadro de disponibilidade por faixas de 1h (clique ou arraste para marcar "Não posso") =====
// Chave: "Seg|7" = segunda das 7h às 8h. Uma aula é proibida se encostar em qualquer faixa marcada.
let DISP = new Set(), pintando = null, tipoPonteiro = 'mouse';
function htmlDisp(dias, faixas) {
  return `<div class="disp-ajuda"><b>Toque nos horários em que NÃO pode dar aula.</b>
    <span class="legenda"><span><i style="background:var(--ok-bg);border:1px solid #cfe8d8"></i>Pode</span><span><i style="background:var(--erro-bg);border:1px solid #f3c7c3"></i>Não pode</span></span></div>`
  + Object.keys(faixas).map(per => { const todo = per === 'Manhã' ? 'manhã toda' : 'tarde toda'; return `<div class="disp-turno">
    <h3 style="margin-bottom:4px">${esc(per)}</h3>
    <table class="disp"><tr><th class="h"></th>${dias.map(d => `<th>${d}</th>`).join('')}</tr>
    <tr class="disp-rapido"><th class="h"></th>${dias.map(d => `<td><button class="btn mini" data-per="${esc(per)}" data-dia="${d}" onclick="dispGrupo(this)" title="Marca ou desmarca a ${todo} de ${d}">Não pode ${todo}</button></td>`).join('')}</tr>
    ${faixas[per].map(h => `<tr><th class="h">${h}h–${h + 1}h</th>
      ${dias.map(d => { const k = d + '|' + h; return `<td class="slot ${DISP.has(k) ? 'nao' : ''}" data-k="${k}" data-per="${esc(per)}" onpointerdown="slotDown(event,this)" onpointerenter="slotEnter(this)" onclick="slotClick(this)"></td>`; }).join('')}</tr>`).join('')}
    </table></div>`; }).join('');
}
function aplicarSlot(td, nao) {
  td.classList.toggle('nao', nao);
  nao ? DISP.add(td.dataset.k) : DISP.delete(td.dataset.k);
  if (window.aoMudarDisp) window.aoMudarDisp();
}
function slotDown(ev, td) { tipoPonteiro = ev.pointerType || 'mouse'; if (tipoPonteiro !== 'mouse') return; ev.preventDefault(); pintando = !td.classList.contains('nao'); aplicarSlot(td, pintando); }
function slotEnter(td) { if (pintando !== null) aplicarSlot(td, pintando); }
function slotClick(td) { if (tipoPonteiro === 'mouse') return; aplicarSlot(td, !td.classList.contains('nao')); }
document.addEventListener('pointerup', () => pintando = null);
function dispGrupo(b) {
  const { per, dia, h } = b.dataset;
  const tds = [...document.querySelectorAll('td.slot')].filter(td => { const p = td.dataset.k.split('|'); return td.dataset.per === per && (!dia || p[0] === dia) && (!h || p[1] === h); });
  const marcar = tds.some(td => !td.classList.contains('nao'));
  tds.forEach(td => aplicarSlot(td, marcar));
}
</script>
