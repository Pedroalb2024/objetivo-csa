<script>
// ===== Funções comuns do sistema =====
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

function chamar(fn, ...args) {
  return new Promise((ok, falha) => google.script.run.withSuccessHandler(ok).withFailureHandler(falha)[fn](...args));
}
function toast(msg, tipo) {
  const d = document.createElement('div'); d.textContent = msg; if (tipo) d.className = tipo;
  $('toast').appendChild(d); setTimeout(() => d.remove(), tipo === 'erro' ? 6000 : 3000);
}
function ocupado(sim) { $('carregando').hidden = !sim; }
// Logo oficial (azul) ou a versão branca para o topo azul-marinho; se a imagem não carregar, mostra o nome da escola
function logoHtml(cfg, branco) {
  const src = branco ? cfg.logoBranco : cfg.logo;
  return src ? `<img class="logo" src="${esc(src)}" alt="${esc(cfg.escola)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="logo-txt" hidden>${esc(cfg.escola)}</span>`
    : `<span class="logo-txt">${esc(cfg.escola)}</span>`;
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); toast('Copiado!'); return; } catch (e) { }
  const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { }
  t.remove(); ok ? toast('Copiado!') : window.prompt('Copie o texto abaixo:', texto);
}
// Horários: "07:40" <-> 460 minutos
const minutos = h => { const m = /^(\d{1,2}):(\d{2})/.exec(String(h || '')); return m ? +m[1] * 60 + +m[2] : NaN; };
const hora = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
const faixaTxt = (ini, fim) => hora(ini) + '–' + hora(fim);
function aulasDe(g) { return g ? g.itens.filter(i => i.tipo !== 'intervalo').map(i => ({ ini: minutos(i.ini), fim: minutos(i.fim) })) : []; }

// ===== Quadro de disponibilidade (a coordenação marca, no cadastro do professor, os horários em que ele NÃO pode) =====
// Como uma agenda: dias nas colunas (Seg–Sex), Manhã antes de Tarde. As linhas são as aulas reais do horário das aulas
// do professor ("1ª · 7:00–7:40", intervalos em cinza) ou, quando há mais de um horário das aulas no período, faixas de 30 min.
// Guarda intervalos por dia (DISP = { Seg: [[ini, fim], …] }, em minutos): marcar uma linha acrescenta o intervalo dela,
// desmarcar tira. A aula fica bloqueada se o intervalo se sobrepõe a ela (só encostar na ponta não bloqueia).
// Tocar no dia (no topo) = o período inteiro daquele dia; tocar na linha (na lateral) = aquele horário em todos os dias.
// turnos = [{ periodo: 'Manhã', ini, fim, nota, linhas: [{ tipo: 'aula' | 'intervalo' | 'faixa', ini, fim, rot }] }]
let DISP = {}, pintando = null, tipoPonteiro = 'mouse';
function dispDe(lista) { DISP = {}; (lista || []).forEach(x => dispAdd(x.dia, x.ini, x.fim)); }
function dispLista() { return Object.keys(DISP).flatMap(dia => DISP[dia].map(([ini, fim]) => ({ dia, ini, fim }))); }
function dispAdd(dia, ini, fim) {
  const out = [];
  (DISP[dia] || []).concat([[ini, fim]]).sort((a, b) => a[0] - b[0]).forEach(x => { const u = out[out.length - 1]; if (u && x[0] <= u[1]) u[1] = Math.max(u[1], x[1]); else out.push(x.slice()); });
  DISP[dia] = out;
}
function dispTirar(dia, ini, fim) {
  const out = [];
  (DISP[dia] || []).forEach(([a, b]) => { if (b <= ini || a >= fim) return out.push([a, b]); if (a < ini) out.push([a, ini]); if (b > fim) out.push([fim, b]); });
  DISP[dia] = out;
}
// 0 = livre · 1 = parte do horário marcada (a aula já fica bloqueada) · 2 = horário inteiro marcado
function dispCobre(dia, ini, fim) {
  let c = 0; (DISP[dia] || []).forEach(([a, b]) => { if (a < fim && ini < b) c += Math.min(b, fim) - Math.max(a, ini); });
  return !c ? 0 : c >= fim - ini ? 2 : 1;
}
function htmlDisp(dias, turnos) {
  return `<div class="disp-quadro"><div class="disp-ajuda"><b>Toque nos horários em que o professor NÃO pode dar aula.</b>
    <span class="legenda"><span><i class="lg-ok"></i>✓ Pode</span><span><i class="lg-nao"></i>✕ Não pode</span></span></div>`
  + turnos.map((t, ti) => { const todo = t.periodo === 'Manhã' ? 'a manhã toda' : 'a tarde toda'; return `<div class="disp-turno">
    <div class="disp-tit"><h3>${esc(t.periodo)}${t.nota ? ` <small class="peq suave">· ${esc(t.nota)}</small>` : ''}</h3><span class="peq suave">toque no dia = ${todo} · na linha = todos os dias</span></div>
    <div class="disp-grade" style="--n:${dias.length}"><span class="disp-canto"></span>
    ${dias.map(d => `<button type="button" class="disp-dia" data-t="${ti}" data-dia="${d}" data-ini="${t.ini}" data-fim="${t.fim}" onclick="dispGrupo(this)" title="Marca ou desmarca ${todo} de ${d}">${d}</button>`).join('')}
    ${t.linhas.map(l => l.tipo === 'intervalo' ? `<span class="disp-int">${esc(l.rot)}</span>`
      : `<button type="button" class="disp-hora" data-t="${ti}" data-ini="${l.ini}" data-fim="${l.fim}" onclick="dispGrupo(this)" title="Marca ou desmarca ${faixaTxt(l.ini, l.fim)} em todos os dias">${l.tipo === 'aula' ? esc(l.rot) + '<small>' + faixaTxt(l.ini, l.fim) + '</small>' : hora(l.ini) + '<small>–' + hora(l.fim) + '</small>'}</button>`
        + dias.map(d => `<div class="slot" role="button" data-t="${ti}" data-dia="${d}" data-ini="${l.ini}" data-fim="${l.fim}" aria-label="${d} ${faixaTxt(l.ini, l.fim)}" title="${d} ${faixaTxt(l.ini, l.fim)}" onpointerdown="slotDown(event,this)" onpointerenter="slotEnter(this)" onclick="slotClick(this)"></div>`).join('')).join('')}
    </div></div>`; }).join('') + '</div>';
}
// Pinta cada horário conforme DISP (chamar depois de pôr o quadro na tela e a cada mudança)
function dispPintar() {
  document.querySelectorAll('.disp-quadro .slot').forEach(td => {
    const c = dispCobre(td.dataset.dia, +td.dataset.ini, +td.dataset.fim);
    td.classList.toggle('nao', c > 0); td.classList.toggle('parte', c === 1);
  });
  if (window.aoMudarDisp) window.aoMudarDisp();
}
function aplicarSlot(td, nao) {
  const dia = td.dataset.dia, ini = +td.dataset.ini, fim = +td.dataset.fim;
  nao ? dispAdd(dia, ini, fim) : dispTirar(dia, ini, fim);
  dispPintar();
}
function slotDown(ev, td) { tipoPonteiro = ev.pointerType || 'mouse'; if (tipoPonteiro !== 'mouse') return; ev.preventDefault(); pintando = !td.classList.contains('nao'); aplicarSlot(td, pintando); }
function slotEnter(td) { if (pintando !== null) aplicarSlot(td, pintando); }
function slotClick(td) { if (tipoPonteiro === 'mouse') return; aplicarSlot(td, !td.classList.contains('nao')); }
document.addEventListener('pointerup', () => pintando = null);
function dispGrupo(b) {
  const t = b.dataset.t, dia = b.dataset.dia, ini = +b.dataset.ini, fim = +b.dataset.fim;
  const tds = [...document.querySelectorAll('.disp-quadro .slot')].filter(td => td.dataset.t === t && (dia ? td.dataset.dia === dia : +td.dataset.ini === ini && +td.dataset.fim === fim));
  const marcar = tds.some(td => !td.classList.contains('nao'));
  if (dia) marcar ? dispAdd(dia, ini, fim) : dispTirar(dia, ini, fim);   // o período inteiro do dia, com os intervalos
  else tds.forEach(td => marcar ? dispAdd(td.dataset.dia, ini, fim) : dispTirar(td.dataset.dia, ini, fim));
  dispPintar();
}
</script>
