<style>
  .login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; }

  .login-card { position:relative; width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; padding:30px 28px; text-align:center; }
  .login-card label { text-align:left; }
  .login-logo .logo { width:84px; height:84px; box-shadow:0 0 0 4px #fff, var(--sombra); }
  .login-logo .logo-txt { font-size:24px; color:var(--marinho); }
  .topo { background:var(--marinho); color:#fff; display:flex; align-items:center; gap:12px; padding:10px 18px; position:sticky; top:0; z-index:20; }
  .topo b { font:500 16px 'Ubuntu', Arial, sans-serif; }
  .topo .usuario { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13px; opacity:.9; }
  .topo .btn { background:transparent; color:#fff; border-color:rgba(255,255,255,.3); }
  .topo .logo-txt { font-size:15px; }
  .corpo-app { display:grid; grid-template-columns:210px 1fr; min-height:calc(100vh - 60px); }
  .corpo-app > *, .duas > *, .grade-layout > * { min-width:0; }
  .menu { background:var(--sup); border-right:1px solid var(--borda); padding:14px 10px; display:flex; flex-direction:column; gap:2px; }
  .menu button { text-align:left; background:none; border:none; padding:10px 12px; border-radius:8px; font:600 13px 'Open Sans', Arial, sans-serif; color:var(--suave); cursor:pointer; position:relative; }
  .menu button:hover { background:var(--fundo); color:var(--texto); }
  .menu button.on { background:var(--azul-claro); color:var(--marinho); }
  .menu button.on::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--amarelo); }
  .tela { padding:22px 26px 60px; max-width:1320px; width:100%; }
  .cab-tela { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .acoes { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:14px; }
  .stat { cursor:pointer; } .stat b { display:block; font:700 24px 'Ubuntu', Arial, sans-serif; color:var(--marinho); } .stat span { color:var(--suave); font-size:12px; }
  .duas { display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start; }
  .lista-turmas button { display:flex; width:100%; justify-content:space-between; align-items:center; gap:8px; background:none; border:none; border-radius:8px; padding:8px 10px; cursor:pointer; font:600 13px 'Open Sans', Arial, sans-serif; color:var(--texto); }
  .lista-turmas button:hover { background:var(--fundo); } .lista-turmas button.on { background:var(--azul-claro); }
  .grupo { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--suave); margin:10px 10px 4px; }
  table.tab input, table.tab select { padding:6px 8px; }
  .senha { font-family:Consolas, monospace; background:var(--fundo); padding:2px 6px; border-radius:4px; }
  .previa { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .lista { margin:6px 0 0; padding-left:18px; max-height:260px; overflow:auto; font-size:12.5px; }
  details summary { cursor:pointer; color:var(--suave); font-weight:600; }
  /* grade */
  .grade-layout { display:grid; grid-template-columns:240px 1fr; gap:14px; align-items:start; }
  .grade-lado { display:flex; flex-direction:column; gap:12px; }
  .grade-lado h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--suave); margin-bottom:8px; }
  .opcao { border:1px solid var(--borda); border-radius:8px; padding:7px 10px; margin-bottom:6px; cursor:pointer; font-size:13px; }
  .opcao.ativa { border-color:var(--azul); background:var(--azul-claro); }
  .opcao small { display:block; color:var(--suave); font-size:11px; }
  .barra { height:6px; background:#e3e7ec; border-radius:3px; overflow:hidden; margin-top:6px; }
  .barra div { height:100%; width:0; background:var(--azul); transition:width .2s; }
  .abas { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .abas .btn.on { background:var(--marinho); color:#fff; border-color:var(--marinho); }
  .abas select { width:auto; min-width:170px; }
  table.grade { border-collapse:collapse; width:100%; background:#fff; table-layout:fixed; }
  table.grade th, table.grade td { border:1px solid var(--borda); padding:3px 4px; text-align:center; vertical-align:middle; }
  table.grade th { background:#f0f3f8; font-weight:600; font-size:12.5px; }
  table.grade th.hora { width:96px; font-weight:500; font-size:11px; color:var(--suave); }
  td.cel { height:44px; cursor:pointer; position:relative; }
  td.cel .d { font-weight:700; font-size:12.5px; line-height:1.2; }
  td.cel .p { font-size:9.5px; color:var(--suave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3; }
  td.cel.vazia { background:#fafbfc; }
  td.cel.sel { outline:3px solid var(--amarelo); outline-offset:-3px; }
  td.cel.conf { box-shadow:inset 0 0 0 3px var(--erro); }
  td.cel.mudou { box-shadow:inset 0 0 0 2px var(--amarelo); }
  td.cel.indisp { background:repeating-linear-gradient(45deg,#f3f3f3,#f3f3f3 6px,#e9e9e9 6px,#e9e9e9 12px); cursor:default; }
  td.cel .lock { position:absolute; top:1px; right:3px; font-size:9px; }
  tr.intervalo td { background:#fbf6e6; color:#8a6d1a; font-size:10.5px; height:16px; padding:1px; }
  .geral td.cel { height:30px; padding:2px; } .geral td.cel .d { font-size:10.5px; } .geral th.turma { width:66px; }
  .titulo-imp { display:flex; align-items:center; gap:10px; margin:6px 0 10px; }
  .sub-linhas { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .sub-linhas label { display:flex; gap:6px; align-items:center; font-size:13px; }
  #impressao { display:none; }
  @media (max-width:900px) {
    .corpo-app { grid-template-columns:1fr; }
    .menu { flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--borda); padding:8px; position:sticky; top:56px; z-index:10; }
    .menu button { white-space:nowrap; } .menu button.on::before { display:none; }
    .duas, .grade-layout { grid-template-columns:1fr; }
    .tela { padding:16px 12px 60px; } .topo .quem { display:none; }
  }
  @media print {
    .topo, .faixa, .menu, .cab-tela .acoes, .grade-lado, .abas, #toast, .carregando { display:none !important; }
    .corpo-app { display:block; } .tela { padding:0; } body { background:#fff; } .card { border:none; box-shadow:none; padding:0; }
    body.imp #app { display:none !important; } body.imp #impressao { display:block; }
    .pagina { page-break-after:always; }
    td.cel.sel, td.cel.mudou { outline:none; box-shadow:none; } td.cel.conf { box-shadow:none; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>

<script>
const CFG = <?!= JSON.stringify(cfg) ?>;
let TOKEN = null, D = null, TELA = 'inicio';
const TODOS = ['admin', 'coordenacao', 'consulta'], EDITA = ['admin', 'coordenacao'];
const NOME_PERFIL = { admin: 'Administrador', coordenacao: 'Coordenação', consulta: 'Consulta' };
const TELAS = [
  { id: 'inicio', nome: 'Início', p: TODOS },
  { id: 'grade', nome: 'Grade horária', p: TODOS },
  { id: 'professores', nome: 'Professores', p: EDITA },
  { id: 'turmas', nome: 'Turmas e disciplinas', p: EDITA },
  { id: 'fixas', nome: 'Aulas fixas', p: EDITA },
  { id: 'horarios', nome: 'Horários', p: EDITA },
  { id: 'usuarios', nome: 'Usuários', p: ['admin'] },
];
const podeEditar = () => EDITA.includes(D.usuario.perfil);
const clone = o => JSON.parse(JSON.stringify(o));

// ================= Entrada, sessão e navegação =================
function iniciar() {
  $('loginLogo').innerHTML = logoHtml(CFG);
  $('lCredito').textContent = CFG.credito ? 'Sistema por ' + CFG.credito : '';
  let t = null; try { t = sessionStorage.getItem('gh_token'); } catch (e) { }
  if (!t) return mostrarLogin();
  TOKEN = t; ocupado(true);
  chamar('api', TOKEN, 'carregar').then(d => { D = d; abrirApp(); }).catch(() => { TOKEN = null; mostrarLogin(); }).finally(() => ocupado(false));
}
async function entrar(ev) {
  ev.preventDefault(); $('lErro').hidden = true; $('lBtn').disabled = true; ocupado(true);
  try {
    const r = await chamar('login', $('lUsuario').value, $('lSenha').value);
    TOKEN = r.token; try { sessionStorage.setItem('gh_token', TOKEN); } catch (e) { }
    D = await chamar('api', TOKEN, 'carregar'); $('lSenha').value = ''; TELA = 'inicio'; abrirApp();
  } catch (e) { $('lErro').textContent = e.message; $('lErro').hidden = false; }
  finally { $('lBtn').disabled = false; ocupado(false); }
}
function mostrarLogin(msg) {
  $('app').hidden = true; $('login').hidden = false;
  if (msg) { $('lErro').textContent = msg; $('lErro').hidden = false; }
  setTimeout(() => $('lUsuario').focus(), 50);
}
function abrirApp() {
  $('login').hidden = true; $('app').hidden = false;
  $('topoLogo').innerHTML = logoHtml(CFG);
  $('topoUsuario').textContent = D.usuario.nome;
  $('menu').innerHTML = TELAS.filter(t => t.p.includes(D.usuario.perfil)).map(t => `<button data-t="${t.id}" onclick="ir('${t.id}')">${t.nome}</button>`).join('');
  GR = novoGR(); ir(TELA, true);
}
async function sair() {
  if (temAlteracao() && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  try { await chamar('sair', TOKEN); } catch (e) { }
  TOKEN = null; D = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  TU = { sel: null, linhas: [], sujo: false }; HO = null; FX = null; mostrarLogin();
}
function expirou() {
  TOKEN = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  fecharModal(); mostrarLogin('Sua sessão expirou. Entre novamente.'); return false;
}
async function acao(nome, dados, msgOk) {
  ocupado(true);
  try { D = await chamar('api', TOKEN, nome, dados); if (msgOk) toast(msgOk); render(); return true; }
  catch (e) { if (/SESSAO_EXPIRADA/.test(e.message)) return expirou(); toast(e.message, 'erro'); return false; }
  finally { ocupado(false); }
}
function temAlteracao() { return TU.sujo || !!HO_SUJO || !!FX_SUJO || (GR && GR.editado); }
function ir(t, forcar) {
  if (!TELAS.some(x => x.id === t && x.p.includes(D.usuario.perfil))) t = 'inicio';
  if (!forcar && t !== TELA) {
    const sujo = (TELA === 'turmas' && TU.sujo) || (TELA === 'horarios' && HO_SUJO) || (TELA === 'fixas' && FX_SUJO);
    if (sujo && !confirm('Há alterações não salvas nesta tela. Sair sem salvar?')) return;
    if (TELA === 'turmas') TU.sujo = false; if (TELA === 'horarios') { HO = null; HO_SUJO = false; } if (TELA === 'fixas') { FX = null; FX_SUJO = false; }
  }
  TELA = t;
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  render(); window.scrollTo(0, 0);
}
function render() {
  ({ inicio: telaInicio, professores: telaProfessores, turmas: telaTurmas, grade: telaGrade, fixas: telaFixas, horarios: telaHorarios, usuarios: telaUsuarios })[TELA]();
}
function cabecalho(tit, acoes) { return `<div class="cab-tela"><h1>${tit}</h1><div class="acoes">${acoes || ''}</div></div>`; }
function abrirModal(titulo, corpo, rodape) {
  $('modalCaixa').innerHTML = `<div class="cab"><h2>${titulo}</h2><button class="link" onclick="fecharModal()" style="font-size:22px;color:var(--suave)">×</button></div><div class="corpo">${corpo}</div><div class="rod">${rodape}</div>`;
  $('modal').hidden = false;
}
function fecharModal() { $('modal').hidden = true; $('modalCaixa').innerHTML = ''; window.aoMudarDisp = null; }

// ---------- ajudantes ----------
const profPorNome = n => D.professores.find(p => p.nome === n);
const cargaDe = turma => D.carga.filter(c => c.turma === turma);
const somaCarga = turma => cargaDe(turma).reduce((s, c) => s + c.aulas, 0);
const turnoDeTurma = nome => { const t = D.turmas.find(x => x.nome === nome); return t && D.turnos.find(x => x.nome === t.turno); };
const capacidade = turma => { const tn = turnoDeTurma(turma); return tn ? tn.aulas * D.dias.length : 0; };
const aulasProf = nome => D.carga.filter(c => c.professor === nome).reduce((s, c) => s + c.aulas, 0);
const discProf = p => p.disciplinas || [...new Set(D.carga.filter(c => c.professor === p.nome).map(c => c.disciplina))].join(', ');
const totalSlots = () => D.turnos.reduce((s, t) => s + t.aulas * D.dias.length, 0);
const msgForm = () => `Olá! Aqui é a coordenação do ${CFG.escola}. Marque neste link os horários em que você não pode dar aula: ${D.linkForm}`;
const whatsForm = () => 'https:\/\/wa.me/?text=' + encodeURIComponent(msgForm());
const nomeAula = (d, a) => `${D.dias[d]} ${a + 1}ª`;

// ================= Início =================
function telaInicio() {
  const resp = D.professores.filter(p => p.respondeuEm).length;
  const completas = D.turmas.filter(t => somaCarga(t.nome) === capacidade(t.nome)).length;
  const nGrade = Object.keys(D.grade).length;
  let h = cabecalho(`Olá, ${esc(D.usuario.nome.split(' ')[0])}`) + `<div class="stats">
    <div class="card stat" onclick="ir('grade')"><b>${nGrade ? 'Salva' : 'Não salva'}</b><span>grade horária oficial</span></div>`;
  if (podeEditar()) {
    h += `<div class="card stat" onclick="ir('professores')"><b>${resp}/${D.professores.length}</b><span>professores responderam o formulário</span></div>
      <div class="card stat" onclick="ir('turmas')"><b>${completas}/${D.turmas.length}</b><span>turmas com todos os horários preenchidos</span></div>`;
    const pend = [];
    if (D.professores.length && D.carga.length) Gerador.modelo(D).erros.forEach(e => pend.push(e));
    D.turmas.filter(t => somaCarga(t.nome) !== capacidade(t.nome)).forEach(t => pend.push(`Turma ${t.nome}: ${somaCarga(t.nome)} de ${capacidade(t.nome)} horários preenchidos.`));
    D.professores.filter(p => !aulasProf(p.nome) && p.respondeuEm).forEach(p => pend.push(`${p.nome} respondeu o formulário e ainda não tem aulas.`));
    h += '</div>' + (pend.length ? `<div class="card"><h2>Pendências</h2><ul class="lista">${pend.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '<div class="aviso ok">Nenhuma pendência.</div>');
  } else h += '</div>';
  $('tela').innerHTML = h;
}

// ================= Professores =================
let BUSCA = '', PED = null;
function telaProfessores() {
  $('tela').innerHTML = cabecalho('Professores',
    `<button class="btn" onclick="copiar(D.linkForm)">Copiar link do formulário</button><a class="btn" target="_blank" href="${esc(whatsForm())}">Enviar no WhatsApp</a>
     <button class="btn prim" onclick="editarProfessor()">+ Professor</button>`)
    + `<div class="card"><input placeholder="Buscar…" value="${esc(BUSCA)}" oninput="BUSCA=this.value;listaProfessores()" style="max-width:280px;margin-bottom:8px"><div id="listaProf"></div></div>`;
  listaProfessores();
}
function listaProfessores() {
  const total = totalSlots(), l = D.professores.filter(p => (p.nome + ' ' + discProf(p)).toLowerCase().indexOf(BUSCA.toLowerCase()) >= 0);
  $('listaProf').innerHTML = !D.professores.length ? '<p class="suave">Nenhum professor. Envie o link do formulário ou clique em “+ Professor”.</p>' :
    `<table class="tab"><tr><th>Professor</th><th>Disciplinas</th><th>Aulas/sem.</th><th>Horários livres</th><th>Formulário</th></tr>${l.map(p => {
      const aulas = aulasProf(p.nome);
      return `<tr class="clic" data-n="${esc(p.nome)}" onclick="editarProfessor(this.dataset.n)">
        <td><b>${esc(p.nome)}</b></td><td class="suave">${esc(discProf(p))}</td>
        <td>${aulas || '<span class="tag alerta">sem aulas</span>'}</td>
        <td>${total - p.indisp.length} de ${total}</td>
        <td>${p.respondeuEm ? `<span class="tag ok">${esc(p.respondeuEm.slice(0, 5))}</span>` : '<span class="suave">—</span>'}</td></tr>`;
    }).join('')}</table>`;
}
function editarProfessor(nome) {
  const p = nome ? profPorNome(nome) : { nome: '', disciplinas: '', tel: '', maxDia: '', indisp: [], respondeuEm: '', obs: '' };
  PED = { antigo: nome || '', p: p }; DISP = new Set(p.indisp);
  abrirModal(nome ? esc(nome) : 'Novo professor', `
    <div class="linha-campos">
      <label class="campo">Nome *<input id="pNome" value="${esc(p.nome)}"></label>
      <label class="campo">Disciplinas<input id="pDisc" value="${esc(p.disciplinas)}" placeholder="${esc(discProf(p)) || 'Ex.: Matemática'}"></label>
      <label class="campo">WhatsApp<input id="pTel" value="${esc(p.tel)}"></label>
      <label class="campo">Máx. aulas/dia<input id="pMax" type="number" min="1" max="12" value="${p.maxDia || ''}" placeholder="—"></label>
    </div>
    ${p.respondeuEm ? `<div class="aviso ok">Respondeu o formulário em ${esc(p.respondeuEm)}${p.obs ? ` · “${esc(p.obs)}”` : ''}</div>` : ''}
    <div><div class="disp-tit"><h3>Horários (clique para marcar “Não posso”)</h3><span class="tag neutra" id="pResumo"></span></div>${htmlDisp(D.turnos, D.dias)}</div>`,
    `${nome ? '<button class="btn perigo esq" onclick="excluirProfessor()">Excluir</button>' : ''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn prim" onclick="salvarProfessor()">Salvar</button>`);
  window.aoMudarDisp = () => { $('pResumo').textContent = `${totalSlots() - DISP.size} livres`; };
  window.aoMudarDisp();
}
async function salvarProfessor() {
  const dados = { nomeAntigo: PED.antigo, nome: $('pNome').value, disciplinas: $('pDisc').value, maxDia: +$('pMax').value || '', tel: $('pTel').value, indisp: [...DISP] };
  if (await acao('salvarProfessor', dados, 'Professor salvo.')) fecharModal();
}
async function excluirProfessor() {
  if (confirm(`Excluir ${PED.antigo}?`) && await acao('excluirProfessor', { nome: PED.antigo }, 'Professor excluído.')) fecharModal();
}

// ================= Turmas e disciplinas =================
let TU = { sel: null, linhas: [], sujo: false };
function telaTurmas() {
  if (!D.turmas.some(t => t.nome === TU.sel)) { TU.sel = D.turmas[0] ? D.turmas[0].nome : null; TU.sujo = false; }
  if (!TU.sujo) TU.linhas = cargaDe(TU.sel).map(c => ({ disciplina: c.disciplina, professor: c.professor, aulas: c.aulas, duplas: c.duplas, maxDia: c.maxDia }));
  const grupos = D.turnos.map(tn => [tn.nome, D.turmas.filter(t => t.turno === tn.nome)]).concat([['Sem turno', D.turmas.filter(t => !D.turnos.some(x => x.nome === t.turno))]]);
  const lista = grupos.filter(g => g[1].length).map(([nome, ts]) => `<div class="grupo">${esc(nome)}</div>${ts.map(t => {
    const u = somaCarga(t.nome), cap = capacidade(t.nome);
    return `<button class="${t.nome === TU.sel ? 'on' : ''}" data-t="${esc(t.nome)}" onclick="selTurma(this.dataset.t)"><span>${esc(t.nome)}</span><span class="tag ${u === cap ? 'ok' : u > cap ? 'erro' : 'alerta'}">${u}/${cap}</span></button>`;
  }).join('')}`).join('');
  let editor = '<div class="card"><p class="suave">Crie a primeira turma.</p></div>';
  if (TU.sel) {
    const discs = [...new Set(D.carga.map(c => c.disciplina))].sort();
    editor = `<div class="card">
      <div class="cab-tela"><h2>${esc(TU.sel)}</h2><div class="acoes"><button class="btn mini" onclick="editarTurma(TU.sel)">Editar turma</button><button class="btn mini perigo" onclick="excluirTurma()">Excluir</button></div></div>

function gerarGrade() {

function usarOpcao(i) {

function cor(nome) {

}
function linhaIntervalo(tn, a, cols) { return tn.intervaloApos && a === tn.intervaloApos ? `<tr class="intervalo"><td colspan="${cols}">intervalo</td></tr>` : ''; }
function tabelaTurma(turma, editavel) {

}
function tabelaProf(nome) {
  const prof = profPorNome(nome); if (!prof) return '';
  const ind = new Set(prof.indisp), mapa = {}; let total = 0;
  Object.entries(GR.atual || {}).forEach(([k, c]) => {
    if (c.professor !== nome) return;
    const p = k.split('|'), tn = turnoDeTurma(p[0]); if (!tn) return;
    const kk = tn.nome + '|' + p[1] + '|' + p[2]; (mapa[kk] = mapa[kk] || []).push({ t: p[0], c: c, k: k }); total++;
  });
  let h = `<h2 style="margin-bottom:8px">${esc(nome)} <span class="peq suave">· ${total} aulas</span></h2>`;
  D.turnos.forEach(tn => {
    if (!Object.keys(mapa).some(k => k.indexOf(tn.nome + '|') === 0)) return;
    h += `<table class="grade" style="margin-bottom:12px"><tr><th class="hora">${esc(tn.nome)}</th>${D.dias.map(d => `<th>${d}</th>`).join('')}</tr>`;
    for (let a = 0; a < tn.aulas; a++) {
      h += linhaIntervalo(tn, a, D.dias.length + 1) + `<tr><th class="hora">${a + 1}ª · ${horario(tn, a).split('–')[0]}</th>`;
      D.dias.forEach((dia, d) => {
        const l = mapa[tn.nome + '|' + d + '|' + a] || [], livre = !ind.has(dia + '|' + tn.nome + '|' + (a + 1));
        h += `<td class="cel ${!l.length ? (livre ? 'vazia' : 'indisp') : ''} ${l.length > 1 || l.some(x => GR.ruins.has(x.k)) ? 'conf' : ''}" style="${l[0] ? cor(l[0].c.disciplina) : ''}">
          ${l.map(x => `<div class="d">${esc(x.t)}</div><div class="p">${esc(x.c.disciplina)}</div>`).join('')}</td>`;
      });
      h += '</tr>';
    }
    h += '</table>';
  });
  return h;
}
function tabelaGeral() {
  return D.turnos.map(tn => {
    const ts = D.turmas.filter(t => t.turno === tn.nome); if (!ts.length) return '';
    return `<h3 style="margin:6px 0">${esc(tn.nome)}</h3><div style="overflow-x:auto"><table class="grade geral"><tr><th class="turma"></th>${D.dias.map(d => `<th colspan="${tn.aulas}">${d}</th>`).join('')}</tr>
      ${ts.map(t => `<tr><th class="turma">${esc(t.nome)}</th>${D.dias.map((_, d) => Array.from({ length: tn.aulas }, (_, a) => {
        const k = t.nome + '|' + d + '|' + a, c = GR.atual && GR.atual[k];
        return `<td class="cel ${c ? '' : 'vazia'} ${GR.ruins.has(k) ? 'conf' : GR.mudou.has(k) ? 'mudou' : ''}" style="${c ? cor(c.disciplina) : ''}" title="${c ? esc(c.disciplina + ' · ' + c.professor) : ''}"><div class="d">${c ? esc(c.disciplina.slice(0, 4)) : ''}</div></td>`;
      }).join('')).join('')}</tr>`).join('')}</table></div>`;
  }).join('');
}
function desenharGrade() {
  if (!$('conteudo')) return;
  if (!GR.atual) { $('conteudo').innerHTML = `<p class="suave" style="padding:30px;text-align:center">${podeEditar() ? 'Clique em “Gerar opções”.' : 'A grade ainda não foi publicada.'}</p>`; return; }
  $('conteudo').innerHTML = GR.visao === 'turma' ? `<h2 style="margin-bottom:8px">${esc(GR.item)} <span class="peq suave">· ${esc(GR.nome)}${GR.editado ? ' (não salva)' : ''}</span></h2>` + tabelaTurma(GR.item, podeEditar())
    : GR.visao === 'prof' ? tabelaProf(GR.item) : tabelaGeral();
}
function clicarCel(k) {
  if (!GR.sel) { GR.sel = k; return desenharGrade(); }
  if (GR.sel === k || GR.sel.split('|')[0] !== k.split('|')[0]) { GR.sel = GR.sel === k ? null : k; return desenharGrade(); }
  const a = GR.atual[GR.sel], b = GR.atual[k];
  if ((a && a.fixa) || (b && b.fixa)) { toast('Aula fixa não pode ser movida.', 'erro'); GR.sel = null; return desenharGrade(); }
  if (b) GR.atual[GR.sel] = b; else delete GR.atual[GR.sel];
  if (a) GR.atual[k] = a; else delete GR.atual[k];
  GR.sel = null; GR.editado = true; conferir();
}
function imprimir(tipo) {
  if (!tipo || !GR.atual) return;
  const cab = t => `<div class="titulo-imp">${logoHtml(CFG)}<div><b class="marca">${esc(CFG.escola)} · Grade Horária</b><div class="peq suave">${esc(t)}</div></div></div>`;
  const paginas = tipo === 'turmas' ? D.turmas.map(t => cab(t.nome) + tabelaTurma(t.nome, false))
    : tipo === 'profs' ? D.professores.filter(p => aulasProf(p.nome)).map(p => cab('Professor') + tabelaProf(p.nome))
    : [cab(GR.visao === 'geral' ? 'Geral' : GR.item) + $('conteudo').innerHTML];
  $('impressao').innerHTML = paginas.map(p => `<div class="pagina">${p}</div>`).join('');
  document.body.classList.add('imp'); window.print();
  setTimeout(() => document.body.classList.remove('imp'), 800);
}

// ---------- Trocar professor / reencaixar sem mexer no resto ----------
function abrirTroca() {
  if (!Object.keys(D.grade).length) return toast('Salve uma grade oficial antes.', 'erro');
  if (GR.editado) return toast('Salve ou descarte as alterações da grade antes.', 'erro');
  const comAulas = D.professores.filter(p => aulasProf(p.nome)).map(p => p.nome).sort((a, b) => a.localeCompare(b));
  abrirModal('Trocar professor', `
    <p class="peq suave" style="margin:0">O sistema mantém a grade de todos os outros. Se não houver outro jeito, mostra exatamente quais aulas mudam antes de aplicar.</p>
    <div class="linha-campos">
      <label class="campo">Sai<select id="sSai" onchange="linhasTroca()">${comAulas.map(n => `<option>${esc(n)}</option>`).join('')}</select></label>
      <label class="campo">Entra<select id="sEntra"><option value="">O mesmo (só mudou a disponibilidade)</option>${D.professores.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(p => `<option value="${esc(p.nome)}">${esc(p.nome)}${aulasProf(p.nome) ? '' : ' · sem aulas'}</option>`).join('')}</select></label>
    </div>
    <div><div class="campo" style="margin-bottom:6px">Turmas que passam para quem entra</div><div class="sub-linhas" id="sLinhas"></div></div>
    <div id="sRes"></div>`,
    `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn" id="sCalc" onclick="calcularTroca()">Calcular</button><button class="btn prim" id="sAplicar" onclick="aplicarTroca()" disabled>Aplicar e salvar</button>`);
  linhasTroca();
}
function linhasTroca() {
  const sai = $('sSai').value;
  $('sLinhas').innerHTML = D.carga.filter(c => c.professor === sai).map(c => `<label><input type="checkbox" class="sLinha" data-t="${esc(c.turma)}" data-d="${esc(c.disciplina)}" checked>${esc(c.turma)} · ${esc(c.disciplina)}</label>`).join('');
  $('sRes').innerHTML = ''; $('sAplicar').disabled = true; SUB = null;
}
function calcularTroca() {
  const sai = $('sSai').value, entra = $('sEntra').value || sai;
  const linhas = [...document.querySelectorAll('.sLinha:checked')].map(c => ({ turma: c.dataset.t, disciplina: c.dataset.d }));
  if (!linhas.length) return toast('Marque pelo menos uma turma.', 'erro');
  const sel = new Set(linhas.map(l => l.turma + '|' + l.disciplina)), D2 = clone(D), g = clone(D.grade);
  D2.carga.forEach(c => { if (c.professor === sai && sel.has(c.turma + '|' + c.disciplina)) c.professor = entra; });
  Object.entries(g).forEach(([k, c]) => { if (c.professor === sai && sel.has(k.split('|')[0] + '|' + c.disciplina)) c.professor = entra; });
  $('sRes').innerHTML = '<div class="aviso">Calculando…</div>'; $('sCalc').disabled = true; $('sAplicar').disabled = true;
  Gerador.reencaixar(D2, g, entra, r => {
    if (!$('sRes')) return;
    $('sCalc').disabled = false; SUB = { sai: sai, entra: entra, linhas: linhas, r: r };
    if (!r.ok) {
      $('sRes').innerHTML = `<div class="aviso erro">Não foi possível encaixar. ${r.erros.length ? '' : 'Libere mais horários de ' + esc(entra) + ' ou ajuste as aulas abaixo.'}</div>
        <ul class="lista">${r.erros.concat(r.gargalos).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      return;
    }
    const dele = r.nAlvo ? `${r.nAlvo} aula(s) de ${esc(entra)} mudam de horário.` : 'Nenhuma aula muda de horário.';
    $('sRes').innerHTML = !r.outros.length ? `<div class="aviso ok">✔ Os outros professores não mudam. ${dele}</div>`
      : `<div class="aviso alerta">Com a disponibilidade de ${esc(entra)} não dá para manter tudo igual. Mudam <b>${r.outros.length}</b> aula(s) de outros professores (o mínimo possível). ${dele}</div>
         <table class="tab"><tr><th>Professor</th><th>Turma</th><th>Disciplina</th><th>De</th><th>Para</th></tr>${r.outros.map(o => `<tr><td>${esc(o.professor)}</td><td>${esc(o.turma)}</td><td>${esc(o.disciplina)}</td>
           <td>${nomeAula(o.de[0], o.de[1])}</td><td><b>${nomeAula(o.para[0], o.para[1])}</b></td></tr>`).join('')}</table>`;
    $('sAplicar').disabled = false;
  });
}
async function aplicarTroca() {
  if (!SUB || !SUB.r.ok) return;
  const antes = clone(D.grade);
  if (!await acao('substituir', { sai: SUB.sai, entra: SUB.entra, linhas: SUB.linhas, grade: SUB.r.grade }, 'Troca aplicada e grade salva.')) return;
  fecharModal();
  GR.atual = comFixas(clone(D.grade)); GR.nome = 'Oficial'; GR.editado = false; GR.opcoes = [];
  GR.mudou = new Set(Object.keys(GR.atual).filter(k => !antes[k] || antes[k].disciplina !== GR.atual[k].disciplina || antes[k].professor !== GR.atual[k].professor));
  GR.visao = 'geral'; telaGrade();
}

iniciar();
</script>
