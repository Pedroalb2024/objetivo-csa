<style>

  .titulo-imp { display:flex; align-items:center; gap:12px; margin:6px 0 10px; } .titulo-imp .logo { height:40px; }
  .sub-linhas { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .sub-linhas label { display:flex; gap:6px; align-items:center; font-size:13px; }
  #impressao { display:none; }
  @media (max-width:900px) {
    .corpo-app { grid-template-columns:1fr; }
    .menu { flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--borda); padding:8px; position:sticky; top:52px; z-index:10; }

    .corpo-app { display:block; } .tela { padding:0; } body { background:#fff; } .card { border:none; box-shadow:none; padding:0; }

<script>
const CFG = <?!= JSON.stringify(cfg) ?>;
let TOKEN = null, D = null, TELA = 'inicio';
const TODOS = ['admin', 'coordenacao', 'consulta'], EDITA = ['admin', 'coordenacao'];
const NOME_PERFIL = { admin: 'Administrador', coordenacao: 'Coordenação', consulta: 'Consulta' };
const TELAS = [
  { id: 'inicio', nome: 'Início', p: TODOS },
  { id: 'grade', nome: 'Grade horária', p: TODOS },
  { id: 'professores', nome: 'Professores', p: EDITA },
  { id: 'turmas', nome: 'Turmas e disciplinas', p: EDITA },
  { id: 'matriz', nome: 'Matriz curricular', p: EDITA },
  { id: 'fixas', nome: 'Aulas fixas', p: EDITA },
  { id: 'horarios', nome: 'Horários', p: EDITA },
  { id: 'usuarios', nome: 'Usuários', p: ['admin'] },
];
const podeEditar = () => EDITA.includes(D.usuario.perfil);
const clone = o => JSON.parse(JSON.stringify(o));

// ================= Entrada, sessão e navegação =================
function iniciar() {
  $('loginLogo').innerHTML = logoHtml(CFG);
  $('lCredito').textContent = CFG.credito ? 'Sistema por ' + CFG.credito : '';
  let t = null; try { t = sessionStorage.getItem('gh_token'); } catch (e) { }
  if (!t) return mostrarLogin();
  TOKEN = t; ocupado(true);
  chamar('api', TOKEN, 'carregar').then(d => { D = d; abrirApp(); }).catch(() => { TOKEN = null; mostrarLogin(); }).finally(() => ocupado(false));
}
async function entrar(ev) {
  ev.preventDefault(); $('lErro').hidden = true; $('lBtn').disabled = true; ocupado(true);
  try {
    const r = await chamar('login', $('lUsuario').value, $('lSenha').value);
    TOKEN = r.token; try { sessionStorage.setItem('gh_token', TOKEN); } catch (e) { }
    D = await chamar('api', TOKEN, 'carregar'); $('lSenha').value = ''; TELA = 'inicio'; abrirApp();
  } catch (e) { $('lErro').textContent = e.message; $('lErro').hidden = false; }
  finally { $('lBtn').disabled = false; ocupado(false); }
}
function mostrarLogin(msg) {
  $('app').hidden = true; $('login').hidden = false;
  if (msg) { $('lErro').textContent = msg; $('lErro').hidden = false; }
  setTimeout(() => $('lUsuario').focus(), 50);
}
function abrirApp() {
  $('login').hidden = true; $('app').hidden = false;
  $('topoLogo').innerHTML = logoHtml(CFG, true);
  $('topoUsuario').textContent = D.usuario.nome;
  $('menu').innerHTML = TELAS.filter(t => t.p.includes(D.usuario.perfil)).map(t => `<button data-t="${t.id}" onclick="ir('${t.id}')">${t.nome}</button>`).join('');
  GR = novoGR(); ir(TELA, true);
}
async function sair() {
  if (temAlteracao() && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  try { await chamar('sair', TOKEN); } catch (e) { }
  TOKEN = null; D = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  TU = { sel: null, linhas: [], sujo: false }; HO = null; FX = null; MZ = null; mostrarLogin();
}
function expirou() {
  TOKEN = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  fecharModal(); mostrarLogin('Sua sessão expirou. Entre novamente.'); return false;
}
async function acao(nome, dados, msgOk) {
  ocupado(true);
  try { D = await chamar('api', TOKEN, nome, dados); if (msgOk) toast(msgOk); render(); return true; }
  catch (e) { if (/SESSAO_EXPIRADA/.test(e.message)) return expirou(); toast(e.message, 'erro'); return false; }
  finally { ocupado(false); }
}
async function consultar(nome, dados) {   // ação só de leitura (não muda D)
  ocupado(true);
  try { return await chamar('api', TOKEN, nome, dados); }
  catch (e) { if (/SESSAO_EXPIRADA/.test(e.message)) return expirou() || null; toast(e.message, 'erro'); return null; }
  finally { ocupado(false); }
}
const sujoTela = t => (t === 'turmas' && TU.sujo) || (t === 'horarios' && HO_SUJO) || (t === 'fixas' && FX_SUJO) || (t === 'matriz' && MZ && MZ.sujo);
function temAlteracao() { return TU.sujo || !!HO_SUJO || !!FX_SUJO || !!(MZ && MZ.sujo) || (GR && GR.editado); }
function ir(t, forcar) {
  if (!TELAS.some(x => x.id === t && x.p.includes(D.usuario.perfil))) t = 'inicio';
  if (!forcar && t !== TELA) {
    if (sujoTela(TELA) && !confirm('Há alterações não salvas nesta tela. Sair sem salvar?')) return;
    if (TELA === 'turmas') TU.sujo = false; if (TELA === 'horarios') { HO = null; HO_SUJO = false; } if (TELA === 'fixas') { FX = null; FX_SUJO = false; } if (TELA === 'matriz') MZ = null;
  }
  TELA = t;
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  render(); window.scrollTo(0, 0);
}
function render() {
  ({ inicio: telaInicio, professores: telaProfessores, turmas: telaTurmas, matriz: telaMatriz, grade: telaGrade, fixas: telaFixas, horarios: telaHorarios, usuarios: telaUsuarios })[TELA]();
}
function cabecalho(tit, acoes) { return `<div class="cab-tela"><h1>${tit}</h1><div class="acoes">${acoes || ''}</div></div>`; }
function abrirModal(titulo, corpo, rodape) {
  $('modalCaixa').innerHTML = `<div class="cab"><h2>${titulo}</h2><button class="link" onclick="fecharModal()" style="font-size:22px;color:var(--suave)">×</button></div><div class="corpo">${corpo}</div><div class="rod">${rodape}</div>`;
  $('modal').hidden = false;
}
function fecharModal() { $('modal').hidden = true; $('modalCaixa').innerHTML = ''; window.aoMudarDisp = null; }

// ---------- ajudantes ----------
const profPorNome = n => D.professores.find(p => p.nome === n);
const gradeDe = nome => D.grades.find(g => g.nome === nome);
const turmaDe = nome => D.turmas.find(t => t.nome === nome);
const gradeDaTurma = nome => { const t = turmaDe(nome); return t && gradeDe(t.grade); };
const aulasTurma = nome => aulasDe(gradeDaTurma(nome));
const capacidade = nome => aulasTurma(nome).length * D.dias.length;
const cargaDe = turma => D.carga.filter(c => c.turmas.includes(turma));
const linhaDe = (turma, disc) => D.carga.find(c => c.turmas.includes(turma) && c.disciplina === disc);
const somaCarga = turma => cargaDe(turma).reduce((s, c) => s + c.aulas, 0);
const aulasProf = nome => D.carga.filter(c => c.professor === nome).reduce((s, c) => s + c.aulas, 0);
const discProf = p => p.disciplinas || [...new Set(D.carga.filter(c => c.professor === p.nome).map(c => c.disciplina))].join(', ');
const totalFaixas = () => D.dias.length * Object.values(D.faixas).reduce((s, h) => s + h.length, 0);
const sigla = disc => { const c = D.componentes.find(x => x.nome === disc); return (c && c.sigla) || disc; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const horasTxt = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min';
const msgForm = () => `Olá! Aqui é a coordenação do ${CFG.escola}. Marque neste link os horários em que você não pode dar aula: ${D.linkForm}`;
const whatsForm = () => 'https:\/\/wa.me/?text=' + encodeURIComponent(msgForm());
const ordenarNomes = l => l.slice().sort((a, b) => a.localeCompare(b, 'pt'));
// Diferenças entre a carga da turma e a matriz da série dela
function difMatriz(t) {
  const alvo = D.matriz.filter(m => m.serie === t.serie); if (!alvo.length) return [];
  const tem = {}; cargaDe(t.nome).forEach(c => tem[c.disciplina] = c.aulas);
  const dif = alvo.filter(m => tem[m.componente] !== m.aulas).map(m => `${sigla(m.componente)} ${tem[m.componente] || 0}→${m.aulas}`);
  Object.keys(tem).filter(d => !alvo.some(m => m.componente === d)).forEach(d => dif.push(`${sigla(d)} fora da matriz`));
  return dif;
}

// ================= Início =================
function telaInicio() {
  const resp = D.professores.filter(p => p.respondeuEm).length, regulares = D.turmas.filter(t => t.segmento !== 'Extra');
  const completas = regulares.filter(t => somaCarga(t.nome) === capacidade(t.nome)).length;
  const nGrade = Object.keys(D.grade).length;
  let h = cabecalho(`Olá, ${esc(D.usuario.nome.split(' ')[0])}`) + `<div class="stats">
    <div class="card stat" onclick="ir('grade')"><b>${nGrade ? 'Salva' : 'Não salva'}</b><span>grade horária oficial</span></div>`;
  if (podeEditar()) {
    h += `<div class="card stat" onclick="ir('professores')"><b>${resp}/${D.professores.length}</b><span>professores responderam o formulário</span></div>
      <div class="card stat" onclick="ir('turmas')"><b>${completas}/${regulares.length}</b><span>turmas com todos os horários preenchidos</span></div>`;
    const pend = [];
    if (D.professores.length && D.carga.length) Gerador.modelo(D).erros.forEach(e => pend.push(e));
    D.turmas.filter(t => !t.segmento).forEach(t => pend.push(`Turma ${t.nome}: escolha o segmento (EFAI, EFAF, EM ou Extra).`));
    regulares.forEach(t => {
      if (t.segmento && !t.serie) pend.push(`Turma ${t.nome}: escolha a série.`);
      if (somaCarga(t.nome) !== capacidade(t.nome)) pend.push(`Turma ${t.nome}: ${somaCarga(t.nome)} de ${capacidade(t.nome)} horários preenchidos.`);
      const dif = difMatriz(t);
      if (dif.length) pend.push(`Turma ${t.nome}: diferente da matriz do ${t.serie} (${dif.slice(0, 3).join(', ')}${dif.length > 3 ? '…' : ''}).`);
    });
    D.professores.filter(p => !aulasProf(p.nome) && p.respondeuEm).forEach(p => pend.push(`${p.nome} respondeu o formulário e ainda não tem aulas.`));
    h += '</div>' + (pend.length ? `<div class="card"><h2>Pendências <span class="tag alerta">${pend.length}</span></h2><ul class="lista">${pend.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '<div class="aviso ok">Nenhuma pendência.</div>');
  } else h += '</div>';
  $('tela').innerHTML = h;
}

// ================= Professores =================
let BUSCA = '', PED = null;
function telaProfessores() {
  $('tela').innerHTML = cabecalho('Professores',
    `<button class="btn" onclick="copiar(D.linkForm)">Copiar link do formulário</button><a class="btn" target="_blank" href="${esc(whatsForm())}">Enviar no WhatsApp</a>
     <button class="btn prim" onclick="editarProfessor()">+ Professor</button>`)
    + `<div class="card"><input placeholder="Buscar…" value="${esc(BUSCA)}" oninput="BUSCA=this.value;listaProfessores()" style="max-width:280px;margin-bottom:8px"><div id="listaProf" class="rolar"></div></div>`;
  listaProfessores();
}
function listaProfessores() {
  const total = totalFaixas(), l = D.professores.filter(p => (p.nome + ' ' + p.completo + ' ' + discProf(p)).toLowerCase().indexOf(BUSCA.toLowerCase()) >= 0);
  $('listaProf').innerHTML = !D.professores.length ? '<p class="suave">Nenhum professor. Envie o link do formulário ou clique em “+ Professor”.</p>' :

// ================= Turmas e disciplinas =================
let TU = { sel: null, linhas: [], sujo: false };
function telaTurmas() {
  if (!D.turmas.some(t => t.nome === TU.sel)) { TU.sel = D.turmas[0] ? D.turmas[0].nome : null; TU.sujo = false; }
  if (!TU.sujo) TU.linhas = cargaDe(TU.sel).map(c => ({ disciplina: c.disciplina, professor: c.professor, aulas: c.aulas, duplas: c.duplas, maxDia: c.maxDia, juntas: c.turmas.filter(t => t !== TU.sel) }));
  const grupos = D.grades.map(g => [g.nome, D.turmas.filter(t => t.grade === g.nome)]).concat([['Sem grade de horário', D.turmas.filter(t => !gradeDe(t.grade))]]);
  const lista = grupos.filter(g => g[1].length).map(([nome, ts]) => `<div class="grupo">${esc(nome)}</div>${ts.map(t => {
    const u = somaCarga(t.nome), cap = capacidade(t.nome), cls = t.segmento === 'Extra' ? (u > cap ? 'erro' : 'neutra') : u === cap ? 'ok' : u > cap ? 'erro' : 'alerta';
    return `<button class="${t.nome === TU.sel ? 'on' : ''}" data-t="${esc(t.nome)}" onclick="selTurma(this.dataset.t)"><span>${esc(t.nome)}</span><span class="tag ${cls}">${u}/${cap}</span></button>`;
  }).join('')}`).join('');
  let editor = '<div class="card"><p class="suave">Crie a primeira turma.</p></div>';
  if (TU.sel) {
    const t = turmaDe(TU.sel), discs = ordenarNomes([...new Set(D.componentes.map(c => c.nome).concat(D.carga.map(c => c.disciplina)))]);
    const profs = ordenarNomes(D.professores.map(p => p.nome)), temJunta = TU.linhas.some(l => l.juntas.length);
    editor = `<div class="card">
      <div class="cab-tela"><div><h2>${esc(TU.sel)}</h2><span class="peq suave">${esc([t.segmento, t.serie, t.grade].filter(Boolean).join(' · '))}</span></div>
        <div class="acoes"><button class="btn mini" onclick="editarTurma(TU.sel)">Editar turma</button><button class="btn mini perigo" onclick="excluirTurma()">Excluir</button></div></div>
      <div class="rolar"><table class="tab"><tr><th>Disciplina</th><th>Professor</th><th>Aulas/sem.</th><th title="Quantas vezes por semana a aula é dupla (duas seguidas, sem intervalo no meio)">Duplas</th><th title="Máximo dessa disciplina no mesmo dia">Máx./dia</th><th title="Outras turmas que têm esta aula junto, no mesmo horário e com o mesmo professor">Junto com</th><th></th></tr>
        ${TU.linhas.map((l, i) => `<tr>
          <td><input list="listaDisc" value="${esc(l.disciplina)}" oninput="TU.linhas[${i}].disciplina=this.value;sujar()"></td>
          <td><select onchange="TU.linhas[${i}].professor=this.value;sujar()"><option value="">— a definir —</option>${profs.map(p => `<option ${p === l.professor ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></td>
          <td><input type="number" min="1" value="${l.aulas || ''}" oninput="TU.linhas[${i}].aulas=+this.value;sujar()"></td>
          <td><input type="number" min="0" value="${l.duplas || 0}" oninput="TU.linhas[${i}].duplas=+this.value;sujar()"></td>
          <td><input type="number" min="1" value="${l.maxDia || 2}" oninput="TU.linhas[${i}].maxDia=+this.value;sujar()"></td>
          <td><button class="btn mini" onclick="escolherJuntas(${i})">${l.juntas.length ? esc(l.juntas.join(', ')) : '—'}</button></td>
          <td><button class="link" style="color:var(--erro)" onclick="TU.linhas.splice(${i},1);sujar(true)">✕</button></td></tr>`).join('')}
      </table></div>
      ${temJunta ? '<p class="peq suave" style="margin:8px 0 0">Linhas com “Junto com” são compartilhadas: o que mudar aqui muda também nas outras turmas.</p>' : ''}
      <datalist id="listaDisc">${discs.map(d => `<option value="${esc(d)}">`).join('')}</datalist>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">
        <button class="btn" onclick="TU.linhas.push({disciplina:'',professor:'',aulas:'',duplas:0,maxDia:2,juntas:[]});sujar(true)">+ Disciplina</button>
        <select style="width:auto" onchange="copiarDisciplinas(this.value)"><option value="">Copiar de…</option>${D.turmas.filter(x => x.nome !== TU.sel).map(x => `<option>${esc(x.nome)}</option>`).join('')}</select>
        <span id="tuTotal" style="margin-left:auto"></span>
        <button class="btn" id="tuDesc" onclick="TU.sujo=false;telaTurmas()">Descartar</button>
        <button class="btn prim" id="tuSalvar" onclick="salvarCarga()">Salvar</button>
      </div></div>`;
  }
  $('tela').innerHTML = cabecalho('Turmas e disciplinas', '<button class="btn prim" onclick="editarTurma()">+ Turma</button>')
    + `<div class="duas"><div class="card lista-turmas" style="padding:8px">${lista || '<p class="suave" style="padding:8px">Nenhuma turma.</p>'}</div>${editor}</div>`;
  if (TU.sel) atualizarTotal();
}
function sujar(redesenhar) { TU.sujo = true; redesenhar ? telaTurmas() : atualizarTotal(); }
function atualizarTotal() {
  const u = TU.linhas.reduce((s, l) => s + (+l.aulas || 0), 0), cap = capacidade(TU.sel), extra = (turmaDe(TU.sel) || {}).segmento === 'Extra';
  $('tuTotal').innerHTML = `<span class="tag ${u > cap ? 'erro' : extra ? 'neutra' : u === cap ? 'ok' : 'alerta'}">${u} de ${cap} horários</span>`;
  $('tuSalvar').disabled = $('tuDesc').disabled = !TU.sujo;
}
function selTurma(n) {
  if (TU.sujo && !confirm('Há alterações não salvas nesta turma. Trocar mesmo assim?')) return;
  TU = { sel: n, linhas: [], sujo: false }; telaTurmas();
}
function escolherJuntas(i) {
  const t = turmaDe(TU.sel), opc = D.turmas.filter(x => x.nome !== TU.sel && x.grade === t.grade), l = TU.linhas[i];
  abrirModal('Turmas juntas', `<p class="peq suave" style="margin:0">${esc(l.disciplina || 'Esta disciplina')} acontece ao mesmo tempo, com o mesmo professor, em ${esc(TU.sel)} e nas turmas marcadas (só turmas da grade ${esc(t.grade)}).</p>
    <div class="sub-linhas">${opc.map(x => `<label><input type="checkbox" class="jT" value="${esc(x.nome)}" ${l.juntas.includes(x.nome) ? 'checked' : ''}>${esc(x.nome)}</label>`).join('') || '<span class="suave">Nenhuma outra turma nesta grade.</span>'}</div>`,
    `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn prim" onclick="confirmarJuntas(${i})">Ok</button>`);
}
function confirmarJuntas(i) { TU.linhas[i].juntas = [...document.querySelectorAll('.jT:checked')].map(x => x.value); fecharModal(); sujar(true); }
function copiarDisciplinas(origem) {
  if (!origem) return;
  if (TU.linhas.length && !confirm(`Substituir as disciplinas de ${TU.sel} pelas de ${origem}?`)) return telaTurmas();
  TU.linhas = cargaDe(origem).map(c => ({ disciplina: c.disciplina, professor: c.professor, aulas: c.aulas, duplas: c.duplas, maxDia: c.maxDia, juntas: [] }));
  sujar(true);
}
async function salvarCarga() {
  TU.sujo = false;
  if (!await acao('salvarCarga', { turma: TU.sel, linhas: TU.linhas }, 'Disciplinas salvas.')) { TU.sujo = true; atualizarTotal(); }
}
function editarTurma(nome) {
  const t = nome ? turmaDe(nome) : { nome: '', segmento: 'EFAI', serie: '', grade: D.grades[0] ? D.grades[0].nome : '' };
  abrirModal(nome ? 'Editar turma' : 'Nova turma', `<div class="linha-campos">
      <label class="campo">Nome *<input id="tNome" value="${esc(t.nome)}" placeholder="Ex.: 6A"></label>
      <label class="campo">Segmento<select id="tSeg" onchange="seriesTurma()">${Object.keys(D.series).map(s => `<option ${s === t.segmento ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label class="campo">Série<select id="tSerie"></select></label>
      <label class="campo">Grade de horário<select id="tGrade">${D.grades.map(x => `<option ${x.nome === t.grade ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label>
      ${nome ? '' : `<label class="campo">Copiar disciplinas de<select id="tCopia"><option value="">—</option>${D.turmas.map(x => `<option>${esc(x.nome)}</option>`).join('')}</select></label>`}
    </div>`, `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn prim" data-antigo="${esc(nome || '')}" onclick="salvarTurma(this.dataset.antigo)">Salvar</button>`);

function seriesTurma(atual) {
  const l = D.series[$('tSeg').value] || [];
  $('tSerie').innerHTML = l.length ? l.map(s => `<option ${s === atual ? 'selected' : ''}>${s}</option>`).join('') : '<option value="">— (contraturno)</option>';

}
async function salvarTurma(antigo) {
  const nome = $('tNome').value.trim(), copia = !antigo && $('tCopia').value;
  if (TU.sujo && !confirm('Há alterações não salvas nas disciplinas. Continuar mesmo assim?')) return;
  if (!await acao('salvarTurma', { nomeAntigo: antigo, nome: nome, segmento: $('tSeg').value, serie: $('tSerie').value, grade: $('tGrade').value }, 'Turma salva.')) return;
  fecharModal(); TU = { sel: nome, linhas: [], sujo: false };
  if (copia) await acao('salvarCarga', { turma: nome, linhas: cargaDe(copia).map(c => ({ ...c, juntas: [] })) }, 'Disciplinas copiadas.');

async function excluirTurma() {
  if (!confirm(`Excluir a turma ${TU.sel} e tudo dela (disciplinas, fixas e aulas na grade)? Em linhas com turmas juntas, só ${TU.sel} sai.`)) return;

// ================= Matriz curricular =================
const SEGS_MATRIZ = ['EFAI', 'EFAF', 'EM'];
let MZ = null;
function iniciarMZ(aba) {
  const m = {}, ordem = {};
  D.matriz.forEach(x => (m[x.serie] = m[x.serie] || {})[x.componente] = x.aulas);
  SEGS_MATRIZ.forEach(seg => { ordem[seg] = []; D.matriz.forEach(x => { if (D.series[seg].includes(x.serie) && !ordem[seg].includes(x.componente)) ordem[seg].push(x.componente); }); });
  MZ = { aba: aba || 'EFAI', m, ordem, comps: D.componentes.map(c => ({ nome: c.nome, nomeAntigo: c.nome, sigla: c.sigla, apelidos: c.apelidos.join('; ') })), sujo: false };
}
function mzSujo() { MZ.sujo = true; $('mzSalvar').disabled = $('mzDesc').disabled = false; }
const mzComp = nome => MZ.comps.find(c => c.nome === nome);
function telaMatriz() {
  if (!MZ) iniciarMZ();
  const abas = SEGS_MATRIZ.concat(['Componentes']).map(a => `<button class="btn mini ${MZ.aba === a ? 'on' : ''}" onclick="MZ.aba='${a}';telaMatriz()">${a === 'Componentes' ? 'Componentes e siglas' : a}</button>`).join('');
  $('tela').innerHTML = cabecalho('Matriz curricular',
    `<button class="btn" id="mzDesc" onclick="iniciarMZ(MZ.aba);telaMatriz()" ${MZ.sujo ? '' : 'disabled'}>Descartar</button>
     <button class="btn" id="mzSalvar" onclick="salvarMatriz()" ${MZ.sujo ? '' : 'disabled'}>Salvar</button>
     <button class="btn prim" onclick="abrirAplicar()">Aplicar matriz às turmas</button>`)
    + `<div class="card"><div class="abas">${abas}</div><div id="mzCorpo" class="rolar"></div></div>`;
  if (MZ.aba === 'Componentes') tabelaComps(); else tabelaMatriz(MZ.aba);
}
function tabelaMatriz(seg) {
  const series = D.series[seg], comps = MZ.ordem[seg];
  $('mzCorpo').innerHTML = `<table class="tab mz"><tr><th>Componente</th><th>Sigla</th>${series.map(s => `<th>${s}</th>`).join('')}<th></th></tr>
    ${comps.map((nome, i) => `<tr><td><input list="mzLista" value="${esc(nome)}" data-seg="${seg}" data-i="${i}" onchange="mzTrocarLinha(this)"></td>
      <td><input value="${esc((mzComp(nome) || {}).sigla || '')}" data-c="${esc(nome)}" oninput="mzSigla(this)" style="max-width:110px"></td>
      ${series.map(s => `<td><input type="number" min="0" max="40" value="${(MZ.m[s] || {})[nome] || ''}" data-s="${s}" data-c="${esc(nome)}" oninput="mzValor(this)"></td>`).join('')}
      <td><button class="link" style="color:var(--erro)" data-seg="${seg}" data-i="${i}" onclick="mzRemover(this)">✕</button></td></tr>`).join('')}
    <tr class="total"><td>Total</td><td></td>${series.map((s, j) => `<td id="mzT${j}"></td>`).join('')}<td></td></tr></table>
    <datalist id="mzLista">${MZ.comps.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist>
    <button class="btn" style="margin-top:12px" onclick="MZ.ordem['${seg}'].push('');mzSujo();telaMatriz()">+ Componente</button>`;
  mzTotais(seg);
}
function mzTotais(seg) {
  D.series[seg].forEach((s, j) => {
    const tot = MZ.ordem[seg].reduce((x, c) => x + ((MZ.m[s] || {})[c] || 0), 0);
    const caps = [...new Set(D.turmas.filter(t => t.serie === s && t.segmento !== 'Extra').map(t => capacidade(t.nome)))];
    const cls = !caps.length ? 'neutra' : caps.every(c => c === tot) ? 'ok' : 'alerta';
    $('mzT' + j).innerHTML = `<span class="tag ${cls}" title="${caps.length ? 'Horários na grade das turmas: ' + caps.join(', ') : 'Nenhuma turma nesta série'}">${tot}${caps.length && caps[0] !== tot ? ' / ' + caps[0] : ''}</span>`;
  });
}
function mzValor(inp) { (MZ.m[inp.dataset.s] = MZ.m[inp.dataset.s] || {})[inp.dataset.c] = +inp.value || 0; mzSujo(); mzTotais(MZ.aba); }
function mzSigla(inp) {
  let c = mzComp(inp.dataset.c); if (!c) MZ.comps.push(c = { nome: inp.dataset.c, nomeAntigo: '', sigla: '', apelidos: '' });
  c.sigla = inp.value; mzSujo();
}
function mzTrocarLinha(inp) {   // escolhe outro componente para a linha (move os números)
  const seg = inp.dataset.seg, i = +inp.dataset.i, velho = MZ.ordem[seg][i], novo = inp.value.trim();
  if (novo && MZ.ordem[seg].some((c, j) => c === novo && j !== i)) { toast(`${novo} já está na tabela.`, 'erro'); return telaMatriz(); }
  D.series[seg].forEach(s => { const m = MZ.m[s] = MZ.m[s] || {}; if (velho in m) { if (novo) m[novo] = m[velho]; delete m[velho]; } });
  MZ.ordem[seg][i] = novo;
  if (novo && !mzComp(novo)) MZ.comps.push({ nome: novo, nomeAntigo: '', sigla: '', apelidos: '' });
  mzSujo(); telaMatriz();
}
function mzRemover(b) {
  const seg = b.dataset.seg, i = +b.dataset.i, velho = MZ.ordem[seg][i];
  D.series[seg].forEach(s => { if (MZ.m[s]) delete MZ.m[s][velho]; });
  MZ.ordem[seg].splice(i, 1); mzSujo(); telaMatriz();
}
function tabelaComps() {
  const naMatriz = nome => Object.values(MZ.m).some(m => m[nome] > 0), naCarga = nome => D.carga.some(c => c.disciplina === nome);
  $('mzCorpo').innerHTML = `<p class="peq suave" style="margin:0 0 10px">Sigla: usada na grade e na impressão. Apelidos: como o componente aparece no aSc (separe por “;”), para reconhecer a disciplina na importação.</p>
    <table class="tab"><tr><th>Componente</th><th>Sigla</th><th>Apelidos (aSc)</th><th>Uso</th><th></th></tr>
    ${MZ.comps.map((c, i) => { const uso = naMatriz(c.nome) ? 'Matriz' : naCarga(c.nome) ? 'Contraturno / carga' : '—'; return `<tr>
      <td><input value="${esc(c.nome)}" data-i="${i}" onchange="mzRenomear(this)"></td>
      <td><input value="${esc(c.sigla)}" oninput="MZ.comps[${i}].sigla=this.value;mzSujo()" style="max-width:110px"></td>
      <td><input value="${esc(c.apelidos)}" oninput="MZ.comps[${i}].apelidos=this.value;mzSujo()" placeholder="Ex.: Líng. Port."></td>
      <td class="suave peq" style="white-space:nowrap">${uso}</td>
      <td>${uso === 'Matriz' ? '' : `<button class="link" style="color:var(--erro)" onclick="MZ.comps.splice(${i},1);mzSujo();telaMatriz()">✕</button>`}</td></tr>`; }).join('')}</table>
    <button class="btn" style="margin-top:12px" onclick="MZ.comps.push({nome:'',nomeAntigo:'',sigla:'',apelidos:''});mzSujo();telaMatriz()">+ Componente</button>`;

function hoMudou(i, redesenhar) { HO_SUJO = true; redesenhar ? telaHorarios() : hoPrevia(i); }
function hoAdd(i, tipo) {
  const it = HO[i].itens, ult = it[it.length - 1], aulas = it.filter(x => x.tipo !== 'intervalo'), ua = aulas[aulas.length - 1];
  const ini = ult && !isNaN(minutos(ult.fim)) ? minutos(ult.fim) : 420, dur = tipo === 'intervalo' ? 20 : ua ? (minutos(ua.fim) - minutos(ua.ini)) || 50 : 50;
  it.push({ tipo, ini: hhmm(ini), fim: hhmm(ini + dur) }); hoMudou(i, true);
}
function problemaItens(itens) {   // mesma regra do servidor
  if (!itens.some(i => i.tipo !== 'intervalo')) return 'Precisa de pelo menos uma aula.';
  let ant = null;
  for (let k = 0; k < itens.length; k++) {
    const a = minutos(itens[k].ini), b = minutos(itens[k].fim), nome = `Linha ${k + 1}`;
    if (isNaN(a) || isNaN(b)) return `${nome}: preencha início e fim.`;
    if (a % 10 || b % 10) return `${nome}: use horários de 10 em 10 minutos.`;
    if (b <= a) return `${nome}: o fim precisa ser depois do início.`;
    if (ant !== null && a < ant) return `${nome}: começa antes do fim da linha anterior.`;
    ant = b;

}
function hoPrevia(i) {
  const g = HO[i], ini0 = 7 * 60, fim0 = 19 * 60, pos = m => ((m - ini0) / (fim0 - ini0) * 100).toFixed(2) + '%';
  const larg = (a, b) => ((b - a) / (fim0 - ini0) * 100).toFixed(2) + '%';

    const iv = it.tipo === 'intervalo', rot = iv ? '' : ++n + 'ª';
    return `<span class="${iv ? 'int' : 'aula'}" style="left:${pos(a)};width:${larg(a, b)}" title="${iv ? 'Intervalo' : rot + ' aula'} ${faixaTxt(a, b)}">${rot}</span>`;
  }).join('');

  let h = `<table class="grade"><tr><th class="hora"></th>${D.dias.map(d => `<th>${d}</th>`).join('')}</tr>`, a = 0;
  g.itens.forEach(it => {
    if (it.tipo === 'intervalo') { h += `<tr class="intervalo"><td colspan="${D.dias.length + 1}">intervalo · ${faixaTxt(minutos(it.ini), minutos(it.fim))}</td></tr>`; return; }
    h += `<tr><th class="hora">${a + 1}ª<small>${faixaTxt(minutos(it.ini), minutos(it.fim))}</small></th>`;
    D.dias.forEach((_, d) => {
      const k = turma + '|' + d + '|' + a, c = GR.atual && GR.atual[k], l = c && linhaDe(turma, c.disciplina);
      const junta = l && l.turmas.length > 1 ? ' · c/ ' + l.turmas.filter(t => t !== turma).join(', ') : '';
      h += `<td class="cel ${c ? '' : 'vazia'} ${GR.sel === k ? 'sel' : ''} ${GR.ruins.has(k) ? 'conf' : GR.mudou.has(k) ? 'mudou' : ''}" style="${c ? cor(c.disciplina) : ''}" title="${c ? esc(c.disciplina + ' · ' + c.professor + junta) : ''}" ${editavel ? `data-k="${esc(k)}" onclick="clicarCel(this.dataset.k)"` : ''}>
        ${c ? `${c.fixa ? '<span class="lock" title="Aula fixa">🔒</span>' : ''}<div class="d">${esc(sigla(c.disciplina))}</div><div class="p">${esc(c.professor + junta)}</div>` : ''}</td>`;
    });
    h += '</tr>'; a++;
  });
  return h + '</table>';
}
// Visão do professor em tempo real: linhas = horários reais das grades em que ele dá aula + blocos dele
function tabelaProf(nome) {
  const prof = profPorNome(nome); if (!prof) return '';
  const ind = new Set(prof.indisp), itens = {}, usadas = new Set();
  Object.entries(GR.atual || {}).forEach(([k, c]) => {
    if (c.professor !== nome) return;
    const [t, ds, as] = k.split('|'), g = gradeDaTurma(t), x = aulasDe(g)[+as]; if (!x) return;
    usadas.add(g.nome);
    const id = ds + '|' + x.ini + '|' + x.fim + '|' + c.disciplina, e = itens[id] = itens[id] || { d: +ds, ini: x.ini, fim: x.fim, disc: c.disciplina, turmas: [], chaves: [] };
    e.turmas.push(t); e.chaves.push(k);
  });
  const blocos = D.blocos.filter(b => b.professor === nome).map(b => ({ d: D.dias.indexOf(b.dia), ini: minutos(b.ini), fim: minutos(b.fim), b }));
  const linhas = new Map(), lista = Object.values(itens);
  usadas.forEach(gn => aulasDe(gradeDe(gn)).forEach(x => linhas.set(x.ini + '|' + x.fim, x)));
  lista.concat(blocos).forEach(x => linhas.set(x.ini + '|' + x.fim, { ini: x.ini, fim: x.fim }));
  const ord = [...linhas.values()].sort((a, b) => a.ini - b.ini || a.fim - b.fim);
  let h = `<h2 style="margin-bottom:8px">${esc(nome)} <span class="peq suave">· ${lista.length} aulas${blocos.length ? ' · ' + blocos.length + ' bloco(s)' : ''}</span></h2>`;
  if (!ord.length) return h + '<p class="suave">Sem aulas.</p>';
  [['Manhã', ord.filter(x => x.ini < 780)], ['Tarde', ord.filter(x => x.ini >= 780)]].forEach(([per, rows]) => {
    if (!rows.length) return;
    h += `<table class="grade" style="margin-bottom:12px"><tr><th class="hora">${per}</th>${D.dias.map(d => `<th>${d}</th>`).join('')}</tr>`;
    rows.forEach(r => {
      h += `<tr><th class="hora">${faixaTxt(r.ini, r.fim)}</th>`;
      D.dias.forEach((dia, d) => {
        const aqui = lista.filter(x => x.d === d && x.ini === r.ini && x.fim === r.fim), bl = blocos.filter(x => x.d === d && x.ini === r.ini && x.fim === r.fim);
        let fora = false; for (let hh = Math.floor(r.ini / 60); hh * 60 < r.fim; hh++) if (ind.has(dia + '|' + hh)) fora = true;
        const conf = aqui.some(x => x.chaves.some(k => GR.ruins.has(k)));
        h += `<td class="cel ${!aqui.length && !bl.length ? (fora ? 'indisp' : 'vazia') : ''} ${conf ? 'conf' : ''}" style="${aqui[0] ? cor(aqui[0].disc) : bl.length ? 'background:#fbf6e6' : ''}">
          ${aqui.map(x => `<div class="d">${esc(x.turmas.join(' + '))}</div><div class="p">${esc(sigla(x.disc))}</div>`).join('')}
          ${bl.map(x => `<div class="d bloco">${x.b.tipo === 'Plantão de Dúvidas' ? 'Plantão' : 'Compl. C.H.'}</div><div class="p">${esc(x.b.disciplina || '')}</div>`).join('')}</td>`;
      });
      h += '</tr>';
    });
    h += '</table>';
  });
  return h;
}
function tabelaGeral() {
  return D.grades.map(g => {
    const ts = D.turmas.filter(t => t.grade === g.nome), au = aulasDe(g); if (!ts.length) return '';
    return `<h3 style="margin:6px 0">${esc(g.nome)}</h3><div class="rolar"><table class="grade geral" style="min-width:${120 + au.length * D.dias.length * 34}px"><tr><th class="turma"></th>${D.dias.map(d => `<th colspan="${au.length}">${d}</th>`).join('')}</tr>
      ${ts.map(t => `<tr><th class="turma">${esc(t.nome)}</th>${D.dias.map((_, d) => au.map((x, a) => {
        const k = t.nome + '|' + d + '|' + a, c = GR.atual && GR.atual[k];
        return `<td class="cel ${c ? '' : 'vazia'} ${GR.ruins.has(k) ? 'conf' : GR.mudou.has(k) ? 'mudou' : ''}" style="${c ? cor(c.disciplina) : ''}" title="${c ? esc(faixaTxt(x.ini, x.fim) + ' · ' + c.disciplina + ' · ' + c.professor) : ''}"><div class="d">${c ? esc(sigla(c.disciplina)) : ''}</div></td>`;
      }).join('')).join('')}</tr>`).join('')}</table></div>`;
  }).join('');
}
function desenharGrade() {
  if (!$('conteudo')) return;
  if (!GR.atual) { $('conteudo').innerHTML = `<p class="suave" style="padding:30px;text-align:center">${podeEditar() ? 'Clique em “Gerar opções”.' : 'A grade ainda não foi publicada.'}</p>`; return; }
  $('conteudo').innerHTML = GR.visao === 'turma' ? `<h2 style="margin-bottom:8px">${esc(GR.item)} <span class="peq suave">· ${esc(GR.nome)}${GR.editado ? ' (não salva)' : ''}</span></h2>` + tabelaTurma(GR.item, podeEditar())
    : GR.visao === 'prof' ? tabelaProf(GR.item) : tabelaGeral();
}
// Troca duas aulas da mesma turma. Aula de turmas juntas é trocada em todas as turmas da linha.
function clicarCel(k) {
  if (!GR.sel) { GR.sel = k; return desenharGrade(); }
  const [t1, d1, a1] = GR.sel.split('|'), [t2, d2, a2] = k.split('|');
  if (GR.sel === k || t1 !== t2) { GR.sel = GR.sel === k ? null : k; return desenharGrade(); }
  const tur = new Set([t1]);
  [GR.atual[GR.sel], GR.atual[k]].forEach(c => { const l = c && linhaDe(t1, c.disciplina); if (l) l.turmas.forEach(t => tur.add(t)); });
  const pares = [...tur].map(t => [t + '|' + d1 + '|' + a1, t + '|' + d2 + '|' + a2]);
  if (pares.some(([x, y]) => (GR.atual[x] && GR.atual[x].fixa) || (GR.atual[y] && GR.atual[y].fixa))) { toast('Aula fixa não pode ser movida.', 'erro'); GR.sel = null; return desenharGrade(); }
  pares.forEach(([x, y]) => { const a = GR.atual[x], b = GR.atual[y]; if (b) GR.atual[x] = b; else delete GR.atual[x]; if (a) GR.atual[y] = a; else delete GR.atual[y]; });
  if (tur.size > 1) toast('Turmas juntas: trocado também em ' + [...tur].filter(t => t !== t1).join(', ') + '.');
  GR.sel = null; GR.editado = true; conferir();
}
function imprimir(tipo) {
  if (!tipo || !GR.atual) return;
  const cab = t => `<div class="titulo-imp">${logoHtml(CFG)}<div><b class="marca">${esc(CFG.escola)} · Grade Horária</b><div class="peq suave">${esc(t)}</div></div></div>`;
  const paginas = tipo === 'turmas' ? D.turmas.map(t => cab(t.nome) + tabelaTurma(t.nome, false))
    : tipo === 'profs' ? ordenarNomes(D.professores.filter(p => aulasProf(p.nome)).map(p => p.nome)).map(n => cab('Professor') + tabelaProf(n))
    : [cab(GR.visao === 'geral' ? 'Geral' : GR.item) + $('conteudo').innerHTML];
  $('impressao').innerHTML = paginas.map(p => `<div class="pagina">${p}</div>`).join('');
  document.body.classList.add('imp'); window.print();
  setTimeout(() => document.body.classList.remove('imp'), 800);
}

// ---------- Trocar professor / reencaixar sem mexer no resto ----------
function abrirTroca() {
  if (!Object.keys(D.grade).length) return toast('Salve uma grade oficial antes.', 'erro');
  if (GR.editado) return toast('Salve ou descarte as alterações da grade antes.', 'erro');
  const comAulas = ordenarNomes(D.professores.filter(p => aulasProf(p.nome)).map(p => p.nome));
  abrirModal('Trocar professor', `
    <p class="peq suave" style="margin:0">O sistema mantém a grade de todos os outros. Se não houver outro jeito, mostra exatamente quais aulas mudam antes de aplicar.</p>
    <div class="linha-campos">
      <label class="campo">Sai<select id="sSai" onchange="linhasTroca()">${comAulas.map(n => `<option>${esc(n)}</option>`).join('')}</select></label>
      <label class="campo">Entra<select id="sEntra"><option value="">O mesmo (só mudou a disponibilidade)</option>${ordenarNomes(D.professores.map(p => p.nome)).map(n => `<option value="${esc(n)}">${esc(n)}${aulasProf(n) ? '' : ' · sem aulas'}</option>`).join('')}</select></label>
    </div>
    <div><div class="campo" style="margin-bottom:6px">Turmas que passam para quem entra</div><div class="sub-linhas" id="sLinhas"></div></div>
    <div id="sRes"></div>`,
    `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn" id="sCalc" onclick="calcularTroca()">Calcular</button><button class="btn prim" id="sAplicar" onclick="aplicarTroca()" disabled>Aplicar e salvar</button>`);
  linhasTroca();
}
function linhasTroca() {
  const sai = $('sSai').value;
  $('sLinhas').innerHTML = D.carga.filter(c => c.professor === sai).map(c => `<label><input type="checkbox" class="sLinha" data-t="${esc(c.turmas.join(' + '))}" data-d="${esc(c.disciplina)}" checked>${esc(c.turmas.join(' + '))} · ${esc(sigla(c.disciplina))}</label>`).join('');
  $('sRes').innerHTML = ''; $('sAplicar').disabled = true; SUB = null;
}
function calcularTroca() {
  const sai = $('sSai').value, entra = $('sEntra').value || sai;
  const linhas = [...document.querySelectorAll('.sLinha:checked')].map(c => ({ turmas: c.dataset.t, disciplina: c.dataset.d }));
  if (!linhas.length) return toast('Marque pelo menos uma turma.', 'erro');
  const sel = new Set(linhas.map(l => l.turmas + '|' + l.disciplina)), D2 = clone(D), g = clone(D.grade);
  D2.carga.forEach(c => { if (c.professor === sai && sel.has(c.turmas.join(' + ') + '|' + c.disciplina)) c.professor = entra; });
  Object.entries(g).forEach(([k, c]) => { const l = linhaDe(k.split('|')[0], c.disciplina); if (c.professor === sai && l && sel.has(l.turmas.join(' + ') + '|' + c.disciplina)) c.professor = entra; });
  $('sRes').innerHTML = '<div class="aviso">Calculando…</div>'; $('sCalc').disabled = true; $('sAplicar').disabled = true;
  Gerador.reencaixar(D2, g, entra, r => {
    if (!$('sRes')) return;
    $('sCalc').disabled = false; SUB = { sai: sai, entra: entra, linhas: linhas, r: r };
    if (!r.ok) {
      $('sRes').innerHTML = `<div class="aviso erro">Não foi possível encaixar. ${r.erros.length ? '' : 'Libere mais horários de ' + esc(entra) + ' ou ajuste as aulas abaixo.'}</div>
        <ul class="lista">${r.erros.concat(r.gargalos).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      return;
    }
    const dele = r.nAlvo ? `${r.nAlvo} aula(s) de ${esc(entra)} mudam de horário.` : 'Nenhuma aula muda de horário.';
    $('sRes').innerHTML = !r.outros.length ? `<div class="aviso ok">✔ Os outros professores não mudam. ${dele}</div>`
      : `<div class="aviso alerta">Com a disponibilidade de ${esc(entra)} não dá para manter tudo igual. Mudam <b>${r.outros.length}</b> aula(s) de outros professores (o mínimo possível). ${dele}</div>
         <div class="rolar"><table class="tab"><tr><th>Professor</th><th>Turma</th><th>Disciplina</th><th>De</th><th>Para</th></tr>${r.outros.map(o => `<tr><td>${esc(o.professor)}</td><td>${esc(o.turma)}</td><td>${esc(sigla(o.disciplina))}</td>
           <td>${esc(o.de)}</td><td><b>${esc(o.para)}</b></td></tr>`).join('')}</table></div>`;
    $('sAplicar').disabled = false;
  });
}
async function aplicarTroca() {
  if (!SUB || !SUB.r.ok) return;
  const antes = clone(D.grade);
  if (!await acao('substituir', { sai: SUB.sai, entra: SUB.entra, linhas: SUB.linhas, grade: SUB.r.grade }, 'Troca aplicada e grade salva.')) return;
  fecharModal();
  GR.atual = comFixas(clone(D.grade)); GR.nome = 'Oficial'; GR.editado = false; GR.opcoes = [];
  GR.mudou = new Set(Object.keys(GR.atual).filter(k => !antes[k] || antes[k].disciplina !== GR.atual[k].disciplina || antes[k].professor !== GR.atual[k].professor));
  GR.visao = 'geral'; telaGrade();
}

iniciar();
</script>
