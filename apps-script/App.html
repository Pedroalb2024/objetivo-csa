<script>
const CFG = <?!= JSON.stringify(cfg) ?>;
let TOKEN = null, D = null, TELA = 'inicio';
const TODOS = ['admin', 'coordenacao', 'consulta'], EDITA = ['admin', 'coordenacao'];
const NOME_PERFIL = { admin: 'Administrador', coordenacao: 'Coordenação', consulta: 'Consulta' };
// Menu: só as 5 primeiras. As telas com "pai" abrem pelos cartões da Configuração (frase = texto do cartão).
const TELAS = [
  { id: 'inicio', nome: 'Início', ic: '🏠', p: TODOS, sub: 'O que falta fazer, com um botão para resolver cada item.' },
  { id: 'grade', nome: 'Grade horária', ic: '🗓️', p: TODOS, sub: 'Gere opções, escolha uma e salve a grade oficial. A troca de professor e as versões anteriores também ficam aqui.' },
  { id: 'professores', nome: 'Professores', ic: '👩‍🏫', p: EDITA, sub: 'Abra um professor para marcar as turmas de cada matéria dele e os horários em que não pode.' },
  { id: 'conferencia', nome: 'Conferência das turmas', ic: '✅', p: EDITA, sub: 'Veja se toda turma tem professor em todas as matérias e resolva o que faltar.' },
  { id: 'config', nome: 'Configuração', ic: '⚙️', p: EDITA, sub: 'Coisas que se ajustam poucas vezes por ano.' },
  { id: 'ano', nome: 'Começar ano letivo', ic: '🎓', pai: 'config', p: ['admin'], frase: 'Guarda a grade deste ano e limpa o que muda de um ano para o outro.', sub: 'Use uma vez por ano, antes de montar a grade do ano seguinte.' },
  { id: 'horarios', nome: 'Horários das aulas', ic: '⏰', pai: 'config', p: EDITA, frase: 'Início e fim de cada aula e dos intervalos, em cada período.', sub: 'Início e fim de cada aula e dos intervalos, em cada período (EFAI Manhã, EFAF Manhã…).' },
  { id: 'turmas', nome: 'Turmas', ic: '🏫', pai: 'config', p: EDITA, frase: 'Nome, segmento, série e horário das aulas de cada turma.', sub: 'Cadastro das turmas: nome, segmento, série e horário das aulas.' },
  { id: 'matriz', nome: 'Matriz curricular', ic: '📚', pai: 'config', p: EDITA, frase: 'Quantas aulas por semana cada série tem de cada matéria.', sub: 'Quantas aulas por semana cada série tem de cada matéria.' },
  { id: 'fixas', nome: 'Aulas fixas', ic: '📌', pai: 'config', p: EDITA, frase: 'Aulas que ficam sempre no mesmo horário; o gerador não mexe nelas.', sub: 'Aulas que precisam ficar sempre no mesmo horário. O gerador não mexe nelas.' },
  { id: 'usuarios', nome: 'Usuários', ic: '👤', pai: 'config', p: ['admin'], frase: 'Quem pode entrar no sistema e o que cada um pode fazer.', sub: 'Quem pode entrar no sistema e o que cada um pode fazer.' },
];
const podeEditar = () => EDITA.includes(D.usuario.perfil);
const clone = o => JSON.parse(JSON.stringify(o));

// ================= Entrada, sessão e navegação =================
function iniciar() {
  $('loginLogo').innerHTML = logoHtml(CFG);
  $('lCredito').textContent = CFG.credito ? 'Sistema por ' + CFG.credito : '';
  let t = null; try { t = sessionStorage.getItem('gh_token'); } catch (e) { }
  if (!t) return mostrarLogin();
  TOKEN = t; ocupado(true);
  chamar('api', TOKEN, 'carregar').then(d => { D = d; abrirApp(); }).catch(() => { TOKEN = null; mostrarLogin(); }).finally(() => ocupado(false));
}
async function entrar(ev) {
  ev.preventDefault(); $('lErro').hidden = true; $('lBtn').disabled = true; ocupado(true);
  try {
    const r = await chamar('login', $('lUsuario').value, $('lSenha').value);
    TOKEN = r.token; try { sessionStorage.setItem('gh_token', TOKEN); } catch (e) { }
    D = await chamar('api', TOKEN, 'carregar'); $('lSenha').value = ''; TELA = 'inicio'; abrirApp();
  } catch (e) { $('lErro').textContent = e.message; $('lErro').hidden = false; }
  finally { $('lBtn').disabled = false; ocupado(false); }
}
function mostrarLogin(msg) {
  $('app').hidden = true; $('login').hidden = false;
  if (msg) { $('lErro').textContent = msg; $('lErro').hidden = false; }
  setTimeout(() => $('lUsuario').focus(), 50);
}
function abrirApp() {
  $('login').hidden = true; $('app').hidden = false;
  $('topoLogo').innerHTML = logoHtml(CFG, true);
  $('topoUsuario').textContent = D.usuario.nome;
  $('menu').innerHTML = TELAS.filter(t => !t.pai && t.p.includes(D.usuario.perfil))
    .map(t => `<button data-t="${t.id}" onclick="ir('${t.id}')"><span class="ic">${t.ic}</span>${t.nome}</button>`).join('');
  GR = novoGR(); ir(TELA, true);
}
function abrirMenu(abrir) { $('menu').classList.toggle('aberto', abrir); $('veu').hidden = !abrir; }
const celular = () => window.matchMedia('(max-width: 700px)').matches;
window.matchMedia('(max-width: 700px)').addEventListener('change', () => { if (D && TELA === 'grade' && $('modal').hidden) telaGrade(); });
async function sair() {
  if (temAlteracao() && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  try { await chamar('sair', TOKEN); } catch (e) { }
  TOKEN = null; D = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  AT = null; HO = null; FX = null; MZ = null; PED = null; mostrarLogin();
}
function expirou() {
  TOKEN = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  fecharModal(); mostrarLogin('Sua sessão expirou. Entre novamente.'); return false;
}
async function acao(nome, dados, msgOk) {
  ocupado(true);
  try { D = await chamar('api', TOKEN, nome, dados); if (msgOk) toast(msgOk); render(); return true; }
  catch (e) { if (/SESSAO_EXPIRADA/.test(e.message)) return expirou(); toast(e.message, 'erro'); return false; }
  finally { ocupado(false); }
}
async function consultar(nome, dados) {   // ação só de leitura (não muda D)
  ocupado(true);
  try { return await chamar('api', TOKEN, nome, dados); }
  catch (e) { if (/SESSAO_EXPIRADA/.test(e.message)) return expirou() || null; toast(e.message, 'erro'); return null; }
  finally { ocupado(false); }
}
const sujoTela = t => (t === 'conferencia' && AT && AT.sujo) || (t === 'horarios' && HO_SUJO) || (t === 'fixas' && FX_SUJO) || (t === 'matriz' && MZ && MZ.sujo);
function temAlteracao() { return !!(AT && AT.sujo) || !!HO_SUJO || !!FX_SUJO || !!(MZ && MZ.sujo) || (GR && GR.editado); }
function ir(t, forcar) {
  if (!TELAS.some(x => x.id === t && x.p.includes(D.usuario.perfil))) t = 'inicio';
  abrirMenu(false);
  if (!forcar && t !== TELA) {
    if (sujoTela(TELA) && !confirm('Há alterações não salvas nesta tela. Sair sem salvar?')) return;
    if (TELA === 'conferencia') AT = null; if (TELA === 'horarios') { HO = null; HO_SUJO = false; } if (TELA === 'fixas') { FX = null; FX_SUJO = false; } if (TELA === 'matriz') MZ = null;
  }
  TELA = t;
  const pai = TELAS.find(x => x.id === t).pai || t;
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('on', b.dataset.t === pai));
  render(); window.scrollTo(0, 0);
}
function render() {
  ({ inicio: telaInicio, professores: telaProfessores, conferencia: telaConferencia, config: telaConfig, ano: telaAno, turmas: telaTurmas, matriz: telaMatriz,
    grade: telaGrade, fixas: telaFixas, horarios: telaHorarios, usuarios: telaUsuarios })[TELA]();
}
function cabecalho(tit, acoes) {   // título + frase curta explicando para que serve a tela; telas da Configuração têm "← Configuração"
  const t = TELAS.find(x => x.id === TELA);
  return `${t && t.pai ? `<button class="btn mini voltar" onclick="ir('${t.pai}')">← Configuração</button>` : ''}
    <div class="cab-tela"><div><h1>${tit}</h1>${t && t.sub ? `<p class="sub">${t.sub}</p>` : ''}</div><div class="acoes">${acoes || ''}</div></div>`;
}

// ================= Configuração (cartões grandes) =================
function telaConfig() {
  $('tela').innerHTML = cabecalho('Configuração') + `<div class="cartoes">${TELAS.filter(t => t.pai === 'config' && t.p.includes(D.usuario.perfil)).map(t =>
    `<button class="cartao-cfg ${t.id === 'ano' ? 'alerta' : ''}" onclick="ir('${t.id}')"><span class="ic">${t.ic}</span><div><b>${t.nome}</b><span>${t.frase}</span></div></button>`).join('')}</div>`;
}
function abrirModal(titulo, corpo, rodape) {
  $('modalCaixa').innerHTML = `<div class="cab"><h2>${titulo}</h2><button class="link" onclick="fecharModal()" style="font-size:22px;color:var(--suave)">×</button></div><div class="corpo">${corpo}</div><div class="rod">${rodape}</div>`;
  $('modal').hidden = false;
}
function fecharModal() {
  if (PED && PED.mudouCarga && !confirm('As turmas marcadas para este professor ainda não foram salvas. Fechar sem salvar?')) return;
  PED = null; $('modal').hidden = true; $('modalCaixa').innerHTML = ''; window.aoMudarDisp = null;
}

// ---------- ajudantes ----------
const profPorNome = n => D.professores.find(p => p.nome === n);
const gradeDe = nome => D.grades.find(g => g.nome === nome);
const turmaDe = nome => D.turmas.find(t => t.nome === nome);
const gradeDaTurma = nome => { const t = turmaDe(nome); return t && gradeDe(t.grade); };
const aulasTurma = nome => aulasDe(gradeDaTurma(nome));
const capacidade = nome => aulasTurma(nome).length * D.dias.length;
const cargaDe = turma => D.carga.filter(c => c.turmas.includes(turma));
const linhaDe = (turma, disc) => D.carga.find(c => c.turmas.includes(turma) && c.disciplina === disc);
const somaCarga = turma => cargaDe(turma).reduce((s, c) => s + c.aulas, 0);
const aulasProf = nome => D.carga.filter(c => c.professor === nome).reduce((s, c) => s + c.aulas, 0);
const totalFaixas = () => D.dias.length * Object.values(D.faixas).reduce((s, h) => s + h.length, 0);
const sigla = disc => { const c = D.componentes.find(x => x.nome === disc); return (c && c.sigla) || disc; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const horasTxt = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min';
const msgForm = () => `Olá! Aqui é a coordenação do ${CFG.escola}. Marque neste link os horários em que você não pode dar aula: ${D.linkForm}`;
const whatsForm = () => 'https:\/\/wa.me/?text=' + encodeURIComponent(msgForm());
const ordenarNomes = l => l.slice().sort((a, b) => a.localeCompare(b, 'pt'));
// Diferenças entre a carga da turma e a matriz da série dela
function difMatriz(t) {
  const alvo = D.matriz.filter(m => m.serie === t.serie); if (!alvo.length) return [];
  const tem = {}; cargaDe(t.nome).forEach(c => tem[c.disciplina] = c.aulas);
  const dif = alvo.filter(m => tem[m.componente] !== m.aulas).map(m => `${sigla(m.componente)} ${tem[m.componente] || 0}→${m.aulas}`);
  Object.keys(tem).filter(d => !alvo.some(m => m.componente === d)).forEach(d => dif.push(`${sigla(d)} fora da matriz`));
  return dif;
}

// ================= Início =================
// Sem grade oficial (começo do ano ou primeira vez): guia em 5 passos. Com grade: resumo e pendências.
let PEND = [], PASSOS = [];
function telaInicio() {
  if (podeEditar() && !Object.keys(D.grade).length) return telaGuia();
  const resp = D.professores.filter(p => p.respondeuEm).length, regulares = D.turmas.filter(t => t.segmento !== 'Extra');
  const completas = regulares.filter(t => statusTurma(t.nome).ok).length;
  const nGrade = Object.keys(D.grade).length;
  let h = cabecalho(`Olá, ${esc(D.usuario.nome.split(' ')[0])}`) + `<div class="stats">
    <div class="card stat" onclick="ir('grade')"><b>${nGrade ? 'Salva' : 'Não salva'}</b><span>grade horária oficial${D.vigencia ? ' · desde ' + esc(D.vigencia) : ''}</span></div>`;
  if (podeEditar()) {
    h += `<div class="card stat" onclick="ir('professores')"><b>${resp}/${D.professores.length}</b><span>professores responderam o formulário</span></div>
      <div class="card stat" onclick="ir('conferencia')"><b>${completas}/${regulares.length}</b><span>turmas completas</span></div>`;
    PEND = pendencias();
    h += '</div>' + listaPendencias();
  } else h += '</div>';
  $('tela').innerHTML = h;
}
function listaPendencias() {
  return PEND.length ? `<div class="card"><h2 style="margin-bottom:10px">O que falta <span class="tag alerta">${PEND.length}</span></h2><div class="pend">${PEND.map((p, i) =>
    `<div class="pend-item"><span>${esc(p.texto)}</span><button class="btn mini" onclick="PEND[${i}].ir()">${esc(p.botao)} →</button></div>`).join('')}</div></div>`
    : '<div class="aviso ok">Tudo pronto: nenhuma pendência.</div>';
}
// Guia: cada passo tem situação (feito / falta) e botões que levam direto para resolver
function passosGuia() {
  const nP = D.professores.length, resp = D.professores.filter(p => p.respondeuEm), naoResp = D.professores.filter(p => !p.respondeuEm);
  const comProf = D.carga.filter(c => c.professor).length, regs = D.turmas.filter(t => t.segmento !== 'Extra');
  const completas = regs.filter(t => statusTurma(t.nome).ok).length;
  const M = D.professores.length && D.carga.length ? Gerador.modelo(D) : null, nSob = M ? Object.keys(M.sobrecarga).length : 0;
  return [
    { tit: 'Conferir horários, turmas e matriz', ok: !!D.ano.conferido,
      txt: 'Veja se os horários das aulas, as turmas e a matriz curricular estão certos para este ano.',
      sit: D.ano.conferido ? 'Conferido.' : `${D.grades.length} períodos de aula · ${D.turmas.length} turmas · matriz de ${new Set(D.matriz.map(m => m.serie)).size} séries.`,
      botoes: `<button class="btn" onclick="ir('horarios')">Horários das aulas</button><button class="btn" onclick="ir('turmas')">Turmas</button><button class="btn" onclick="ir('matriz')">Matriz curricular</button>
        ${D.ano.conferido ? '<button class="btn" onclick="acao(\'conferirEstrutura\',{ok:false})">Desmarcar</button>' : '<button class="btn prim" onclick="acao(\'conferirEstrutura\',{ok:true},\'Marcado como conferido.\')">Está tudo certo ✓</button>'}` },
    { tit: 'Enviar o formulário aos professores', ok: nP > 0 && !naoResp.length,
      txt: 'Cada professor marca, pelo celular, os horários em que não pode dar aula. Professor novo se cadastra pelo próprio formulário.',
      sit: !nP ? 'Ninguém respondeu ainda.' : `${resp.length} de ${nP} professores responderam.`,
      extra: naoResp.length && nP ? `<div class="faltam"><span class="suave">Faltam responder:</span> ${naoResp.slice(0, 15).map(p => `<span class="tag neutra">${esc(p.nome)}</span>`).join('')}${naoResp.length > 15 ? ` e mais ${naoResp.length - 15}` : ''}</div>` : '',
      botoes: `<button class="btn" onclick="copiar(D.linkForm)">Copiar o link</button><a class="btn" target="_blank" href="${esc(whatsForm())}">Enviar no WhatsApp</a>${nP ? `<button class="btn" onclick="FILTRO='naoresp';ir('professores')">Ver quem falta</button>` : ''}` },
    { tit: 'Atribuir turmas aos professores', ok: D.carga.length > 0 && comProf === D.carga.length,
      txt: 'Abra cada professor e, em “Turmas e matérias”, toque nas turmas de cada matéria que ele dá.',
      sit: D.carga.length ? `${comProf} de ${D.carga.length} matérias das turmas já têm professor.` : 'As turmas ainda não têm matérias: confira a matriz curricular.',
      botoes: `<button class="btn prim" onclick="ir('professores')">Ir para Professores</button>` },
    { tit: 'Conferir as turmas', ok: regs.length > 0 && completas === regs.length && !nSob,
      txt: 'Veja se toda turma tem professor em todas as matérias e se cada professor cabe nos horários em que pode.',
      sit: `${completas} de ${regs.length} turmas completas${nSob ? ` · ${nSob} ${nSob === 1 ? 'professor não cabe' : 'professores não cabem'} nos horários livres` : ''}.`,
      botoes: `<button class="btn prim" onclick="ir('conferencia')">Conferência das turmas</button>` },
    { tit: 'Gerar e salvar a grade oficial', ok: Object.keys(D.grade).length > 0,
      txt: 'O sistema monta opções de grade em cerca de 25 segundos. Escolha uma, ajuste se quiser e salve como oficial.',
      sit: Object.keys(D.grade).length ? 'Grade oficial salva.' : 'Ainda não salva.',
      botoes: `<button class="btn prim" onclick="ir('grade')">Ir para a Grade horária</button>` },
  ];
}
function telaGuia() {
  PASSOS = passosGuia(); PEND = pendencias();
  const atual = PASSOS.findIndex(p => !p.ok), feitos = PASSOS.filter(p => p.ok).length;
  $('tela').innerHTML = cabecalho(D.ano.ano ? `Ano letivo ${esc(D.ano.ano)}: passo a passo` : 'Passo a passo para montar a grade')
    + `<p class="suave" style="margin:-6px 0 14px">${feitos} de ${PASSOS.length} passos feitos. Siga na ordem; cada botão leva direto ao lugar certo.</p>
    <div class="passos">${PASSOS.map((p, i) => `<div class="card passo-g ${p.ok ? 'ok' : i === atual ? 'atual' : ''}"><span class="num">${p.ok ? '✓' : i + 1}</span><div>
      <h2>${p.tit} ${p.ok ? '<span class="tag ok">feito</span>' : '<span class="tag alerta">pendente</span>'}</h2>
      <p class="peq suave">${p.txt}</p><p style="margin-top:6px"><b>${p.sit}</b></p>${p.extra || ''}
      <div class="acoes">${p.botoes}</div></div></div>`).join('')}</div>
    ${PEND.length ? `<details style="margin-top:14px"><summary>Ver a lista completa do que falta (${PEND.length})</summary><div style="margin-top:10px">${listaPendencias()}</div></details>` : ''}`;
}
// Pendências em linguagem simples, cada uma com o caminho para resolver
function pendencias() {
  const P = [], add = (texto, botao, ir) => P.push({ texto, botao, ir });
  const regulares = D.turmas.filter(t => t.segmento !== 'Extra'), M = D.professores.length && D.carga.length ? Gerador.modelo(D) : null;
  D.turmas.filter(t => !t.segmento || (t.segmento !== 'Extra' && !t.serie)).forEach(t =>
    add(`A turma ${t.nome} está sem ${!t.segmento ? 'segmento' : 'série'}.`, 'Corrigir a turma', () => { ir('turmas'); editarTurma(t.nome); }));
  const semProf = {};
  D.carga.filter(c => !c.professor).forEach(c => { const s = (turmaDe(c.turmas[0]) || {}).segmento || '?'; semProf[s] = (semProf[s] || 0) + 1; });
  Object.entries(semProf).forEach(([s, n]) => { const c = D.carga.find(x => !x.professor && ((turmaDe(x.turmas[0]) || {}).segmento || '?') === s);
    add(`${n} ${n === 1 ? 'matéria ainda está' : 'matérias ainda estão'} sem professor no ${s === 'Extra' ? 'contraturno' : s}.`, 'Escolher professores', () => irConf(c && c.turmas[0])); });
  if (M) Object.entries(M.sobrecarga).forEach(([p, x]) => add(`${p} tem ${x.aulas} aulas, mas só ${x.livres} horários livres${x.grade ? ' (' + x.grade + ')' : ''}. Libere horários ou tire turmas dele.`, 'Abrir o professor', () => { ir('professores'); editarProfessor(p); }));
  regulares.forEach(t => {
    const u = somaCarga(t.nome), cap = capacidade(t.nome);
    if (u < cap) add(`A turma ${t.nome} tem ${u} aulas por semana; faltam ${cap - u} para completar os ${cap} horários.`, 'Ver a turma', () => irConf(t.nome));
    else if (u > cap) add(`A turma ${t.nome} tem ${u} aulas por semana, ${u - cap} a mais do que cabe (${cap}).`, 'Ver a turma', () => irConf(t.nome));
  });
  regulares.forEach(t => { const dif = difMatriz(t); if (dif.length) add(`A turma ${t.nome} não segue a matriz do ${t.serie} (${dif.slice(0, 2).join(', ')}${dif.length > 2 ? '…' : ''}).`, 'Aplicar a matriz', () => { ir('matriz'); abrirAplicar(); }); });
  if (M) M.erros.filter(e => !/falta escolher o professor|horários livres|passam do limite/.test(e)).forEach(e => {
    if (/Aula fixa/.test(e)) add(e, 'Ver aulas fixas', () => ir('fixas'));
    else if (/horário das aulas/.test(e)) add(e, 'Ver turmas', () => ir('turmas'));
    else add(e, 'Ver a turma', () => irConf((e.match(/^([^·:]+?)(?: \+ | · |:)/) || [])[1]));
  });
  D.professores.filter(p => !aulasProf(p.nome) && p.respondeuEm).forEach(p => add(`${p.nome} respondeu o formulário, mas ainda não tem turmas.`, 'Marcar as turmas', () => { ir('professores'); editarProfessor(p.nome, 'turmas'); }));
  const nao = D.professores.filter(p => !p.respondeuEm).length;
  if (nao) add(`${nao} ${nao === 1 ? 'professor ainda não respondeu' : 'professores ainda não responderam'} o formulário dos horários em que não podem.`, 'Ver quem falta', () => { FILTRO = 'naoresp'; ir('professores'); });
  if (!Object.keys(D.grade).length) add('A grade oficial ainda não foi salva.', 'Montar a grade', () => ir('grade'));
  else { const v = Gerador.validar(D, D.grade); if (v.problemas.length) add(`A grade oficial tem ${v.problemas.length} conflito(s): algum cadastro mudou depois que ela foi salva.`, 'Ver a grade', () => ir('grade')); }
  return P;
}
function irConf(turma) { ir('conferencia'); if (TELA === 'conferencia' && AT && turma && turmaDe(turma)) { AT.turma = turma; AT.aba = 'turma'; telaConferencia(); } }

// ================= Professores =================
// O cadastro do professor é o lugar principal para atribuir: em "Turmas e matérias", cada matéria dele mostra as turmas
// dos segmentos dele; tocar na turma dá ou tira. Edita uma cópia das atribuições (PED.carga) e salva tudo junto.
let BUSCA = '', FILTRO = '', PED = null;
const FILTROS = { '': 'Todos', naoresp: 'Não responderam o formulário', semturma: 'Sem turmas' };
function telaProfessores() {
  $('tela').innerHTML = cabecalho('Professores',
    `<button class="btn" onclick="copiar(D.linkForm)">Copiar link do formulário</button><a class="btn" target="_blank" href="${esc(whatsForm())}">Enviar no WhatsApp</a>
     <button class="btn prim" onclick="editarProfessor()">+ Professor</button>`)
    + `<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <input placeholder="Buscar professor ou matéria…" value="${esc(BUSCA)}" oninput="BUSCA=this.value;listaProfessores()" style="max-width:300px">

      <div id="listaProf"></div></div>`;
  listaProfessores();
}
function listaProfessores() {
  const total = totalFaixas(), b = BUSCA.toLowerCase();
  const l = D.professores.filter(p => (p.nome + ' ' + p.completo + ' ' + p.materias.join(' ')).toLowerCase().indexOf(b) >= 0
    && (FILTRO !== 'naoresp' || !p.respondeuEm) && (FILTRO !== 'semturma' || !aulasProf(p.nome)));
  $('listaProf').innerHTML = !D.professores.length ? '<p class="suave">Nenhum professor ainda. Envie o link do formulário (cada professor se cadastra por ele) ou toque em “+ Professor”.</p>'
    : !l.length ? '<p class="suave">Nenhum professor com esse filtro.</p>'
    : `<table class="tab cartao"><tr><th>Professor</th><th>Matérias</th><th>Aulas por semana</th><th title="Horas na semana em que pode dar aula (de ${total})">Horas livres</th><th>Formulário</th></tr>${l.map(p => {
      const aulas = aulasProf(p.nome);
      return `<tr class="clic" data-n="${esc(p.nome)}" onclick="editarProfessor(this.dataset.n)">
        <td><div><b>${esc(p.nome)}</b>${p.completo ? `<div class="peq suave">${esc(p.completo)}</div>` : ''}</div></td>
        <td data-r="Matérias" class="suave">${p.materias.length ? esc(p.materias.map(sigla).join(', ')) : '<span class="tag alerta">escolher</span>'}</td>
        <td data-r="Aulas por semana">${aulas || '<span class="tag alerta">sem turmas</span>'}</td>
        <td data-r="Horas livres">${total - p.indisp.length} de ${total}</td>
        <td data-r="Formulário">${p.respondeuEm ? `<span class="tag ok">respondeu ${esc(p.respondeuEm.slice(0, 5))}</span>` : '<span class="tag alerta">não respondeu</span>'}</td></tr>`;
    }).join('')}</table>`;
}
function editarProfessor(nome, aba) {
  const p = nome ? profPorNome(nome) : { nome: '', completo: '', materias: [], segmentos: [], tel: '', maxDia: '', indisp: [], respondeuEm: '', obs: '' };
  if (!p) return;
  PED = { antigo: nome || '', chave: nome || '\u0001novo', aba: aba || 'turmas', blocos: D.blocos.filter(b => b.professor === nome).map(b => ({ ...b })),
    materias: p.materias.slice(), segmentos: p.segmentos.slice(), verMats: !p.materias.length, carga: clone(D.carga), cargaAntes: D.carga, mudouCarga: false, pergunta: null };
  DISP = new Set(p.indisp);
  const temGrade = nome && Object.keys(D.grade).length && aulasProf(nome);
  abrirModal(nome ? esc(nome) : 'Novo professor', `
    <div class="linha-campos">
      <label class="campo">Nome curto *<input id="pNome" value="${esc(p.nome)}" placeholder="Como aparece na grade" oninput="totalProf()"></label>
      <label class="campo">Nome completo<input id="pCompleto" value="${esc(p.completo)}"></label>
    </div>
    ${p.respondeuEm ? `<div class="aviso ok">Respondeu o formulário em ${esc(p.respondeuEm)}${p.obs ? ` · “${esc(p.obs)}”` : ''}</div>` : nome ? '<div class="aviso alerta">Ainda não respondeu o formulário dos horários.</div>' : ''}
    <div class="abas-prof">${[['turmas', 'Turmas e matérias'], ['disp', 'Horários em que não pode'], ['dados', 'Mais dados']].map(([k, v]) => `<button data-a="${k}" onclick="abaProf('${k}')">${v}</button>`).join('')}</div>
    <div data-pane="turmas" style="display:flex;flex-direction:column;gap:14px">
      <div class="total-prof" id="pTotal"></div>
      <div><h3 style="margin-bottom:6px">1. Segmentos em que dá aula</h3><div class="chips" id="pSegs"></div></div>
      <div><div class="disp-tit"><h3>2. Matérias que dá</h3></div><div id="pMats"></div></div>
      <div><div class="disp-tit"><h3>3. Turmas de cada matéria</h3><span class="peq suave">toque na turma para dar ou tirar</span></div><div id="pTurmas"></div></div>
      ${temGrade ? `<div class="aviso">Mudar as turmas aqui não muda a grade oficial. Para trocar quem dá as aulas no meio do ano, sem mexer no horário dos outros professores, use
        <button class="link" data-n="${esc(nome)}" onclick="substituirProfessor(this.dataset.n)">Substituir este professor na grade</button>.</div>` : ''}
    </div>
    <div data-pane="disp" hidden><p class="peq" id="pResumo" style="margin:0 0 10px"></p>${htmlDisp(D.dias, D.faixas)}</div>
    <div data-pane="dados" hidden style="flex-direction:column;gap:14px">
      <div class="linha-campos">
        <label class="campo">WhatsApp<input id="pTel" value="${esc(p.tel)}" inputmode="tel"></label>
        <label class="campo" title="Deixe vazio se não houver limite">Máximo de aulas por dia<input id="pMax" type="number" min="1" max="12" value="${p.maxDia || ''}" placeholder="sem limite" style="max-width:140px" oninput="totalProf()"></label>
      </div>
      <div><div class="disp-tit"><h3>Horários reservados (sem turma)</h3><button class="btn mini" onclick="PED.blocos.push({tipo:D.tiposBloco[0],disciplina:'',dia:'Seg',ini:'',fim:''});desenharBlocos()">+ Horário reservado</button></div>
        <div id="pBlocos"></div></div>
      ${temGrade ? `<div><button class="btn" data-n="${esc(nome)}" onclick="substituirProfessor(this.dataset.n)">Substituir este professor na grade</button></div>` : ''}
    </div>`,
    `${nome ? '<button class="btn perigo esq" onclick="excluirProfessor()">Excluir</button>' : ''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn prim" onclick="salvarProfessor()">Salvar</button>`);
  window.aoMudarDisp = () => { $('pResumo').innerHTML = `<b>${totalFaixas() - DISP.size} de ${totalFaixas()} horas livres na semana.</b>`; totalProf(); };
  desenharBlocos(); desenharChips(); abaProf(PED.aba); window.aoMudarDisp();
}
function abaProf(a) {
  PED.aba = a;
  document.querySelectorAll('.abas-prof button').forEach(b => b.classList.toggle('on', b.dataset.a === a));
  document.querySelectorAll('[data-pane]').forEach(x => { x.hidden = x.dataset.pane !== a; if (!x.hidden) x.style.display = 'flex'; });
  totalProf();
}
function substituirProfessor(nome) {   // abre a troca de professor já preenchida
  if (!Object.keys(D.grade).length) return toast('Ainda não há grade oficial salva.', 'erro');
  fecharModal(); if (PED) return; ir('grade'); if (TELA === 'grade') abrirTroca(nome);
}
function desenharChips() {
  const chip = (txt, on, acao, v) => `<span class="chip ${on ? 'on' : ''}" data-v="${esc(v || txt)}" onclick="${acao}(this.dataset.v)">${esc(txt)}</span>`;
  $('pSegs').innerHTML = Object.keys(D.series).map(s => chip(s === 'Extra' ? 'Contraturno' : s, PED.segmentos.includes(s), 'chipSeg', s)).join('');
  if (!PED.verMats) {
    $('pMats').innerHTML = `<div class="chips">${PED.materias.map(n => chip(n, true, 'chipMat')).join('')}<button class="btn mini" onclick="PED.verMats=true;desenharChips()">Mudar as matérias</button></div>`;
  } else {
    const nomes = D.componentes.map(c => c.nome), series = [].concat(...PED.segmentos.map(sg => D.series[sg] || [])), curr = [];
    D.matriz.forEach(m => { if ((!series.length || series.includes(m.serie)) && !curr.includes(m.componente)) curr.push(m.componente); });
    const todasCurr = new Set(D.matriz.map(m => m.componente));
    const outras = nomes.filter(n => !curr.includes(n) && !todasCurr.has(n)), soltas = PED.materias.filter(m => !curr.includes(m) && !outras.includes(m));
    $('pMats').innerHTML = `<div class="peq suave" style="margin:2px 0 4px">Do currículo${series.length ? ' (segmentos marcados)' : ''}</div><div class="chips">${curr.map(n => chip(n, PED.materias.includes(n), 'chipMat')).join('')}</div>
      <div class="peq suave" style="margin:10px 0 4px">Contraturno e outras</div><div class="chips">${outras.map(n => chip(n, PED.materias.includes(n), 'chipMat')).join('')}
      ${soltas.map(n => `<span class="chip on fora" title="Toque para tirar" data-v="${esc(n)}" onclick="chipMat(this.dataset.v)">${esc(n)}</span>`).join('')}</div>
      ${PED.materias.length ? '<div style="margin-top:10px"><button class="btn mini prim" onclick="PED.verMats=false;desenharChips()">Pronto</button></div>' : ''}`;
  }
  desenharTurmasProf();
}
function chipSeg(v) { const l = PED.segmentos, i = l.indexOf(v); i >= 0 ? l.splice(i, 1) : l.push(v); desenharChips(); }
function chipMat(v) { const l = PED.materias, i = l.indexOf(v); i >= 0 ? l.splice(i, 1) : l.push(v); desenharChips(); }

// ---- Turmas de cada matéria (dentro do cadastro do professor) ----
const ptLinha = (turma, m) => PED.carga.find(l => l.turmas.includes(turma) && l.disciplina === m);
const naMatriz = m => D.matriz.some(x => x.componente === m);
const nomeProfEd = () => ($('pNome') && $('pNome').value.trim()) || PED.antigo || 'este professor';
const textoGrupo = g => g === 'Contraturno' ? 'em todos os grupos do contraturno' : /série/.test(g) ? 'em toda a ' + g : 'em todo o ' + g;
function ptCandidatas(m) {   // turmas dos segmentos do professor que têm (ou podem ter) a matéria; as que já são dele aparecem sempre
  const eu = PED.chave;
  return turmasEmOrdem().filter(t => {
    const l = ptLinha(t.nome, m);
    if (l && l.professor === eu) return true;
    if (!PED.segmentos.includes(t.segmento)) return false;
    if (t.segmento === 'Extra') return !naMatriz(m) || !!l;
    return !!l || D.matriz.some(x => x.serie === t.serie && x.componente === m);
  });
}
function desenharTurmasProf() {
  if (!PED || !$('pTurmas')) return;
  const eu = PED.chave, minhas = PED.carga.filter(l => l.professor === eu);
  PED.mats = [...new Set(PED.materias.concat(minhas.map(l => l.disciplina)))]; PED.grupos = [];
  if (!PED.segmentos.length && !minhas.length) { $('pTurmas').innerHTML = '<p class="peq suave" style="margin:0">Marque acima os segmentos em que o professor dá aula.</p>'; return totalProf(); }
  if (!PED.mats.length) { $('pTurmas').innerHTML = '<p class="peq suave" style="margin:0">Marque acima as matérias que o professor dá.</p>'; return totalProf(); }
  $('pTurmas').innerHTML = PED.mats.map((m, mi) => {
    const ts = ptCandidatas(m), aulas = minhas.filter(l => l.disciplina === m).reduce((x, l) => x + l.aulas, 0), grupos = PED.grupos[mi] = [];
    ts.forEach(t => { const g = t.segmento === 'Extra' ? 'Contraturno' : t.serie || t.segmento; let x = grupos.find(y => y.g === g); if (!x) grupos.push(x = { g, ts: [] }); x.ts.push(t); });
    const pq = PED.pergunta && PED.pergunta.mi === mi ? `<div class="pergunta"><span>${esc(PED.pergunta.texto)}</span><button class="btn mini prim" onclick="ptConfirmar()">Passar</button><button class="btn mini" onclick="PED.pergunta=null;desenharTurmasProf()">Cancelar</button></div>` : '';
    return `<div class="pt-mat"><div class="disp-tit"><h3>${esc(m)}</h3><span class="tag ${aulas ? 'neutra' : 'alerta'}">${aulas} ${aulas === 1 ? 'aula' : 'aulas'} por semana</span></div>
      ${!ts.length ? `<p class="peq suave" style="margin:0">Nenhuma turma dos segmentos marcados tem ${esc(m)} na matriz.</p>` : grupos.map((g, gi) => `<div class="pt-serie"><span class="pt-serie-nome">${esc(g.g)}</span>
        <div class="pt-chips">${g.ts.map(t => ptChip(m, t)).join('')}
        ${g.ts.length > 1 && g.ts.some(t => { const l = ptLinha(t.nome, m); return !l || l.professor !== eu; }) ? `<button class="link" onclick="ptGrupo(${mi},${gi})">Dar ${esc(m)} ${esc(textoGrupo(g.g))}</button>` : ''}</div></div>`).join('')}
      ${pq}</div>`;
  }).join('');
  totalProf();
}
function ptChip(m, t) {
  const l = ptLinha(t.nome, m), juntas = l && l.turmas.length > 1 ? l.turmas.filter(x => x !== t.nome) : [];
  const cls = l && l.professor === PED.chave ? 'meu' : l && l.professor ? 'outro' : 'livre';
  const tit = cls === 'meu' ? 'Toque para tirar' : cls === 'outro' ? `Hoje com ${l.professor}. Toque para passar` : 'Sem professor. Toque para dar';
  return `<button class="pt ${cls}" title="${esc(tit)}" data-m="${esc(m)}" data-t="${esc(t.nome)}" onclick="ptClique(this.dataset.m,this.dataset.t)">${esc(t.nome)}${cls === 'outro' ? ' · ' + esc(l.professor) : ''}${juntas.length ? ` <small>junto c/ ${esc(juntas.join(', '))}</small>` : ''}</button>`;
}
function ptClique(m, turma) {
  const l = ptLinha(turma, m);
  PED.pergunta = null;
  if (l && l.professor === PED.chave) { l.professor = ''; return ptMudou(); }
  if (l && l.professor) { PED.pergunta = { mi: PED.mats.indexOf(m), texto: `Passar ${l.turmas.join(' + ')} de ${l.professor} para ${nomeProfEd()}?`, linhas: [l], dar: [] }; return desenharTurmasProf(); }
  ptDar(m, turma); ptMudou();
}
function ptDar(m, turma) {
  let l = ptLinha(turma, m);
  if (!l) {
    const t = turmaDe(turma), mz = D.matriz.find(x => x.serie === t.serie && x.componente === m), n = mz ? mz.aulas : 1;
    l = { turmas: [turma], disciplina: m, professor: '', aulas: n, duplas: 0, maxDia: Math.max(Math.ceil(n / 5), Math.min(n, 2)) };
    PED.carga.push(l);
    if (!mz) toast(`${m} entrou na ${turma} com 1 aula por semana. Para mudar, use a Conferência das turmas (botão ⋯).`);
  }
  l.professor = PED.chave;
}
function ptGrupo(mi, gi) {   // "Dar Matemática em todo o 6º ano"
  const m = PED.mats[mi], g = PED.grupos[mi][gi], outros = [], dar = [];
  g.ts.forEach(t => { const l = ptLinha(t.nome, m); if (l && l.professor === PED.chave) return; if (l && l.professor) { if (!outros.includes(l)) outros.push(l); } else dar.push([m, t.nome]); });
  if (outros.length) { PED.pergunta = { mi, texto: `Passar ${outros.map(l => `${l.turmas.join(' + ')} de ${l.professor}`).join(', ')} para ${nomeProfEd()}?`, linhas: outros, dar }; return desenharTurmasProf(); }
  dar.forEach(([mm, t]) => ptDar(mm, t)); ptMudou();
}
function ptConfirmar() { const q = PED.pergunta; q.linhas.forEach(l => l.professor = PED.chave); q.dar.forEach(([m, t]) => ptDar(m, t)); PED.pergunta = null; ptMudou(); }
function ptMudou() { PED.mudouCarga = true; desenharTurmasProf(); }
// Total do professor e se cabe nos horários em que ele pode (motivo em linguagem simples)
function totalProf() {
  if (!PED || !$('pTotal')) return;
  const eu = PED.chave, minhas = PED.carga.filter(l => l.professor === eu), aulas = minhas.reduce((x, l) => x + l.aulas, 0);
  const maxDia = +($('pMax') && $('pMax').value) || 0, nome = nomeProfEd();
  const D2 = Object.assign({}, D, { carga: minhas, professores: [{ nome: eu, maxDia, indisp: [...DISP] }], blocos: PED.blocos.map(b => Object.assign({}, b, { professor: eu })), fixas: [] });
  const s = aulas ? Gerador.modelo(D2).sobrecarga[eu] : null, nT = new Set([].concat(...minhas.map(l => l.turmas))).size;
  $('pTotal').innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag ${aulas ? 'neutra' : 'alerta'}" style="font-size:14px;padding:5px 12px">${aulas} ${aulas === 1 ? 'aula' : 'aulas'} por semana</span>
      <span class="peq suave">${nT ? `em ${nT} ${nT === 1 ? 'turma' : 'turmas'}` : 'nenhuma turma ainda'}</span>${PED.mudouCarga ? '<span class="tag alerta">não salvo</span>' : ''}</div>`
    + (!s ? '' : `<div class="aviso erro">⚠ Não cabe: ${s.grade ? `são ${s.aulas} aulas no período ${esc(s.grade)}, mas, pelos horários em que ${esc(nome)} pode, só sobram ${s.livres} horários nesse período. Libere horários na aba “Horários em que não pode” ou tire turmas.`
      : `são ${s.aulas} aulas na semana, mas o limite é de ${maxDia} por dia (${s.livres} na semana). Aumente o limite em “Mais dados” ou tire turmas.`}</div>`);
}
function desenharBlocos() {
  $('pBlocos').innerHTML = !PED.blocos.length ? '<p class="peq suave" style="margin:0">Complementação de carga horária, plantão de dúvidas… O professor fica ocupado nesse horário e o gerador não põe aula nele.</p>'
    : `<table class="tab cartao"><tr><th>Tipo</th><th>Matéria</th><th>Dia</th><th>Início</th><th>Fim</th><th></th></tr>${PED.blocos.map((b, i) => `<tr>
      <td><select onchange="PED.blocos[${i}].tipo=this.value;desenharBlocos()">${D.tiposBloco.map(t => `<option ${t === b.tipo ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></td>
      <td data-r="Matéria">${b.tipo === 'Plantão de Dúvidas' ? `<input list="listaComp" value="${esc(b.disciplina)}" oninput="PED.blocos[${i}].disciplina=this.value" placeholder="Ex.: Física">` : '<span class="suave">—</span>'}</td>
      <td data-r="Dia"><select style="min-width:76px" onchange="PED.blocos[${i}].dia=this.value">${D.dias.map(d => `<option ${d === b.dia ? 'selected' : ''}>${d}</option>`).join('')}</select></td>
      <td data-r="Início"><input type="time" step="600" value="${esc(b.ini)}" onchange="PED.blocos[${i}].ini=this.value"></td>
      <td data-r="Fim"><input type="time" step="600" value="${esc(b.fim)}" onchange="PED.blocos[${i}].fim=this.value"></td>
      <td><button class="btn mini perigo" onclick="PED.blocos.splice(${i},1);desenharBlocos()">Tirar</button></td></tr>`).join('')}</table>
      <datalist id="listaComp">${D.componentes.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist>`;
}
async function salvarProfessor() {
  const nome = $('pNome').value.trim();
  const dados = { nomeAntigo: PED.antigo, nome, completo: $('pCompleto').value, materias: PED.materias, segmentos: PED.segmentos,
    maxDia: +$('pMax').value || '', tel: $('pTel').value, indisp: [...DISP], blocos: PED.blocos };
  if (PED.mudouCarga) {
    if (!nome) return toast('Informe o nome curto do professor.', 'erro');
    dados.carga = PED.carga.map(l => Object.assign({}, l, { professor: l.professor === PED.chave ? nome : l.professor }));
    dados.cargaAntes = PED.cargaAntes;
  }
  const ped = PED; ped.mudouCarga = false;
  if (await acao('salvarProfessor', dados, dados.carga ? 'Professor e turmas salvos.' : 'Professor salvo.')) { PED = null; fecharModal(); }
  else if (PED === ped) ped.mudouCarga = !!dados.carga;
}
async function excluirProfessor() {
  if (!confirm(`Excluir ${PED.antigo}?`)) return;
  const ped = PED, m = ped.mudouCarga; ped.mudouCarga = false;
  if (await acao('excluirProfessor', { nome: ped.antigo }, 'Professor excluído.')) { PED = null; fecharModal(); } else ped.mudouCarga = m;
}

// ================= Turmas (só o cadastro) =================
function telaTurmas() {
  const linhas = Object.keys(D.series).concat(['']).map(seg => {
    const ts = D.turmas.filter(t => seg ? t.segmento === seg : !D.series[t.segmento]); if (!ts.length) return '';
    return `<tr class="grupo-linha"><td colspan="5">${seg || 'Sem segmento'}</td></tr>` + ts.map(t => {
      const u = somaCarga(t.nome), cap = capacidade(t.nome), cls = t.segmento === 'Extra' ? (u > cap ? 'erro' : 'neutra') : u === cap ? 'ok' : u > cap ? 'erro' : 'alerta';
      return `<tr class="clic" data-t="${esc(t.nome)}" onclick="editarTurma(this.dataset.t)"><td><b>${esc(t.nome)}</b></td><td data-r="Série">${esc(t.serie || '—')}</td><td data-r="Horário das aulas">${esc(t.grade || '—')}</td>
        <td data-r="Aulas por semana"><span class="tag ${cls}">${u} de ${cap}</span></td><td data-r="Matérias" class="suave peq">${cargaDe(t.nome).length} matérias</td></tr>`;
    }).join('');
  }).join('');

function hoMudou(i, redesenhar) { HO_SUJO = true; redesenhar ? telaHorarios() : hoPrevia(i); }
function hoAdd(i, tipo) {
  const it = HO[i].itens, ult = it[it.length - 1], aulas = it.filter(x => x.tipo !== 'intervalo'), ua = aulas[aulas.length - 1];
  const ini = ult && !isNaN(minutos(ult.fim)) ? minutos(ult.fim) : 420, dur = tipo === 'intervalo' ? 20 : ua ? (minutos(ua.fim) - minutos(ua.ini)) || 50 : 50;
  it.push({ tipo, ini: hhmm(ini), fim: hhmm(ini + dur) }); hoMudou(i, true);
}
function problemaItens(itens) {   // mesma regra do servidor
  if (!itens.some(i => i.tipo !== 'intervalo')) return 'Precisa de pelo menos uma aula.';
  let ant = null;
  for (let k = 0; k < itens.length; k++) {
    const a = minutos(itens[k].ini), b = minutos(itens[k].fim), nome = `Linha ${k + 1}`;
    if (isNaN(a) || isNaN(b)) return `${nome}: preencha início e fim.`;
    if (a % 10 || b % 10) return `${nome}: use horários de 10 em 10 minutos.`;
    if (b <= a) return `${nome}: o fim precisa ser depois do início.`;
    if (ant !== null && a < ant) return `${nome}: começa antes do fim da linha anterior.`;
    ant = b;
  }
  return '';
}
function hoPrevia(i) {

  const larg = (a, b) => ((b - a) / (fim0 - ini0) * 100).toFixed(2) + '%';
  let n = 0;
  $('hoPrev' + i).innerHTML = g.itens.map(it => {
    const a = minutos(it.ini), b = minutos(it.fim); if (isNaN(a) || isNaN(b) || b <= a) return '';
    const iv = it.tipo === 'intervalo', rot = iv ? '' : ++n + 'ª';
    return `<span class="${iv ? 'int' : 'aula'}" style="left:${pos(a)};width:${larg(a, b)}" title="${iv ? 'Intervalo' : rot + ' aula'} ${faixaTxt(a, b)}">${rot}</span>`;
  }).join('');
  $('hoEixo' + i).innerHTML = Array.from({ length: 13 }, (_, k) => `<i style="left:${pos(ini0 + k * 60)}">${7 + k}h</i>`).join('');
  const e = problemaItens(g.itens);

}

  const linhas = new Map(), lista = Object.values(itens);
  usadas.forEach(gn => aulasDe(gradeDe(gn)).forEach(x => linhas.set(x.ini + '|' + x.fim, x)));
  lista.concat(blocos).forEach(x => linhas.set(x.ini + '|' + x.fim, { ini: x.ini, fim: x.fim }));
  const ord = [...linhas.values()].sort((a, b) => a.ini - b.ini || a.fim - b.fim);
  let h = `<h2 style="margin-bottom:8px">${esc(nome)} <span class="peq suave">· ${lista.length} aulas${blocos.length ? ' · ' + blocos.length + ' horário(s) reservado(s)' : ''}</span></h2>`;
  if (!ord.length) return h + '<p class="suave">Sem aulas.</p>';
  [['Manhã', ord.filter(x => x.ini < 780)], ['Tarde', ord.filter(x => x.ini >= 780)]].forEach(([per, rows]) => {
    if (!rows.length) return;
    h += `<table class="grade" style="margin-bottom:12px"><tr><th class="hora">${per}</th>${D.dias.map(d => `<th>${d}</th>`).join('')}</tr>`;
    rows.forEach(r => {
      h += `<tr><th class="hora">${faixaTxt(r.ini, r.fim)}</th>`;
      D.dias.forEach((dia, d) => {
        const aqui = lista.filter(x => x.d === d && x.ini === r.ini && x.fim === r.fim), bl = blocos.filter(x => x.d === d && x.ini === r.ini && x.fim === r.fim);
        let fora = false; for (let hh = Math.floor(r.ini / 60); hh * 60 < r.fim; hh++) if (ind.has(dia + '|' + hh)) fora = true;
        const conf = aqui.some(x => x.chaves.some(k => GR.ruins.has(k)));
        h += `<td class="cel ${!aqui.length && !bl.length ? (fora ? 'indisp' : 'vazia') : ''} ${conf ? 'conf' : ''}" style="${aqui[0] ? cor(aqui[0].disc) : bl.length ? 'background:#fbf6e6' : ''}">
          ${aqui.map(x => `<div class="d">${esc(x.turmas.join(' + '))}</div><div class="p">${esc(sigla(x.disc))}</div>`).join('')}
          ${bl.map(x => `<div class="d bloco">${x.b.tipo === 'Plantão de Dúvidas' ? 'Plantão' : 'Compl. C.H.'}</div><div class="p">${esc(x.b.disciplina || '')}</div>`).join('')}</td>`;
      });
      h += '</tr>';
    });
    h += '</table>';
  });
  return h;
}
function tabelaGeral() {
  return D.grades.map(g => {
    const ts = D.turmas.filter(t => t.grade === g.nome), au = aulasDe(g); if (!ts.length) return '';
    return `<h3 style="margin:6px 0">${esc(g.nome)}</h3><div class="rolar"><table class="grade geral" style="min-width:${120 + au.length * D.dias.length * 34}px"><tr><th class="turma"></th>${D.dias.map(d => `<th colspan="${au.length}">${d}</th>`).join('')}</tr>
      ${ts.map(t => `<tr><th class="turma">${esc(t.nome)}</th>${D.dias.map((_, d) => au.map((x, a) => {
        const k = t.nome + '|' + d + '|' + a, c = GR.atual && GR.atual[k];
        return `<td class="cel ${c ? '' : 'vazia'} ${GR.ruins.has(k) ? 'conf' : GR.mudou.has(k) ? 'mudou' : ''}" style="${c ? cor(c.disciplina) : ''}" title="${c ? esc(faixaTxt(x.ini, x.fim) + ' · ' + c.disciplina + ' · ' + c.professor) : ''}"><div class="d">${c ? esc(sigla(c.disciplina)) : ''}</div></td>`;
      }).join('')).join('')}</tr>`).join('')}</table></div>`;
  }).join('');
}
// Linha sob o título: de onde vem a grade que está na tela
function situacaoGrade() {
  if (GR.versao) return `<div class="aviso alerta" style="margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">Você está vendo uma versão antiga (${esc(GR.nome)}), não a oficial.
    ${podeEditar() ? `<button class="btn mini" onclick="restaurarVersao(${GR.versao})">Restaurar esta versão</button>` : ''}<button class="btn mini" onclick="usarOpcao('oficial')">Voltar para a oficial</button></div>`;
  if (ehOficial() && D.vigencia) return `<div class="peq suave" style="margin:-4px 0 8px">Grade oficial · válida a partir de <b>${esc(D.vigencia)}</b></div>`;
  return '';
}
function desenharGrade() {
  if (!$('conteudo')) return;
  if (!GR.atual) { $('conteudo').innerHTML = `<p class="suave" style="padding:30px;text-align:center">${podeEditar() ? 'Toque em “Gerar opções”.' : 'A grade ainda não foi publicada.'}</p>`; return; }
  const nome = GR.nome === 'Oficial' ? 'Oficial' : GR.nome;
  if (celular()) {   // celular: um dia por vez, em lista
    if (GR.visao === 'geral') { $('conteudo').innerHTML = '<div class="aviso alerta">“Todas as turmas” é uma tabela muito larga e só aparece no computador. No celular, veja uma turma ou um professor por vez.</div>'; return; }
    const D_ = GR.dia, abas = `<div class="dias-abas">${D.dias.map((x, i) => `<button class="${i === D_ ? 'on' : ''}" onclick="GR.dia=${i};desenharGrade()">${x}</button>`).join('')}</div>`;
    $('conteudo').innerHTML = situacaoGrade() + `<h2 style="margin-bottom:8px">${esc(GR.item)} <span class="peq suave">· ${esc(nome)}${GR.editado ? ' (alterada, não salva)' : ''}</span></h2>` + abas
      + (GR.visao === 'turma' ? listaDiaTurma(GR.item, D_) : listaDiaProf(GR.item, D_))
      + (podeEditar() && GR.visao === 'turma' && !GR.versao ? '<p class="peq suave" style="margin:10px 0 0">Para trocar aulas de lugar, use o computador.</p>' : '');
    return;
  }
  $('conteudo').innerHTML = situacaoGrade() + (GR.visao === 'turma' ? `<h2 style="margin-bottom:8px">${esc(GR.item)} <span class="peq suave">· ${esc(nome)}${GR.editado ? ' (alterada, não salva)' : ''}</span></h2>`
      + (podeEditar() && !GR.versao ? '<div class="dica-fixa">Para trocar duas aulas de lugar, clique numa e depois na outra (da mesma turma).</div>' : '') + tabelaTurma(GR.item, podeEditar() && !GR.versao)
    : GR.visao === 'prof' ? tabelaProf(GR.item) : tabelaGeral());
}
// Celular: lista vertical do dia (horário · matéria · professor ou turma)
function listaDiaTurma(turma, d) {
  const g = gradeDaTurma(turma); if (!g) return '<p class="suave">Turma sem horário das aulas.</p>';
  let a = 0;
  return '<div class="lista-dia">' + g.itens.map(it => {
    const ini = minutos(it.ini), fim = minutos(it.fim);
    if (it.tipo === 'intervalo') return `<div class="ld-int">intervalo · ${faixaTxt(ini, fim)}</div>`;
    const k = turma + '|' + d + '|' + a, c = GR.atual && GR.atual[k], l = c && linhaDe(turma, c.disciplina); a++;
    const junta = l && l.turmas.length > 1 ? ' · junto com ' + l.turmas.filter(t => t !== turma).join(', ') : '';
    return `<div class="ld ${c ? '' : 'vazia'} ${GR.ruins.has(k) ? 'conf' : ''}" style="${c ? cor(c.disciplina) : ''}"><span class="h">${hora(ini)}<small>${hora(fim)}</small></span>
      <div>${c ? `<b>${c.fixa ? '🔒 ' : ''}${esc(c.disciplina)}</b><div class="p">${esc(c.professor + junta)}</div>` : 'sem aula'}</div></div>`;
  }).join('') + '</div>';
}
function listaDiaProf(nome, d) {
  const itens = {};
  Object.entries(GR.atual || {}).forEach(([k, c]) => {
    const [t, ds, as] = k.split('|'); if (c.professor !== nome || +ds !== d) return;
    const x = aulasDe(gradeDaTurma(t))[+as]; if (!x) return;
    const id = x.ini + '|' + x.fim + '|' + c.disciplina, e = itens[id] = itens[id] || { ini: x.ini, fim: x.fim, disc: c.disciplina, turmas: [], conf: false };
    e.turmas.push(t); if (GR.ruins.has(k)) e.conf = true;
  });
  const bl = D.blocos.filter(b => b.professor === nome && b.dia === D.dias[d]).map(b => ({ ini: minutos(b.ini), fim: minutos(b.fim), b }));
  const l = Object.values(itens).concat(bl).sort((x, y) => x.ini - y.ini);
  if (!l.length) return '<p class="suave" style="text-align:center;padding:20px">Sem aulas neste dia.</p>';
  return `<div class="lista-dia">${l.map(x => `<div class="ld ${x.conf ? 'conf' : ''}" style="${x.b ? 'background:#fbf6e6' : cor(x.disc)}"><span class="h">${hora(x.ini)}<small>${hora(x.fim)}</small></span><div>`
    + (x.b ? `<b>${x.b.tipo === 'Plantão de Dúvidas' ? 'Plantão de dúvidas' : 'Complementação de carga horária'}</b><div class="p">${esc(x.b.disciplina || 'horário reservado')}</div>`
      : `<b>${esc(x.disc)}</b><div class="p">Turma ${esc(x.turmas.join(' + '))}</div>`) + '</div></div>').join('')}</div>`;
}
// Troca duas aulas da mesma turma. Aula de turmas juntas é trocada em todas as turmas juntas.
function clicarCel(k) {
  if (!GR.sel) { GR.sel = k; return desenharGrade(); }
  const [t1, d1, a1] = GR.sel.split('|'), [t2, d2, a2] = k.split('|');
  if (GR.sel === k || t1 !== t2) { GR.sel = GR.sel === k ? null : k; return desenharGrade(); }
  const tur = new Set([t1]);
  [GR.atual[GR.sel], GR.atual[k]].forEach(c => { const l = c && linhaDe(t1, c.disciplina); if (l) l.turmas.forEach(t => tur.add(t)); });
  const pares = [...tur].map(t => [t + '|' + d1 + '|' + a1, t + '|' + d2 + '|' + a2]);
  if (pares.some(([x, y]) => (GR.atual[x] && GR.atual[x].fixa) || (GR.atual[y] && GR.atual[y].fixa))) { toast('Aula fixa não pode ser movida.', 'erro'); GR.sel = null; return desenharGrade(); }
  pares.forEach(([x, y]) => { const a = GR.atual[x], b = GR.atual[y]; if (b) GR.atual[x] = b; else delete GR.atual[x]; if (a) GR.atual[y] = a; else delete GR.atual[y]; });
  if (tur.size > 1) toast('Turmas juntas: trocado também em ' + [...tur].filter(t => t !== t1).join(', ') + '.');
  GR.sel = null; GR.editado = true; conferir();
}
function cabImpressao(t) {
  const sit = ehOficial() ? (D.vigencia ? 'Válida a partir de ' + D.vigencia : 'Grade oficial') : GR.versao ? GR.nome + ' (versão antiga)' : 'Rascunho: ainda não é a grade oficial';
  return `<div class="titulo-imp">${logoHtml(CFG)}<div><b class="marca">${esc(CFG.escola)} · Grade Horária</b><div class="peq suave">${esc(t)} · ${esc(sit)}</div></div></div>`;
}
function imprimirPaginas(paginas) {
  $('impressao').innerHTML = paginas.map(p => `<div class="pagina">${p}</div>`).join('');
  document.body.classList.add('imp'); window.print();
  setTimeout(() => document.body.classList.remove('imp'), 800);
}
function imprimir(tipo) {
  if (!tipo || !GR.atual) return;
  imprimirPaginas(tipo === 'turmas' ? D.turmas.map(t => cabImpressao(t.nome) + tabelaTurma(t.nome, false))
    : tipo === 'profs' ? ordenarNomes(D.professores.filter(p => aulasProf(p.nome)).map(p => p.nome)).map(n => cabImpressao('Professor') + tabelaProf(n))
    : [cabImpressao(GR.visao === 'geral' ? 'Todas as turmas' : GR.item) + $('conteudo').innerHTML]);
}

// ---------- Versões anteriores da grade oficial ----------
function abrirVersoes() {
  const vs = D.versoes || [];
  abrirModal('Versões anteriores da grade oficial', !vs.length ? '<p class="suave">Ainda não há versões. Cada “Salvar como oficial” e cada troca de professor guarda uma versão aqui.</p>'
    : `<p class="peq suave" style="margin:0">Cada vez que a grade oficial muda, a versão fica guardada. “Ver” mostra a versão sem mudar nada.</p>
      <table class="tab cartao"><tr><th>Quando</th><th>Quem</th><th>O que mudou</th><th>Válida a partir de</th><th></th></tr>
      ${vs.map((v, i) => `<tr><td style="white-space:nowrap"><b>${esc(v.data)}</b></td><td data-r="Quem">${esc(v.usuario)}</td><td data-r="O que mudou"><div>${esc(v.descricao)}${i === 0 ? ' <span class="tag ok">atual</span>' : ''}</div></td><td data-r="Válida a partir de">${esc(v.vigencia || '—')}</td>
        <td style="white-space:nowrap;gap:6px">${i === 0 ? '' : `<button class="btn mini" onclick="verVersao(${v.versao})">Ver</button>${podeEditar() ? ` <button class="btn mini" onclick="restaurarVersao(${v.versao})">Restaurar</button>` : ''}`}</td></tr>`).join('')}</table>`,
    '<button class="btn prim" onclick="fecharModal()">Fechar</button>');
}
async function verVersao(n) {
  if (GR.editado && !confirm('Há alterações não salvas na grade. Ver a versão mesmo assim?')) return;
  const r = await consultar('lerVersao', { versao: n }); if (!r) return;
  fecharModal();
  GR.atual = comFixas(r.grade); GR.nome = `versão de ${r.info.data.slice(0, 10)}`; GR.versao = n; GR.editado = false; GR.sel = null; GR.mudou = new Set();
  conferir();
}
async function restaurarVersao(n) {
  const v = (D.versoes || []).find(x => x.versao === n); if (!v) return;
  if (!confirm(`Restaurar a versão de ${v.data} (${v.descricao})?\n\nA grade oficial e os professores das turmas voltam a ficar como nessa versão. A grade de hoje continua guardada nas versões anteriores.`)) return;
  if (await acao('restaurarVersao', { versao: n }, 'Versão restaurada.')) { fecharModal(); usarOficial(); GR.mudou = new Set(); telaGrade(); }
}

// ---------- Trocar professor (meio do semestre) sem mexer no resto ----------
function abrirTroca(sai) {
  if (!Object.keys(D.grade).length) return toast('Salve uma grade oficial antes.', 'erro');
  if (GR.editado) return toast('Salve ou descarte as alterações da grade antes.', 'erro');
  const comAulas = ordenarNomes(D.professores.filter(p => aulasProf(p.nome)).map(p => p.nome));
  abrirModal('Trocar professor', `
    <p class="peq suave" style="margin:0">O sistema mantém a grade de todos os outros. Se não houver outro jeito, mostra exatamente quais aulas mudam antes de aplicar.</p>
    <div class="linha-campos">
      <label class="campo">Sai<select id="sSai" onchange="linhasTroca()">${comAulas.map(n => `<option ${n === sai ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
      <label class="campo">Entra<select id="sEntra" onchange="limparTroca()"><option value="">O mesmo (só mudou a disponibilidade)</option>${ordenarNomes(D.professores.map(p => p.nome)).map(n => `<option value="${esc(n)}">${esc(n)}${aulasProf(n) ? '' : ' · sem aulas'}</option>`).join('')}</select></label>
      <label class="campo">Válida a partir de<input type="date" id="sVig" value="${hojeISO()}"></label>
    </div>
    <div><div class="campo" style="margin-bottom:6px">Turmas que passam para quem entra</div><div class="sub-linhas" id="sLinhas"></div></div>
    <div id="sRes"></div>`,
    `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn" id="sCalc" onclick="calcularTroca()">Calcular</button><button class="btn prim" id="sAplicar" onclick="aplicarTroca()" disabled>Aplicar e salvar</button>`);
  linhasTroca();
}
function limparTroca() { $('sRes').innerHTML = ''; $('sAplicar').disabled = true; SUB = null; }
function linhasTroca() {
  const sai = $('sSai').value;
  $('sLinhas').innerHTML = D.carga.filter(c => c.professor === sai).map(c => `<label><input type="checkbox" class="sLinha" onchange="limparTroca()" data-t="${esc(c.turmas.join(' + '))}" data-d="${esc(c.disciplina)}" checked>${esc(c.turmas.join(' + '))} · ${esc(sigla(c.disciplina))}</label>`).join('');
  limparTroca();
}
function calcularTroca() {
  const sai = $('sSai').value, entra = $('sEntra').value || sai;
  const linhas = [...document.querySelectorAll('.sLinha:checked')].map(c => ({ turmas: c.dataset.t, disciplina: c.dataset.d }));
  if (!linhas.length) return toast('Marque pelo menos uma turma.', 'erro');
  const sel = new Set(linhas.map(l => l.turmas + '|' + l.disciplina)), D2 = clone(D), g = clone(D.grade);
  D2.carga.forEach(c => { if (c.professor === sai && sel.has(c.turmas.join(' + ') + '|' + c.disciplina)) c.professor = entra; });
  Object.entries(g).forEach(([k, c]) => { const l = linhaDe(k.split('|')[0], c.disciplina); if (c.professor === sai && l && sel.has(l.turmas.join(' + ') + '|' + c.disciplina)) c.professor = entra; });
  $('sRes').innerHTML = '<div class="aviso">Calculando…</div>'; $('sCalc').disabled = true; $('sAplicar').disabled = true;
  Gerador.reencaixar(D2, g, entra, r => {
    if (!$('sRes')) return;
    $('sCalc').disabled = false; SUB = { sai: sai, entra: entra, linhas: linhas, r: r };
    if (!r.ok) {
      $('sRes').innerHTML = `<div class="aviso erro">Não foi possível encaixar. ${r.erros.length ? '' : 'Libere mais horários de ' + esc(entra) + ' ou ajuste as aulas abaixo.'}</div>
        <ul class="lista">${r.erros.concat(r.gargalos).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      return;
    }
    const dele = r.nAlvo ? `${r.nAlvo} aula(s) de ${esc(entra)} mudam de horário.` : 'Nenhuma aula muda de horário.';
    $('sRes').innerHTML = !r.outros.length ? `<div class="aviso ok">✔ Os outros professores não mudam. ${dele}</div>`
      : `<div class="aviso alerta">Com a disponibilidade de ${esc(entra)} não dá para manter tudo igual. Mudam <b>${r.outros.length}</b> aula(s) de outros professores (o mínimo possível). ${dele}</div>
         <table class="tab cartao"><tr><th>Professor</th><th>Turma</th><th>Matéria</th><th>De</th><th>Para</th></tr>${r.outros.map(o => `<tr><td><b>${esc(o.professor)}</b></td><td data-r="Turma">${esc(o.turma)}</td><td data-r="Matéria">${esc(sigla(o.disciplina))}</td>
           <td data-r="De">${esc(o.de)}</td><td data-r="Para"><b>${esc(o.para)}</b></td></tr>`).join('')}</table>`;
    $('sAplicar').disabled = false;
  });
}
async function aplicarTroca() {
  if (!SUB || !SUB.r.ok) return;
  const vig = $('sVig').value; if (!vig) return toast('Escolha a data “válida a partir de”.', 'erro');
  const antes = clone(D.grade), s = SUB;
  if (!await acao('substituir', { sai: s.sai, entra: s.entra, linhas: s.linhas, grade: s.r.grade, vigencia: vig }, 'Troca aplicada e grade salva.')) return;
  usarOficial(); GR.opcoes = [];
  GR.mudou = new Set(Object.keys(GR.atual).filter(k => !antes[k] || antes[k].disciplina !== GR.atual[k].disciplina || antes[k].professor !== GR.atual[k].professor));
  GR.visao = 'geral'; telaGrade();
  AF = { lista: Gerador.afetados(D, antes, D.grade, s.sai, s.entra), vigencia: D.vigencia || dataBR(vig) };
  resumoTroca();
}
// Depois da troca: quem precisa ser avisado, com a mensagem pronta e a impressão só dos afetados
const PAPEL = { sai: 'Deixa as aulas', entra: 'Assume as aulas', mudou: 'Teve aula mudada' };
function linkWhats(nome, texto) {
  const f = ((profPorNome(nome) || {}).tel || '').replace(/\D/g, ''), num = f.length === 10 || f.length === 11 ? '55' + f : f.length >= 12 ? f : '';
  return 'https:\/\/wa.me/' + num + '?text=' + encodeURIComponent(texto);
}
function resumoTroca() {
  const l = AF.lista, aulas = x => x.map(a => `${esc(a.quando)} · ${esc(a.turma)} · ${esc(sigla(a.disciplina))}`).join('<br>');
  abrirModal('Troca aplicada', `<div class="aviso ok">A nova grade vale a partir de <b>${esc(AF.vigencia)}</b>. Avise os professores abaixo.</div>
    <table class="tab cartao"><tr><th>Professor</th><th>Saem do horário</th><th>Entram no horário</th><th></th></tr>
    ${l.map(a => `<tr><td><div><b>${esc(a.professor)}</b><div><span class="tag ${a.papel === 'mudou' ? 'alerta' : 'neutra'}">${PAPEL[a.papel]}</span></div></div></td>
      <td data-r="Saem" class="peq"><div>${aulas(a.saem) || '<span class="suave">—</span>'}</div></td><td data-r="Entram" class="peq"><div>${aulas(a.entram) || '<span class="suave">—</span>'}</div></td>
      <td><a class="btn mini" target="_blank" href="${esc(linkWhats(a.professor, Gerador.mensagem(a, AF.vigencia, CFG.escola)))}">WhatsApp</a></td></tr>`).join('')}</table>
    <p class="peq suave" style="margin:0">O botão WhatsApp abre a conversa com a mensagem pronta, listando as mudanças daquele professor.</p>`,
    '<button class="btn" onclick="imprimirAfetados()">Imprimir só os afetados</button><button class="btn prim" onclick="fecharModal()">Fechar</button>');
}
function imprimirAfetados() {
  if (!AF) return;
  const profs = AF.lista.map(a => a.professor).filter(n => profPorNome(n) && aulasProf(n));
  const turmas = [...new Set(AF.lista.flatMap(a => a.saem.concat(a.entram)).flatMap(x => x.turma.split(' + ')))].filter(turmaDe);
  imprimirPaginas(profs.map(n => cabImpressao('Professor') + tabelaProf(n)).concat(turmas.map(t => cabImpressao(t) + tabelaTurma(t, false))));
}

iniciar();
</script>
</body>
</html>
