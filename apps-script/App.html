<script>
const CFG = <?!= JSON.stringify(cfg) ?>;
let TOKEN = null, D = null, TELA = 'inicio';
const TODOS = ['admin', 'coordenacao', 'consulta'], EDITA = ['admin', 'coordenacao'];
const NOME_PERFIL = { admin: 'Administrador', coordenacao: 'Coordenação', consulta: 'Consulta' };
const TELAS = [
  { id: 'inicio', nome: 'Início', grupo: 'Dia a dia', p: TODOS, sub: 'O que falta para fechar a grade, com atalho para resolver cada item.' },
  { id: 'grade', nome: 'Grade horária', grupo: 'Dia a dia', p: TODOS, sub: 'Gere opções de grade, escolha uma, ajuste e salve a oficial. Troca de professor e versões anteriores também ficam aqui.' },
  { id: 'professores', nome: 'Professores', grupo: 'Dia a dia', p: EDITA, sub: 'Quem dá aula, quais matérias ensina e em que horários não pode.' },
  { id: 'atribuicoes', nome: 'Atribuições', grupo: 'Dia a dia', p: EDITA, sub: 'Quem dá cada matéria em cada turma, e quantas aulas por semana.' },
  { id: 'fixas', nome: 'Aulas fixas', grupo: 'Dia a dia', p: EDITA, sub: 'Aulas que precisam ficar sempre no mesmo horário. O gerador não mexe nelas.' },
  { id: 'matriz', nome: 'Matriz curricular', grupo: 'Configuração', p: EDITA, sub: 'Quantas aulas por semana cada série tem de cada matéria.' },
  { id: 'turmas', nome: 'Turmas', grupo: 'Configuração', p: EDITA, sub: 'Cadastro das turmas: nome, segmento, série e horário das aulas.' },
  { id: 'horarios', nome: 'Horários das aulas', grupo: 'Configuração', p: EDITA, sub: 'Início e fim de cada aula e dos intervalos, em cada período (EFAI Manhã, EFAF Manhã…).' },
  { id: 'usuarios', nome: 'Usuários', grupo: 'Configuração', p: ['admin'], sub: 'Quem pode entrar no sistema e o que cada um pode fazer.' },
];
const podeEditar = () => EDITA.includes(D.usuario.perfil);
const clone = o => JSON.parse(JSON.stringify(o));

// ================= Entrada, sessão e navegação =================
function iniciar() {
  $('loginLogo').innerHTML = logoHtml(CFG);
  $('lCredito').textContent = CFG.credito ? 'Sistema por ' + CFG.credito : '';
  let t = null; try { t = sessionStorage.getItem('gh_token'); } catch (e) { }
  if (!t) return mostrarLogin();
  TOKEN = t; ocupado(true);
  chamar('api', TOKEN, 'carregar').then(d => { D = d; abrirApp(); }).catch(() => { TOKEN = null; mostrarLogin(); }).finally(() => ocupado(false));
}
async function entrar(ev) {
  ev.preventDefault(); $('lErro').hidden = true; $('lBtn').disabled = true; ocupado(true);
  try {
    const r = await chamar('login', $('lUsuario').value, $('lSenha').value);
    TOKEN = r.token; try { sessionStorage.setItem('gh_token', TOKEN); } catch (e) { }
    D = await chamar('api', TOKEN, 'carregar'); $('lSenha').value = ''; TELA = 'inicio'; abrirApp();
  } catch (e) { $('lErro').textContent = e.message; $('lErro').hidden = false; }
  finally { $('lBtn').disabled = false; ocupado(false); }
}
function mostrarLogin(msg) {
  $('app').hidden = true; $('login').hidden = false;
  if (msg) { $('lErro').textContent = msg; $('lErro').hidden = false; }
  setTimeout(() => $('lUsuario').focus(), 50);
}
function abrirApp() {
  $('login').hidden = true; $('app').hidden = false;
  $('topoLogo').innerHTML = logoHtml(CFG, true);
  $('topoUsuario').textContent = D.usuario.nome;
  const minhas = TELAS.filter(t => t.p.includes(D.usuario.perfil));
  $('menu').innerHTML = ['Dia a dia', 'Configuração'].map(g => { const ts = minhas.filter(t => t.grupo === g); return !ts.length ? '' :
    `<div class="menu-grupo">${g}${g === 'Configuração' ? ' <span>(raro)</span>' : ''}</div>` + ts.map(t => `<button data-t="${t.id}" onclick="ir('${t.id}')">${t.nome}</button>`).join(''); }).join('');
  GR = novoGR(); ir(TELA, true);
}
async function sair() {
  if (temAlteracao() && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  try { await chamar('sair', TOKEN); } catch (e) { }
  TOKEN = null; D = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  AT = null; HO = null; FX = null; MZ = null; mostrarLogin();
}
function expirou() {
  TOKEN = null; try { sessionStorage.removeItem('gh_token'); } catch (e) { }
  fecharModal(); mostrarLogin('Sua sessão expirou. Entre novamente.'); return false;
}
async function acao(nome, dados, msgOk) {
  ocupado(true);
  try { D = await chamar('api', TOKEN, nome, dados); if (msgOk) toast(msgOk); render(); return true; }
  catch (e) { if (/SESSAO_EXPIRADA/.test(e.message)) return expirou(); toast(e.message, 'erro'); return false; }
  finally { ocupado(false); }
}
async function consultar(nome, dados) {   // ação só de leitura (não muda D)
  ocupado(true);
  try { return await chamar('api', TOKEN, nome, dados); }
  catch (e) { if (/SESSAO_EXPIRADA/.test(e.message)) return expirou() || null; toast(e.message, 'erro'); return null; }
  finally { ocupado(false); }
}
const sujoTela = t => (t === 'atribuicoes' && AT && AT.sujo) || (t === 'horarios' && HO_SUJO) || (t === 'fixas' && FX_SUJO) || (t === 'matriz' && MZ && MZ.sujo);
function temAlteracao() { return !!(AT && AT.sujo) || !!HO_SUJO || !!FX_SUJO || !!(MZ && MZ.sujo) || (GR && GR.editado); }
function ir(t, forcar) {
  if (!TELAS.some(x => x.id === t && x.p.includes(D.usuario.perfil))) t = 'inicio';
  if (!forcar && t !== TELA) {
    if (sujoTela(TELA) && !confirm('Há alterações não salvas nesta tela. Sair sem salvar?')) return;
    if (TELA === 'atribuicoes') AT = null; if (TELA === 'horarios') { HO = null; HO_SUJO = false; } if (TELA === 'fixas') { FX = null; FX_SUJO = false; } if (TELA === 'matriz') MZ = null;
  }
  TELA = t;
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  render(); window.scrollTo(0, 0);
}
function render() {
  ({ inicio: telaInicio, professores: telaProfessores, atribuicoes: telaAtribuicoes, turmas: telaTurmas, matriz: telaMatriz, grade: telaGrade, fixas: telaFixas, horarios: telaHorarios, usuarios: telaUsuarios })[TELA]();
}
function cabecalho(tit, acoes) {   // título + frase curta explicando para que serve a tela
  const t = TELAS.find(x => x.id === TELA);
  return `<div class="cab-tela"><div><h1>${tit}</h1>${t && t.sub ? `<p class="sub">${t.sub}</p>` : ''}</div><div class="acoes">${acoes || ''}</div></div>`;
}
function abrirModal(titulo, corpo, rodape) {
  $('modalCaixa').innerHTML = `<div class="cab"><h2>${titulo}</h2><button class="link" onclick="fecharModal()" style="font-size:22px;color:var(--suave)">×</button></div><div class="corpo">${corpo}</div><div class="rod">${rodape}</div>`;
  $('modal').hidden = false;
}
function fecharModal() { $('modal').hidden = true; $('modalCaixa').innerHTML = ''; window.aoMudarDisp = null; }

// ---------- ajudantes ----------
const profPorNome = n => D.professores.find(p => p.nome === n);
const gradeDe = nome => D.grades.find(g => g.nome === nome);
const turmaDe = nome => D.turmas.find(t => t.nome === nome);
const gradeDaTurma = nome => { const t = turmaDe(nome); return t && gradeDe(t.grade); };
const aulasTurma = nome => aulasDe(gradeDaTurma(nome));
const capacidade = nome => aulasTurma(nome).length * D.dias.length;
const cargaDe = turma => D.carga.filter(c => c.turmas.includes(turma));
const linhaDe = (turma, disc) => D.carga.find(c => c.turmas.includes(turma) && c.disciplina === disc);
const somaCarga = turma => cargaDe(turma).reduce((s, c) => s + c.aulas, 0);
const aulasProf = nome => D.carga.filter(c => c.professor === nome).reduce((s, c) => s + c.aulas, 0);
const totalFaixas = () => D.dias.length * Object.values(D.faixas).reduce((s, h) => s + h.length, 0);
const sigla = disc => { const c = D.componentes.find(x => x.nome === disc); return (c && c.sigla) || disc; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const horasTxt = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min';
const msgForm = () => `Olá! Aqui é a coordenação do ${CFG.escola}. Marque neste link os horários em que você não pode dar aula: ${D.linkForm}`;

const ordenarNomes = l => l.slice().sort((a, b) => a.localeCompare(b, 'pt'));
// Diferenças entre a carga da turma e a matriz da série dela
function difMatriz(t) {
  const alvo = D.matriz.filter(m => m.serie === t.serie); if (!alvo.length) return [];
  const tem = {}; cargaDe(t.nome).forEach(c => tem[c.disciplina] = c.aulas);
  const dif = alvo.filter(m => tem[m.componente] !== m.aulas).map(m => `${sigla(m.componente)} ${tem[m.componente] || 0}→${m.aulas}`);
  Object.keys(tem).filter(d => !alvo.some(m => m.componente === d)).forEach(d => dif.push(`${sigla(d)} fora da matriz`));
  return dif;
}

      : '<div class="aviso ok">Tudo pronto: nenhuma pendência.</div>');
  } else h += '</div>';
  $('tela').innerHTML = h;

// Pendências em linguagem simples, cada uma com o caminho para resolver
function pendencias() {
  const P = [], add = (texto, botao, ir) => P.push({ texto, botao, ir });
  const regulares = D.turmas.filter(t => t.segmento !== 'Extra'), M = D.professores.length && D.carga.length ? Gerador.modelo(D) : null;
  D.turmas.filter(t => !t.segmento || (t.segmento !== 'Extra' && !t.serie)).forEach(t =>
    add(`A turma ${t.nome} está sem ${!t.segmento ? 'segmento' : 'série'}.`, 'Corrigir a turma', () => { ir('turmas'); editarTurma(t.nome); }));
  const semProf = {};
  D.carga.filter(c => !c.professor).forEach(c => { const s = (turmaDe(c.turmas[0]) || {}).segmento || '?'; semProf[s] = (semProf[s] || 0) + 1; });
  Object.entries(semProf).forEach(([s, n]) => { const c = D.carga.find(x => !x.professor && ((turmaDe(x.turmas[0]) || {}).segmento || '?') === s);
    add(`${n} ${n === 1 ? 'matéria ainda está' : 'matérias ainda estão'} sem professor no ${s === 'Extra' ? 'contraturno' : s}.`, 'Escolher professores', () => irAtrib(c && c.turmas[0])); });
  if (M) Object.entries(M.sobrecarga).forEach(([p, x]) => add(`${p} tem ${x.aulas} aulas, mas só ${x.livres} horários livres${x.grade ? ' (' + x.grade + ')' : ''}. Libere horários ou passe aulas para outro professor.`, 'Ver professor', () => { ir('professores'); editarProfessor(p); }));
  regulares.forEach(t => {
    const u = somaCarga(t.nome), cap = capacidade(t.nome);
    if (u < cap) add(`A turma ${t.nome} tem ${u} aulas por semana; faltam ${cap - u} para completar os ${cap} horários.`, 'Ver a turma', () => irAtrib(t.nome));
    else if (u > cap) add(`A turma ${t.nome} tem ${u} aulas por semana, ${u - cap} a mais do que cabe (${cap}).`, 'Ver a turma', () => irAtrib(t.nome));
  });
  regulares.forEach(t => { const dif = difMatriz(t); if (dif.length) add(`A turma ${t.nome} não segue a matriz do ${t.serie} (${dif.slice(0, 2).join(', ')}${dif.length > 2 ? '…' : ''}).`, 'Aplicar a matriz', () => { ir('matriz'); abrirAplicar(); }); });
  if (M) M.erros.filter(e => !/falta escolher o professor|horários livres|passam do limite/.test(e)).forEach(e => {
    if (/Aula fixa/.test(e)) add(e, 'Ver aulas fixas', () => ir('fixas'));
    else if (/horário das aulas/.test(e)) add(e, 'Ver turmas', () => ir('turmas'));
    else add(e, 'Ver atribuições', () => ir('atribuicoes'));
  });
  D.professores.filter(p => !aulasProf(p.nome) && p.respondeuEm).forEach(p => add(`${p.nome} marcou a disponibilidade, mas ainda não tem aulas.`, 'Dar aulas', () => { ir('atribuicoes'); if (AT) { AT.aba = 'prof'; telaAtribuicoes(); } }));
  const nao = D.professores.filter(p => !p.respondeuEm).length;
  if (nao) add(`${nao} ${nao === 1 ? 'professor ainda não marcou' : 'professores ainda não marcaram'} os horários em que não podem (formulário).`, 'Enviar o link', () => ir('professores'));
  if (!Object.keys(D.grade).length) add('A grade oficial ainda não foi salva.', 'Montar a grade', () => ir('grade'));
  else { const v = Gerador.validar(D, D.grade); if (v.problemas.length) add(`A grade oficial tem ${v.problemas.length} conflito(s): algum cadastro mudou depois que ela foi salva.`, 'Ver a grade', () => ir('grade')); }
  return P;
}

// ================= Atribuições (quem dá cada matéria em cada turma) =================
// Escolhe a turma → lista das matérias dela com o professor de cada uma. Edita em memória e salva tudo de uma vez.
let AT = null;
function iniciarAT(turma) {
  AT = { carga: clone(D.carga), sujo: false, aba: 'turma', turma: '' };
  const todas = turmasEmOrdem();
  AT.turma = turma && turmaDe(turma) ? turma : ((todas.find(t => !statusTurma(t.nome).ok) || todas[0] || {}).nome || '');
}
function turmasEmOrdem() {
  const segs = Object.keys(D.series), r = [];
  segs.concat(['']).forEach(seg => {
    const series = D.series[seg] || [];
    D.turmas.filter(t => seg ? t.segmento === seg : !segs.includes(t.segmento))
      .sort((a, b) => series.indexOf(a.serie) - series.indexOf(b.serie) || a.nome.localeCompare(b.nome, 'pt', { numeric: true })).forEach(t => r.push(t));
  });
  return r;
}
const atCarga = turma => AT.carga.filter(l => l.turmas.includes(turma));
const atModelo = () => Gerador.modelo(Object.assign({}, D, { carga: AT.carga }));
const irmasDe = t => t.serie ? D.turmas.filter(x => x.serie === t.serie && x.segmento === t.segmento && x.nome !== t.nome) : [];
const faltaMatriz = t => D.matriz.filter(m => m.serie === t.serie && !atCarga(t.nome).some(l => l.disciplina === m.componente));
// com/total = matérias com professor; ok = todas com professor e a semana completa (contraturno: não precisa completar)
function statusTurma(nome) {
  const t = turmaDe(nome), ls = (AT ? atCarga(nome) : cargaDe(nome)), falta = faltaMatriz(t).length;
  const com = ls.filter(l => l.professor).length, total = ls.length + falta, aulas = ls.reduce((s, l) => s + l.aulas, 0), cap = capacidade(nome);
  return { com, total, aulas, cap, ok: total > 0 && com === total && (t.segmento === 'Extra' ? aulas <= cap : aulas === cap) };
}
function telaAtribuicoes() {
  if (!AT) iniciarAT();
  $('tela').innerHTML = cabecalho('Atribuições', `<button class="btn" onclick="AT=null;telaAtribuicoes()" ${AT.sujo ? '' : 'disabled'}>Descartar</button>
      <button class="btn prim" onclick="salvarAtribuicoes()" ${AT.sujo ? '' : 'disabled'}>Salvar</button>`)
    + `<div class="card"><div class="abas"><button class="btn mini ${AT.aba === 'turma' ? 'on' : ''}" onclick="AT.aba='turma';telaAtribuicoes()">Por turma</button>
        <button class="btn mini ${AT.aba === 'prof' ? 'on' : ''}" onclick="AT.aba='prof';telaAtribuicoes()">Por professor</button>
        ${AT.sujo ? '<span class="tag alerta" style="margin-left:auto">Alterações não salvas</span>' : ''}</div><div id="atCorpo"></div></div>`;
  AT.aba === 'prof' ? atPorProfessor() : atPorTurma();
}
function redesenharAT() { const y = window.scrollY; telaAtribuicoes(); window.scrollTo(0, y); }
function atSujo() { AT.sujo = true; }
function atTurma(t) { AT.turma = t; AT.aba = 'turma'; AT.ultimo = -1; redesenharAT(); }

function atPorTurma() {
  const M = atModelo(), todas = turmasEmOrdem();
  let h = '<p class="peq suave" style="margin:0 0 8px">Escolha a turma. O número mostra quantas matérias já têm professor (verde: turma pronta).</p><div class="at-turmas">';
  Object.keys(D.series).concat(['Outras']).forEach(seg => {
    const ts = todas.filter(t => seg === 'Outras' ? !D.series[t.segmento] : t.segmento === seg); if (!ts.length) return;
    let ant = null;
    h += `<div class="at-seg"><span class="at-seg-nome">${seg === 'Extra' ? 'Contraturno' : seg}</span><div class="at-chips">` + ts.map(t => {
      const st = statusTurma(t.nome), sep = ant !== null && t.serie !== ant ? '<span class="at-sep"></span>' : ''; ant = t.serie;
      return sep + `<button class="at-chip ${st.ok ? 'ok' : 'alerta'} ${t.nome === AT.turma ? 'on' : ''}" data-t="${esc(t.nome)}" onclick="atTurma(this.dataset.t)"
        title="${st.com} de ${st.total} matérias com professor · ${st.aulas} de ${st.cap} aulas por semana">${esc(t.nome)} <small>${st.com}/${st.total}</small></button>`;
    }).join('') + '</div></div>';
  });
  h += '</div>';
  $('atCorpo').innerHTML = h + (AT.turma && turmaDe(AT.turma) ? painelTurma(AT.turma, M) : '<p class="suave">Nenhuma turma cadastrada.</p>');
}
function painelTurma(nome, M) {
  const t = turmaDe(nome), seg = t.segmento, st = statusTurma(nome), irmas = irmasDe(t);
  const ordem = D.matriz.filter(m => m.serie === t.serie).map(m => m.componente);
  const idx = AT.carga.map((_, i) => i).filter(i => AT.carga[i].turmas.includes(nome))
    .sort((a, b) => { const x = ordem.indexOf(AT.carga[a].disciplina), y = ordem.indexOf(AT.carga[b].disciplina); return (x < 0 ? 999 : x) - (y < 0 ? 999 : y) || AT.carga[a].disciplina.localeCompare(AT.carga[b].disciplina, 'pt'); });
  const semana = seg === 'Extra' ? `<span class="tag neutra">${st.aulas} aula(s) por semana</span>`
    : `<span class="tag ${st.aulas === st.cap ? 'ok' : 'alerta'}">${st.aulas} de ${st.cap} aulas por semana</span>${st.aulas < st.cap ? ` <span class="peq suave">faltam ${st.cap - st.aulas}</span>` : st.aulas > st.cap ? ` <span class="peq" style="color:var(--erro)">${st.aulas - st.cap} a mais do que cabe</span>` : ''}`;
  const linha = i => {
    const l = AT.carga[i], outras = l.turmas.filter(x => x !== nome), sob = l.professor && M.sobrecarga[l.professor];
    const mz = (D.matriz.find(m => m.serie === t.serie && m.componente === l.disciplina) || {}).aulas;
    const difere = l.professor && i === AT.ultimo ? irmas.filter(x => { const y = AT.carga.find(c => c.turmas.includes(x.nome) && c.disciplina === l.disciplina); return y && !y.turmas.includes(nome) && y.professor !== l.professor; }) : [];
    return `<tr class="${!l.professor ? 'semprof' : sob ? 'sobre' : ''}">
      <td><b>${esc(l.disciplina)}</b>${outras.length ? `<div class="peq suave">🔗 junto com ${esc(outras.join(', '))}</div>` : ''}${l.duplas ? `<div class="peq suave">${l.duplas} aula(s) dupla(s)</div>` : ''}</td>
      <td><input type="number" min="1" max="20" value="${l.aulas}" onchange="atAulas(${i},this.value)" style="width:66px">${mz && mz !== l.aulas ? `<div class="peq" style="color:var(--alerta)">a matriz pede ${mz}</div>` : ''}</td>
      <td><select onchange="atProf(${i},this.value)">${opcoesProf(listasProf(l.disciplina, seg), l.disciplina, seg, l.professor)}</select>
        ${sob ? `<div class="peq" style="color:var(--erro)">⚠ ${esc(l.professor)} fica com ${sob.aulas} aulas, mas só tem ${sob.livres} horários livres.</div>` : ''}
        ${difere.length ? `<button class="link peq" onclick="atSerie(${i})">Usar ${esc(l.professor)} também ${difere.length === 1 ? 'na' : 'nas turmas'} ${esc(difere.map(x => x.nome).join(', '))}</button>` : ''}</td>
      <td style="text-align:right"><button class="btn mini" title="Aula dupla, turmas juntas, tirar a matéria" onclick="atMais(${i})">⋯</button></td></tr>`;
  };
  const faltam = faltaMatriz(t);
  return `<div class="at-painel"><div class="cab-tela" style="margin:16px 0 10px">
      <div><h2>${esc(nome)} <span class="peq suave">· ${esc(t.serie || 'contraturno')} · ${esc(t.grade)}</span></h2><div style="margin-top:4px">${semana}</div></div>
      <div class="acoes"><button class="btn" onclick="atCopiar()">Copiar professores de outra turma</button><button class="btn" onclick="atNovaMateria()">+ Matéria</button></div></div>
    ${idx.length || faltam.length ? `<div class="rolar"><table class="tab at-lista"><tr><th>Matéria</th><th>Aulas por semana</th><th>Professor</th><th></th></tr>
      ${idx.map(linha).join('')}
      ${faltam.map(m => `<tr class="falta"><td><b>${esc(m.componente)}</b> <span class="tag alerta">falta na turma</span></td><td>${m.aulas}</td>
        <td><button class="btn mini" data-c="${esc(m.componente)}" onclick="atAdicionar(this.dataset.c)">Adicionar à turma</button></td><td></td></tr>`).join('')}</table></div>`
      : '<p class="suave">Esta turma ainda não tem matérias. Use “+ Matéria”.</p>'}
    <p class="peq suave" style="margin:10px 0 0">Na lista de professores aparecem primeiro os que dão a matéria neste segmento. Em “⋯”: usar o professor nas outras turmas da série, aula dupla, turmas juntas e tirar a matéria.</p></div>`;
}
// Professores que têm a matéria (e o segmento) primeiro; os outros em "Outros professores"
function listasProf(comp, seg) {
  const pref = [], outros = [];
  ordenarNomes(D.professores.map(p => p.nome)).forEach(n => { const p = profPorNome(n); (p.materias.includes(comp) && (!p.segmentos.length || p.segmentos.includes(seg)) ? pref : outros).push(n); });
  return { pref, outros };
}
function opcoesProf(L, comp, seg, atual) {
  const o = n => `<option ${n === atual ? 'selected' : ''}>${esc(n)}</option>`;
  return `<option value="">— a definir —</option>` + (L.pref.length ? `<optgroup label="Dão ${esc(sigla(comp))}${seg ? ' no ' + esc(seg) : ''}">${L.pref.map(o).join('')}</optgroup>` : '')
    + `<optgroup label="Outros professores">${L.outros.map(o).join('')}</optgroup>`;
}
function atProf(i, v) { AT.carga[i].professor = v; AT.ultimo = i; atSujo(); redesenharAT(); }   // "ultimo": mostra o atalho para a série nessa linha
function atAulas(i, v) {
  const l = AT.carga[i], n = Math.round(+v);
  if (!(n > 0)) { toast('Informe as aulas por semana.', 'erro'); return redesenharAT(); }
  l.aulas = n; if (l.duplas * 2 > n) l.duplas = Math.floor(n / 2);
  if ((l.maxDia || 2) * D.dias.length < n) l.maxDia = Math.max(Math.ceil(n / D.dias.length), Math.min(n, 2));
  atSujo(); redesenharAT();
}
function atSerie(i) {   // mesmo professor nas outras turmas da série
  const l = AT.carga[i], t = turmaDe(AT.turma), nomes = [];
  irmasDe(t).forEach(x => AT.carga.forEach(y => { if (y !== l && y.turmas.includes(x.nome) && y.disciplina === l.disciplina && y.professor !== l.professor) { y.professor = l.professor; nomes.push(x.nome); } }));
  toast(nomes.length ? `${l.professor} também em ${nomes.join(', ')}.` : 'As outras turmas da série já têm esse professor.'); if (nomes.length) atSujo(); redesenharAT();
}
function atAdicionar(comp) {
  const t = turmaDe(AT.turma), n = (D.matriz.find(m => m.serie === t.serie && m.componente === comp) || {}).aulas || 1;
  AT.carga.push({ turmas: [AT.turma], disciplina: comp, professor: '', aulas: n, duplas: 0, maxDia: Math.max(Math.ceil(n / 5), Math.min(n, 2)) });
  atSujo(); redesenharAT();
}
// "⋯": aula dupla, máximo no dia, turmas juntas, tirar a matéria
function atMais(i) {
  const turma = AT.turma, t = turmaDe(turma), l = AT.carga[i];
  AT.ed = { i, turma, linha: clone(l) };
  const mesmas = D.turmas.filter(x => x.nome !== turma && x.grade === t.grade), irmas = irmasDe(t).filter(x => !l.turmas.includes(x.nome));
  abrirModal(`${esc(l.disciplina)} · ${esc(turma)}`, `${l.professor && irmas.length ? `<div><button class="btn mini" onclick="fecharModal();atSerie(${i})">Usar ${esc(l.professor)} em ${esc(l.disciplina)} também ${irmas.length === 1 ? 'na' : 'nas turmas'} ${esc(irmas.map(x => x.nome).join(', '))}</button></div>` : ''}
    <div class="linha-campos">
      <label class="campo" title="Duas aulas seguidas, sem intervalo no meio">Aulas duplas por semana<input id="adDuplas" type="number" min="0" value="${l.duplas || 0}"></label>
      <label class="campo">Máximo de aulas no mesmo dia<input id="adMax" type="number" min="1" value="${l.maxDia || 2}"></label></div>
    <div><div class="campo" style="margin-bottom:6px">Turmas juntas (mesmo horário e mesmo professor)</div>
      <div class="sub-linhas">${mesmas.map(x => `<label><input type="checkbox" class="adJ" value="${esc(x.nome)}" ${l.turmas.includes(x.nome) ? 'checked' : ''}>${esc(x.nome)}</label>`).join('') || '<span class="suave peq">Nenhuma outra turma com o mesmo horário das aulas.</span>'}</div></div>`,
    `<button class="btn perigo esq" onclick="atTirar()">Tirar ${esc(l.disciplina)} de ${esc(turma)}</button><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn prim" onclick="atOkMais()">Ok</button>`);
}
function atOkMais() {
  const e = AT.ed, l = e.linha, antes = AT.carga[e.i].turmas;
  l.duplas = +$('adDuplas').value || 0; l.maxDia = +$('adMax').value || 2;
  if (l.duplas * 2 > l.aulas) return toast(`Aulas duplas demais para ${l.aulas} aulas por semana.`, 'erro');
  if (l.duplas && l.maxDia < 2) return toast('Com aula dupla, o máximo no mesmo dia precisa ser pelo menos 2.', 'erro');
  l.turmas = [e.turma].concat([...document.querySelectorAll('.adJ:checked')].map(x => x.value));
  const outras = AT.carga.map((_, j) => j).filter(j => j !== e.i && AT.carga[j].disciplina === l.disciplina && AT.carga[j].turmas.some(t => l.turmas.includes(t)));
  if (outras.length) {
    const ts = [...new Set([].concat(...outras.map(j => AT.carga[j].turmas.filter(t => l.turmas.includes(t)))))];
    if (!confirm(`${ts.join(', ')} já ${ts.length > 1 ? 'têm' : 'tem'} ${l.disciplina} separada. Juntar as aulas (com o professor e as aulas de ${e.turma})?`)) return;
    outras.forEach(j => { AT.carga[j].turmas = AT.carga[j].turmas.filter(t => !l.turmas.includes(t)); });
  }
  antes.filter(t => !l.turmas.includes(t)).forEach(t => AT.carga.push({ ...clone(l), turmas: [t] }));   // turma desmarcada fica com a aula separada
  AT.carga[e.i] = l; AT.carga = AT.carga.filter(x => x.turmas.length);
  fecharModal(); atSujo(); redesenharAT();
}
function atTirar() {
  const e = AT.ed, l = AT.carga[e.i];
  if (!confirm(`Tirar ${l.disciplina} da turma ${e.turma}?`)) return;
  l.turmas = l.turmas.filter(t => t !== e.turma); AT.carga = AT.carga.filter(x => x.turmas.length);
  fecharModal(); atSujo(); redesenharAT();
}
function atCopiar() {
  const t = turmaDe(AT.turma), irmas = irmasDe(t).map(x => x.nome), outras = turmasEmOrdem().map(x => x.nome).filter(n => n !== t.nome && !irmas.includes(n));
  abrirModal(`Copiar professores para ${esc(t.nome)}`, `<p class="peq suave" style="margin:0">Cada matéria que as duas turmas têm fica com o mesmo professor da turma escolhida. O resto não muda.</p>
    <label class="campo">Copiar de<select id="cpDe">${irmas.length ? `<optgroup label="Mesma série">${irmas.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>` : ''}
      <optgroup label="Outras turmas">${outras.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup></select></label>`,
    `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn prim" onclick="atOkCopiar()">Copiar</button>`);
}
function atOkCopiar() {
  const de = $('cpDe').value; let n = 0;
  atCarga(AT.turma).forEach(l => {
    if (l.turmas.includes(de)) return;
    const o = AT.carga.find(x => x.turmas.includes(de) && x.disciplina === l.disciplina);
    if (o && o.professor && o.professor !== l.professor) { l.professor = o.professor; n++; }
  });
  fecharModal(); toast(n ? `${n} professor(es) copiado(s) de ${de}.` : `Nada para copiar: as matérias em comum já têm os mesmos professores.`);
  if (n) atSujo(); redesenharAT();
}
function atNovaMateria() {
  const turma = AT.turma, t = turmaDe(turma), mesmas = D.turmas.filter(x => x.nome !== turma && x.grade === t.grade);
  abrirModal(`Nova matéria · ${esc(turma)}`, `<div class="linha-campos">
      <label class="campo">Matéria<input id="anMat" list="anLista" placeholder="Ex.: Teatro" oninput="anProfs()"></label>
      <label class="campo">Aulas por semana<input id="anAulas" type="number" min="1" value="1"></label>
      <label class="campo">Professor<select id="anProf"></select></label></div>
    <datalist id="anLista">${D.componentes.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist>
    ${mesmas.length ? `<div><div class="campo" style="margin-bottom:6px">Junto com (mesmo horário e mesmo professor) — opcional</div><div class="sub-linhas">${mesmas.map(x => `<label><input type="checkbox" class="anT" value="${esc(x.nome)}">${esc(x.nome)}</label>`).join('')}</div></div>` : ''}`,
    `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn prim" onclick="anOk()">Adicionar</button>`);
  anProfs();
}
function anProfs() { const c = $('anMat').value.trim(), seg = (turmaDe(AT.turma) || {}).segmento; $('anProf').innerHTML = opcoesProf(listasProf(c, seg), c || 'a matéria', seg, ''); }
function anOk() {
  const comp = $('anMat').value.trim(), aulas = +$('anAulas').value, prof = $('anProf').value;
  const ts = [AT.turma].concat([...document.querySelectorAll('.anT:checked')].map(x => x.value));
  if (!comp) return toast('Escolha a matéria.', 'erro');
  if (!(aulas > 0)) return toast('Informe as aulas por semana.', 'erro');
  const ja = ts.filter(t => AT.carga.some(l => l.turmas.includes(t) && l.disciplina === comp));
  if (ja.length) return toast(`${ja.join(', ')} já ${ja.length > 1 ? 'têm' : 'tem'} ${comp}.`, 'erro');
  AT.carga.push({ turmas: ts, disciplina: comp, professor: prof, aulas, duplas: 0, maxDia: Math.max(Math.ceil(aulas / 5), Math.min(aulas, 2)) });
  fecharModal(); atSujo(); redesenharAT();
}
// Visão secundária: o que cada professor dá
function atPorProfessor() {
  const M = atModelo(), semProf = AT.carga.filter(l => !l.professor);
  const item = l => `<button class="link" data-t="${esc(l.turmas[0])}" onclick="atTurma(this.dataset.t)">${esc(l.turmas.join(' + '))}</button> <span class="suave">(${l.aulas})</span>`;
  const linhas = ordenarNomes(D.professores.map(p => p.nome)).map(n => {
    const ls = AT.carga.filter(l => l.professor === n), tot = ls.reduce((s, l) => s + l.aulas, 0), sob = M.sobrecarga[n];
    const mats = [...new Set(ls.map(l => l.disciplina))].map(m => `<div><b>${esc(sigla(m))}</b>: ${ls.filter(l => l.disciplina === m).map(item).join(', ')}</div>`).join('');
    return `<tr class="${sob ? 'sobre' : ''}"><td><b>${esc(n)}</b></td><td class="peq">${mats || '<span class="suave">nenhuma aula</span>'}</td>
      <td>${tot || '<span class="tag alerta">0</span>'}${sob ? `<div class="peq" style="color:var(--erro)">só ${sob.livres} horários livres</div>` : ''}</td></tr>`;
  }).join('');
  $('atCorpo').innerHTML = `${semProf.length ? `<div class="aviso alerta" style="margin-bottom:10px">${semProf.length} matéria(s) sem professor: ${semProf.slice(0, 8).map(item).join(', ')}${semProf.length > 8 ? '…' : ''}</div>` : ''}
    <div class="rolar"><table class="tab at-lista"><tr><th>Professor</th><th>O que dá (aulas por semana)</th><th>Total</th></tr>${linhas}</table></div>
    <p class="peq suave" style="margin:10px 0 0">Clique numa turma para mudar o professor.</p>`;
}
async function salvarAtribuicoes() {
  const aba = AT.aba, turma = AT.turma;
  if (await acao('salvarAtribuicoes', { carga: AT.carga, antes: D.carga }, 'Atribuições salvas.')) { iniciarAT(turma); AT.aba = aba; telaAtribuicoes(); }
}

// ================= Matriz curricular =================
const SEGS_MATRIZ = ['EFAI', 'EFAF', 'EM'];
let MZ = null;
function iniciarMZ(aba) {
  const m = {}, ordem = {};
  D.matriz.forEach(x => (m[x.serie] = m[x.serie] || {})[x.componente] = x.aulas);
  SEGS_MATRIZ.forEach(seg => { ordem[seg] = []; D.matriz.forEach(x => { if (D.series[seg].includes(x.serie) && !ordem[seg].includes(x.componente)) ordem[seg].push(x.componente); }); });
  MZ = { aba: aba || 'EFAI', m, ordem, comps: D.componentes.map(c => ({ nome: c.nome, nomeAntigo: c.nome, sigla: c.sigla, apelidos: c.apelidos.join('; ') })), sujo: false };
}
function mzSujo() { MZ.sujo = true; $('mzSalvar').disabled = $('mzDesc').disabled = false; }
const mzComp = nome => MZ.comps.find(c => c.nome === nome);
function telaMatriz() {
  if (!MZ) iniciarMZ();
  const abas = SEGS_MATRIZ.concat(['Componentes']).map(a => `<button class="btn mini ${MZ.aba === a ? 'on' : ''}" onclick="MZ.aba='${a}';telaMatriz()">${a === 'Componentes' ? 'Matérias e siglas' : a}</button>`).join('');
  $('tela').innerHTML = cabecalho('Matriz curricular',
    `<button class="btn" id="mzDesc" onclick="iniciarMZ(MZ.aba);telaMatriz()" ${MZ.sujo ? '' : 'disabled'}>Descartar</button>
     <button class="btn" id="mzSalvar" onclick="salvarMatriz()" ${MZ.sujo ? '' : 'disabled'}>Salvar</button>
     <button class="btn prim" onclick="abrirAplicar()">Aplicar matriz às turmas</button>`)
    + `<div class="card"><div class="abas">${abas}</div><div id="mzCorpo" class="rolar"></div></div>`;
  if (MZ.aba === 'Componentes') tabelaComps(); else tabelaMatriz(MZ.aba);
}
function tabelaMatriz(seg) {
  const series = D.series[seg], comps = MZ.ordem[seg];
  $('mzCorpo').innerHTML = `<table class="tab mz"><tr><th>Matéria</th><th>Sigla</th>${series.map(s => `<th>${s}</th>`).join('')}<th></th></tr>
    ${comps.map((nome, i) => `<tr><td><input list="mzLista" value="${esc(nome)}" data-seg="${seg}" data-i="${i}" onchange="mzTrocarLinha(this)"></td>
      <td><input value="${esc((mzComp(nome) || {}).sigla || '')}" data-c="${esc(nome)}" oninput="mzSigla(this)" style="max-width:110px"></td>
      ${series.map(s => `<td><input type="number" min="0" max="40" value="${(MZ.m[s] || {})[nome] || ''}" data-s="${s}" data-c="${esc(nome)}" oninput="mzValor(this)"></td>`).join('')}
      <td><button class="link" style="color:var(--erro)" data-seg="${seg}" data-i="${i}" onclick="mzRemover(this)">✕</button></td></tr>`).join('')}
    <tr class="total"><td>Total</td><td></td>${series.map((s, j) => `<td id="mzT${j}"></td>`).join('')}<td></td></tr></table>
    <datalist id="mzLista">${MZ.comps.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist>
    <button class="btn" style="margin-top:12px" onclick="MZ.ordem['${seg}'].push('');mzSujo();telaMatriz()">+ Matéria</button>`;
  mzTotais(seg);
}
function mzTotais(seg) {
  D.series[seg].forEach((s, j) => {
    const tot = MZ.ordem[seg].reduce((x, c) => x + ((MZ.m[s] || {})[c] || 0), 0);

    const a = minutos(itens[k].ini), b = minutos(itens[k].fim), nome = `Linha ${k + 1}`;

    if (b <= a) return `${nome}: o fim precisa ser depois do início.`;

  D2.carga.forEach(c => { if (c.professor === sai && sel.has(c.turmas.join(' + ') + '|' + c.disciplina)) c.professor = entra; });
  Object.entries(g).forEach(([k, c]) => { const l = linhaDe(k.split('|')[0], c.disciplina); if (c.professor === sai && l && sel.has(l.turmas.join(' + ') + '|' + c.disciplina)) c.professor = entra; });
  $('sRes').innerHTML = '<div class="aviso">Calculando…</div>'; $('sCalc').disabled = true; $('sAplicar').disabled = true;
  Gerador.reencaixar(D2, g, entra, r => {
    if (!$('sRes')) return;
    $('sCalc').disabled = false; SUB = { sai: sai, entra: entra, linhas: linhas, r: r };
    if (!r.ok) {
      $('sRes').innerHTML = `<div class="aviso erro">Não foi possível encaixar. ${r.erros.length ? '' : 'Libere mais horários de ' + esc(entra) + ' ou ajuste as aulas abaixo.'}</div>
        <ul class="lista">${r.erros.concat(r.gargalos).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      return;
    }
    const dele = r.nAlvo ? `${r.nAlvo} aula(s) de ${esc(entra)} mudam de horário.` : 'Nenhuma aula muda de horário.';
    $('sRes').innerHTML = !r.outros.length ? `<div class="aviso ok">✔ Os outros professores não mudam. ${dele}</div>`
      : `<div class="aviso alerta">Com a disponibilidade de ${esc(entra)} não dá para manter tudo igual. Mudam <b>${r.outros.length}</b> aula(s) de outros professores (o mínimo possível). ${dele}</div>
         <div class="rolar"><table class="tab"><tr><th>Professor</th><th>Turma</th><th>Matéria</th><th>De</th><th>Para</th></tr>${r.outros.map(o => `<tr><td>${esc(o.professor)}</td><td>${esc(o.turma)}</td><td>${esc(sigla(o.disciplina))}</td>
           <td>${esc(o.de)}</td><td><b>${esc(o.para)}</b></td></tr>`).join('')}</table></div>`;
    $('sAplicar').disabled = false;
  });
}
async function aplicarTroca() {
  if (!SUB || !SUB.r.ok) return;
  const vig = $('sVig').value; if (!vig) return toast('Escolha a data “válida a partir de”.', 'erro');
  const antes = clone(D.grade), s = SUB;
  if (!await acao('substituir', { sai: s.sai, entra: s.entra, linhas: s.linhas, grade: s.r.grade, vigencia: vig }, 'Troca aplicada e grade salva.')) return;
  usarOficial(); GR.opcoes = [];
  GR.mudou = new Set(Object.keys(GR.atual).filter(k => !antes[k] || antes[k].disciplina !== GR.atual[k].disciplina || antes[k].professor !== GR.atual[k].professor));
  GR.visao = 'geral'; telaGrade();
  AF = { lista: Gerador.afetados(D, antes, D.grade, s.sai, s.entra), vigencia: D.vigencia || dataBR(vig) };
  resumoTroca();
}
// Depois da troca: quem precisa ser avisado, com a mensagem pronta e a impressão só dos afetados
const PAPEL = { sai: 'Deixa as aulas', entra: 'Assume as aulas', mudou: 'Teve aula mudada' };
function linkWhats(nome, texto) {
  const f = ((profPorNome(nome) || {}).tel || '').replace(/\D/g, ''), num = f.length === 10 || f.length === 11 ? '55' + f : f.length >= 12 ? f : '';
  return 'https:\/\/wa.me/' + num + '?text=' + encodeURIComponent(texto);
}
function resumoTroca() {
  const l = AF.lista, aulas = x => x.map(a => `${esc(a.quando)} · ${esc(a.turma)} · ${esc(sigla(a.disciplina))}`).join('<br>');
  abrirModal('Troca aplicada', `<div class="aviso ok">A nova grade vale a partir de <b>${esc(AF.vigencia)}</b>. Avise os professores abaixo.</div>
    <div class="rolar"><table class="tab"><tr><th>Professor</th><th>Saem do horário</th><th>Entram no horário</th><th></th></tr>
    ${l.map(a => `<tr><td><b>${esc(a.professor)}</b><div><span class="tag ${a.papel === 'mudou' ? 'alerta' : 'neutra'}">${PAPEL[a.papel]}</span></div></td>
      <td class="peq">${aulas(a.saem) || '<span class="suave">—</span>'}</td><td class="peq">${aulas(a.entram) || '<span class="suave">—</span>'}</td>
      <td><a class="btn mini" target="_blank" href="${esc(linkWhats(a.professor, Gerador.mensagem(a, AF.vigencia, CFG.escola)))}">WhatsApp</a></td></tr>`).join('')}</table></div>
    <p class="peq suave" style="margin:0">O botão WhatsApp abre a conversa com a mensagem pronta, listando as mudanças daquele professor.</p>`,
    '<button class="btn" onclick="imprimirAfetados()">Imprimir só os afetados</button><button class="btn prim" onclick="fecharModal()">Fechar</button>');
}
function imprimirAfetados() {
  if (!AF) return;
  const profs = AF.lista.map(a => a.professor).filter(n => profPorNome(n) && aulasProf(n));
  const turmas = [...new Set(AF.lista.flatMap(a => a.saem.concat(a.entram)).flatMap(x => x.turma.split(' + ')))].filter(turmaDe);
  imprimirPaginas(profs.map(n => cabImpressao('Professor') + tabelaProf(n)).concat(turmas.map(t => cabImpressao(t) + tabelaTurma(t, false))));
}

iniciar();
</script>
