<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= incluir_('Estilo'); ?>
<style>
  .topo-f { background:var(--marinho); color:#fff; text-align:center; padding:20px 16px 44px; }
  .topo-f .logo { height:40px; margin:0 auto; }
  .topo-f .logo-txt { font-size:20px; }
  .topo-f h1 { font-size:19px; margin-top:8px; }
  .pagina-f { max-width:700px; margin:-28px auto 0; padding:0 12px 110px; display:flex; flex-direction:column; gap:12px; }
  .passo { display:flex; align-items:center; gap:8px; margin:0 0 10px; font:500 16px 'Ubuntu', Arial, sans-serif; color:var(--marinho); }
  .passo i { font-style:normal; width:26px; height:26px; border-radius:50%; background:var(--marinho); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  /* Enviar sempre à vista, preso embaixo da tela */
  .enviar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--sup); border-top:1px solid var(--borda); box-shadow:0 -4px 16px rgba(4,19,57,.08);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .enviar > div { max-width:676px; margin:0 auto; display:flex; flex-direction:column; gap:6px; }
  .enviar .btn { width:100%; justify-content:center; min-height:50px; font-size:16px; }
  .enviar .peq { text-align:center; }
  .fim { text-align:center; padding:34px 20px; }
  .fim .ok { width:60px; height:60px; border-radius:50%; background:var(--ok-bg); color:var(--ok); font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
</style>
</head>
<body>
<div id="carregando" class="carregando"></div>
<header class="topo-f"><div id="logo"></div><h1>Disponibilidade de horários</h1></header>
<div class="faixa"></div>
<main class="pagina-f" id="pagina"><div class="card"><p class="suave">Carregando…</p></div></main>
<div id="toast"></div>
<?!= incluir_('Comum'); ?>
<script>
const CFG = <?!= JSON.stringify(cfg) ?>;
let INFO = null;
function iniciar() {
  $('logo').innerHTML = logoHtml(CFG, true);
  chamar('formLista').then(info => { INFO = info; montar(); })
    .catch(e => { $('pagina').innerHTML = `<div class="card">${esc(e.message)}</div>`; })
    .finally(() => ocupado(false));
}
function montar() {
  $('pagina').innerHTML = `
    <div class="card"><p class="passo"><i>1</i>Escolha seu nome</p><label class="campo">Seu nome
      <select id="fNome" onchange="escolher()"><option value="">Toque para escolher…</option>
        ${INFO.profs.map(p => `<option value="${esc(p.nome)}">${esc(p.completo || p.nome)}${p.disciplinas ? ' · ' + esc(p.disciplinas) : ''}</option>`).join('')}
        <option value="__novo">Não estou na lista (sou novo)</option></select></label>
      <div id="fNovo" hidden style="margin-top:12px" class="linha-campos">
        <label class="campo">Nome completo<input id="fNomeNovo"></label>
        <label class="campo">Matérias que você dá<input id="fDisc" placeholder="Ex.: Física"></label>
        <label class="campo">WhatsApp<input id="fTel" inputmode="tel"></label>
      </div>
    </div>
    <div id="fResto" hidden>
      <div class="card"><p class="passo"><i>2</i>Marque quando você NÃO pode</p>
        <div id="fAviso"></div><div id="fGrade"></div></div>
      <div class="card" style="margin-top:12px"><p class="passo"><i>3</i>Algum recado? (opcional)</p><label class="campo">Observação<textarea id="fObs" rows="2" maxlength="500" placeholder="Ex.: às quintas só posso depois das 9h por causa de outra escola"></textarea></label></div>
      <div class="enviar"><div><span class="peq suave" id="fResumo"></span><button class="btn prim" id="fBtn" onclick="enviar()">Enviar</button></div></div>
    </div>`;
}
async function escolher() {
  const v = $('fNome').value, novo = v === '__novo';
  $('fNovo').hidden = !novo; $('fResto').hidden = !v; $('fAviso').innerHTML = '';
  if (!v) return;
  DISP = new Set(); $('fObs').value = '';
  if (!novo) {
    ocupado(true);
    try {
      const d = await chamar('formDados', v);
      DISP = new Set(d.indisp); $('fObs').value = d.obs || '';
      if (d.respondeuEm) $('fAviso').innerHTML = `<div class="aviso ok" style="margin-bottom:10px">Você já respondeu em ${esc(d.respondeuEm)}. Pode alterar e enviar de novo.</div>`;
    } catch (e) { toast(e.message, 'erro'); } finally { ocupado(false); }
  }
  $('fGrade').innerHTML = htmlDisp(INFO.dias, INFO.faixas);
  window.aoMudarDisp = () => { const n = DISP.size; $('fResumo').textContent = n ? `Você marcou ${n} ${n === 1 ? 'hora' : 'horas'} em que não pode.` : 'Nenhum horário marcado: você pode em todos.'; };
  window.aoMudarDisp();
}
async function enviar() {
  const novo = $('fNome').value === '__novo';
  const d = { novo: novo, nome: novo ? $('fNomeNovo').value : $('fNome').value, indisp: [...DISP], obs: $('fObs').value,
    disciplinas: novo ? $('fDisc').value : '', tel: novo ? $('fTel').value : '' };
  if (novo && d.nome.trim().length < 3) return toast('Escreva seu nome completo.', 'erro');
  if (novo && !d.disciplinas.trim()) return toast('Escreva as matérias que você dá.', 'erro');
  $('fBtn').disabled = true; ocupado(true);
  try {
    const r = await chamar('formEnviar', d);
    $('pagina').innerHTML = `<div class="card fim"><div class="ok">✓</div><h2>Recebido, obrigado!</h2><p class="suave">Registrado em ${esc(r.quando)}. Para mudar algo, é só responder de novo.</p></div>`;
    window.scrollTo(0, 0);
  } catch (e) { toast(e.message, 'erro'); $('fBtn').disabled = false; }
  finally { ocupado(false); }
}
iniciar();
</script>
</body>
</html>
