<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= incluir_('Estilo'); ?>
<style>
  .topo-f { background:var(--marinho); color:#fff; text-align:center; padding:20px 16px 44px; }
  .topo-f .logo { width:60px; height:60px; }
  .topo-f .logo-txt { font-size:20px; }
  .topo-f h1 { font-size:19px; margin-top:8px; }
  .pagina-f { max-width:700px; margin:-28px auto 40px; padding:0 12px; display:flex; flex-direction:column; gap:12px; }
  .enviar { position:sticky; bottom:0; padding:12px 0; background:linear-gradient(transparent, var(--fundo) 30%); }
  .enviar .btn { width:100%; justify-content:center; padding:13px; font-size:15px; }
  .fim { text-align:center; padding:34px 20px; }
  .fim .ok { width:60px; height:60px; border-radius:50%; background:var(--ok-bg); color:var(--ok); font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
</style>
</head>
<body>
<div id="carregando" class="carregando"></div>
<header class="topo-f"><div id="logo"></div><h1>Disponibilidade de horários</h1></header>
<div class="faixa"></div>
<main class="pagina-f" id="pagina"><div class="card"><p class="suave">Carregando…</p></div></main>
<div id="toast"></div>
<?!= incluir_('Comum'); ?>
<script>
const CFG = <?!= JSON.stringify(cfg) ?>;
let INFO = null;
function iniciar() {
  $('logo').innerHTML = logoHtml(CFG);
  chamar('formLista').then(info => { INFO = info; montar(); })
    .catch(e => { $('pagina').innerHTML = `<div class="card">${esc(e.message)}</div>`; })
    .finally(() => ocupado(false));
}
function montar() {
  $('pagina').innerHTML = `
    <div class="card"><label class="campo">Seu nome
      <select id="fNome" onchange="escolher()"><option value="">Selecione…</option>
        ${INFO.profs.map(p => `<option value="${esc(p.nome)}">${esc(p.nome)}${p.disciplinas ? ' · ' + esc(p.disciplinas) : ''}</option>`).join('')}
        <option value="__novo">Não estou na lista (sou novo)</option></select></label>
      <div id="fNovo" hidden style="margin-top:12px" class="linha-campos">
        <label class="campo">Nome completo<input id="fNomeNovo"></label>
        <label class="campo">Disciplina(s)<input id="fDisc" placeholder="Ex.: Física"></label>
        <label class="campo">WhatsApp<input id="fTel" inputmode="tel"></label>
      </div>
    </div>
    <div id="fResto" hidden>
      <div class="card"><p style="margin:0 0 10px">Toque nos horários em que você <b>não pode</b> dar aula (ficam vermelhos).</p>
        <div id="fAviso"></div><div id="fGrade"></div></div>
      <div class="card" style="margin-top:12px"><label class="campo">Observação (opcional)<textarea id="fObs" rows="2" maxlength="500"></textarea></label></div>
      <div class="enviar"><button class="btn prim" id="fBtn" onclick="enviar()">Enviar</button></div>
    </div>`;
}
async function escolher() {
  const v = $('fNome').value, novo = v === '__novo';
  $('fNovo').hidden = !novo; $('fResto').hidden = !v; $('fAviso').innerHTML = '';
  if (!v) return;
  DISP = new Set(); $('fObs').value = '';
  if (!novo) {
    ocupado(true);
    try {
      const d = await chamar('formDados', v);
      DISP = new Set(d.indisp); $('fObs').value = d.obs || '';
      if (d.respondeuEm) $('fAviso').innerHTML = `<div class="aviso ok" style="margin-bottom:10px">Você já respondeu em ${esc(d.respondeuEm)}. Pode alterar e enviar de novo.</div>`;
    } catch (e) { toast(e.message, 'erro'); } finally { ocupado(false); }
  }
  $('fGrade').innerHTML = htmlDisp(INFO.turnos, INFO.dias);
}
async function enviar() {
  const novo = $('fNome').value === '__novo';
  const d = { novo: novo, nome: novo ? $('fNomeNovo').value : $('fNome').value, indisp: [...DISP], obs: $('fObs').value,
    disciplinas: novo ? $('fDisc').value : '', tel: novo ? $('fTel').value : '' };
  if (novo && !d.disciplinas.trim()) return toast('Informe sua disciplina.', 'erro');
  $('fBtn').disabled = true; ocupado(true);
  try {
    const r = await chamar('formEnviar', d);
    $('pagina').innerHTML = `<div class="card fim"><div class="ok">✓</div><h2>Recebido, obrigado!</h2><p class="suave">Registrado em ${esc(r.quando)}. Para mudar algo, é só responder de novo.</p></div>`;
    window.scrollTo(0, 0);
  } catch (e) { toast(e.message, 'erro'); $('fBtn').disabled = false; }
  finally { ocupado(false); }
}
iniciar();
</script>
</body>
</html>
