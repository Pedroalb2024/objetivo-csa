<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= incluir_('Estilo'); ?>
<style>
  .topo-f { background:var(--marinho); color:#fff; text-align:center; padding:18px 16px 42px; }
  .topo-f .logo { height:40px; margin:0 auto; }
  .topo-f .logo-txt { font-size:20px; }
  .topo-f h1 { font-size:19px; margin-top:8px; }
  .topo-f p { margin:2px 0 0; font-size:13px; opacity:.8; }
  .pagina-f { max-width:640px; margin:-28px auto 0; padding:0 12px 120px; display:flex; flex-direction:column; gap:12px; }
  .pagina-f .card { padding:16px 14px; }
  .passo { display:flex; align-items:center; gap:8px; margin:0 0 10px; font:500 16px 'Ubuntu', Arial, sans-serif; color:var(--marinho); }
  .passo i { font-style:normal; width:26px; height:26px; border-radius:50%; background:var(--marinho); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .passo.feito i { background:var(--ok); }
  .feito-linha { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .feito-linha b { font-size:15px; }
  .feito-linha .link { font-size:14px; min-height:44px; padding:0 4px; }
  /* lista de nomes: botões grandes, um por linha */
  .nomes { display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow-y:auto; margin-top:10px; padding:2px; -webkit-overflow-scrolling:touch; }
  .nome-btn { text-align:left; border:1px solid var(--borda); background:#fff; border-radius:10px; padding:0 14px; min-height:48px; font:600 15px 'Open Sans', Arial, sans-serif; color:var(--texto); cursor:pointer; }
  .nome-btn:active, .nome-btn:hover { border-color:var(--azul); background:var(--azul-claro); }
  .nome-btn.novo { border-style:dashed; color:var(--azul); margin-top:8px; }
  /* código de 4 números */
  .codigo-linha { display:flex; gap:8px; align-items:stretch; margin-top:8px; }
  input.codigo { font:700 26px 'Ubuntu', Arial, sans-serif !important; letter-spacing:.45em; text-align:center; max-width:170px; min-height:54px; padding:6px 0 6px .45em; }
  input.codigo.oculto { -webkit-text-security:disc; }
  .codigo-linha .btn { min-height:54px; }
  .mostrar { font-size:13px; margin-top:6px; min-height:36px; }
  .campos-novo { display:flex; flex-direction:column; gap:12px; }
  .campos-novo .chips { margin-top:4px; }
  .chip { min-height:40px; font-size:14px; }
  /* Enviar sempre à vista, preso embaixo da tela */
  .enviar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--sup); border-top:1px solid var(--borda); box-shadow:0 -4px 16px rgba(4,19,57,.08);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .enviar > div { max-width:616px; margin:0 auto; display:flex; flex-direction:column; gap:6px; }
  .enviar .btn { width:100%; justify-content:center; min-height:50px; font-size:16px; }
  .enviar .peq { text-align:center; }
  .fim { text-align:center; padding:34px 20px; }
  .fim .ok { width:60px; height:60px; border-radius:50%; background:var(--ok-bg); color:var(--ok); font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  @media (max-width:700px) { .pagina-f .card { padding:14px 12px; } }
</style>
</head>
<body>
<div id="carregando" class="carregando"></div>
<header class="topo-f"><div id="logo"></div><h1>Disponibilidade de horários</h1><p>Leva uns 2 minutos</p></header>
<div class="faixa"></div>
<main class="pagina-f" id="pagina"><div class="card"><p class="suave">Carregando…</p></div></main>
<div id="toast"></div>
<?!= incluir_('Comum'); ?>
<script>
// Formulário único dos professores (sem login). Passos: 1. nome  2. código de 4 números (o servidor confere)
// 3. horários em que NÃO pode  4. recado. Professor novo: no passo 2 faz o cadastro e cria o código.
const CFG = <?!= JSON.stringify(cfg) ?>;
let INFO = null;
// S.etapa: 'nome' → 'codigo' (ou 'novo') → 'quadro' → 'fim'
const S = { etapa: 'nome', prof: null, codigo: '', erro: '', travado: false, dados: null, novo: null, busca: '', ver: false };
function iniciar() {
  $('logo').innerHTML = logoHtml(CFG, true);
  chamar('formLista').then(info => { INFO = info; montar(); })
    .catch(e => { $('pagina').innerHTML = `<div class="card">${esc(e.message)}</div>`; })
    .finally(() => ocupado(false));
}
const msgErro = e => String(e && e.message || e).replace(/^[\s\S]*?(BLOQUEADO|SEM_CODIGO|CODIGO_ERRADO): ?/, '');
const tipoErro = e => (/(BLOQUEADO|SEM_CODIGO|CODIGO_ERRADO)/.exec(String(e && e.message || e)) || [])[1] || '';

function montar() {
  const p = S.prof, nome = p ? p.rotulo : S.novo ? (S.etapa === 'quadro' && S.novo.completo.trim()) || 'Sou novo' : '';
  let h = '';
  // 1. Nome
  if (S.etapa === 'nome') {
    h += `<div class="card"><p class="passo"><i>1</i>Escolha seu nome</p>
      <input id="fBusca" type="search" placeholder="Digite para buscar…" autocomplete="off" value="${esc(S.busca)}" oninput="S.busca=this.value;listaNomes()">
      <div class="nomes" id="fNomes"></div>
      <button class="nome-btn novo" style="width:100%" onclick="souNovo()">Não estou na lista (sou novo)</button></div>`;
  } else {
    h += `<div class="card"><div class="feito-linha"><p class="passo feito" style="margin:0"><i>✓</i><b>${esc(nome)}</b></p><button class="link" onclick="trocarNome()">Trocar</button></div></div>`;
  }
  // 2. Código (ou cadastro do professor novo)
  if (S.etapa === 'codigo') {
    h += `<div class="card"><p class="passo"><i>2</i>Seu código</p>
      <label class="campo" for="fCodigo" style="font-size:14px;color:var(--texto)">Digite os 4 primeiros números do seu CPF</label>
      <div class="codigo-linha"><input id="fCodigo" class="codigo ${S.ver ? '' : 'oculto'}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" ${S.travado ? 'disabled' : ''}
        value="${esc(S.codigo)}" oninput="digitouCodigo(this)" onkeydown="if(event.key==='Enter')entrar()"><button class="btn prim" onclick="entrar()" ${S.travado ? 'disabled' : ''}>Continuar</button></div>
      <button class="link mostrar" onclick="S.ver=!S.ver;$('fCodigo').classList.toggle('oculto',!S.ver);this.textContent=S.ver?'Esconder os números':'Mostrar os números'">${S.ver ? 'Esconder os números' : 'Mostrar os números'}</button>
      ${S.erro ? `<div class="aviso erro" style="margin-top:8px">${esc(S.erro)}</div>` : ''}</div>`;
  } else if (S.etapa === 'novo') {
    const n = S.novo;
    h += `<div class="card"><p class="passo"><i>2</i>Seu cadastro</p><div class="campos-novo">
      <label class="campo">Nome completo<input id="nNome" value="${esc(n.completo)}" autocomplete="name" oninput="S.novo.completo=this.value"></label>
      <label class="campo">WhatsApp (com DDD)<input id="nTel" value="${esc(n.tel)}" inputmode="tel" autocomplete="tel" placeholder="(11) 90000-0000" oninput="S.novo.tel=this.value"></label>
      <div><span class="campo">Matérias que você dá <span class="peq" style="font-weight:400">(toque para marcar)</span></span>
        <div class="chips" id="nMats">${chipsMaterias()}</div></div>
      <div><label class="campo" for="nCod1">Crie seu código: os 4 primeiros números do seu CPF</label>
        <div class="codigo-linha"><input id="nCod1" class="codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" value="${esc(n.cod1)}" oninput="this.value=this.value.replace(/\\D/g,'');S.novo.cod1=this.value"></div></div>
      <div><label class="campo" for="nCod2">Digite o código de novo</label>
        <div class="codigo-linha"><input id="nCod2" class="codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" value="${esc(n.cod2)}" oninput="this.value=this.value.replace(/\\D/g,'');S.novo.cod2=this.value"></div>
        <p class="peq suave" style="margin:6px 0 0">Você vai usar esse código sempre que voltar ao formulário. Guardamos só uma versão embaralhada dele, nunca os números.</p></div>
      ${S.erro ? `<div class="aviso erro">${esc(S.erro)}</div>` : ''}
      <button class="btn prim" style="justify-content:center;min-height:48px" onclick="continuarNovo()">Continuar</button></div></div>`;
  } else if (S.etapa === 'quadro') {
    h += `<div class="card"><p class="passo feito" style="margin:0"><i>✓</i>${S.novo ? 'Cadastro preenchido' : 'Código conferido'}</p></div>`;
  }
  // 3 e 4. Quadro e recado (só depois do código conferido)
  if (S.etapa === 'quadro') {
    const d = S.dados || {};
    h += `<div class="card"><p class="passo"><i>3</i>Marque quando você NÃO pode</p>
        ${d.respondeuEm ? `<div class="aviso ok" style="margin-bottom:10px">Você já respondeu em ${esc(d.respondeuEm)}. Pode alterar e enviar de novo.</div>` : ''}
        ${d.pendente ? '<div class="aviso alerta" style="margin-bottom:10px">Seu cadastro ainda está aguardando a aprovação da coordenação.</div>' : ''}
        <div id="fGrade">${htmlDisp(INFO.dias, INFO.faixas)}</div></div>
      <div class="card"><p class="passo"><i>4</i>Algum recado? (opcional)</p><label class="campo">Observação<textarea id="fObs" rows="2" maxlength="500" placeholder="Ex.: às quintas só posso depois das 9h por causa de outra escola">${esc(d.obs || '')}</textarea></label></div>
      <div class="enviar"><div><span class="peq suave" id="fResumo"></span><button class="btn prim" id="fBtn" onclick="enviar()">Enviar</button></div></div>`;
  }
  $('pagina').innerHTML = h;
  if (S.etapa === 'nome') listaNomes();
  if (S.etapa === 'codigo' && !S.travado) setTimeout(() => $('fCodigo') && $('fCodigo').focus(), 50);
  if (S.etapa === 'quadro') {
    window.aoMudarDisp = () => { const n = DISP.size; $('fResumo').textContent = n ? `Você marcou ${n} ${n === 1 ? 'hora' : 'horas'} em que não pode.` : 'Nenhum horário marcado: você pode em todos.'; };
    window.aoMudarDisp();
  }
}
// ---- 1. Nome: lista em ordem alfabética, com busca (sem acento e sem maiúscula) ----
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function listaNomes() {
  const b = semAcento(S.busca).trim(), l = INFO.profs.filter(p => !b || semAcento(p.rotulo).indexOf(b) >= 0);
  $('fNomes').innerHTML = l.map(p => `<button class="nome-btn" data-n="${esc(p.nome)}" onclick="escolher(this.dataset.n)">${esc(p.rotulo)}</button>`).join('')
    + (!l.length ? '<p class="peq suave" style="margin:4px 2px">Nenhum nome encontrado. Se você é novo, toque no botão abaixo.</p>' : '');
}
function escolher(nome) {
  S.prof = INFO.profs.find(p => p.nome === nome); S.novo = null; S.codigo = ''; S.erro = ''; S.travado = false; S.dados = null;
  S.etapa = 'codigo'; montar(); window.scrollTo(0, 0);
}
function souNovo() {
  S.prof = null; S.erro = ''; S.dados = null; S.novo = S.novo || { completo: S.busca.trim(), tel: '', materias: [], cod1: '', cod2: '' };
  S.etapa = 'novo'; montar(); window.scrollTo(0, 0);
}
function trocarNome() {
  if (S.etapa === 'quadro' && DISP.size && !confirm('Trocar o nome? O que você marcou será perdido.')) return;
  S.etapa = 'nome'; S.prof = null; S.novo = null; S.codigo = ''; S.erro = ''; S.dados = null; DISP = new Set(); montar();
}
// ---- 2. Código ----
function digitouCodigo(el) {
  el.value = el.value.replace(/\D/g, '').slice(0, 4); S.codigo = el.value;
  if (S.codigo.length === 4) entrar();
}
let entrando = false;
async function entrar() {
  if (entrando || S.travado) return;
  if (!/^\d{4}$/.test(S.codigo)) { S.erro = 'Digite os 4 números.'; return montar(); }
  entrando = true; ocupado(true);
  try {
    S.dados = await chamar('formDados', S.prof.nome, S.codigo);
    DISP = new Set(S.dados.indisp); S.erro = ''; S.etapa = 'quadro'; montar(); window.scrollTo(0, 0);
  } catch (e) {
    const t = tipoErro(e);
    S.erro = msgErro(e); S.codigo = ''; S.travado = t === 'BLOQUEADO' || t === 'SEM_CODIGO';
    montar();
  } finally { entrando = false; ocupado(false); }
}
// ---- 2. Professor novo: cadastro e código ----
function chipsMaterias() {
  return INFO.materias.map(m => `<span class="chip ${S.novo.materias.includes(m) ? 'on' : ''}" data-v="${esc(m)}" onclick="chipMateria(this)">${esc(m)}</span>`).join('');
}
function chipMateria(el) {
  const l = S.novo.materias, m = el.dataset.v, i = l.indexOf(m);
  i >= 0 ? l.splice(i, 1) : l.push(m); el.classList.toggle('on', i < 0);
}
function continuarNovo() {
  const n = S.novo, erro = msg => { S.erro = msg; montar(); return false; };
  if (n.completo.trim().length < 5 || n.completo.trim().indexOf(' ') < 0) return erro('Escreva seu nome completo (nome e sobrenome).');
  if (n.tel.replace(/\D/g, '').length < 10) return erro('Informe seu WhatsApp com DDD.');
  if (!n.materias.length) return erro('Toque nas matérias que você dá.');
  if (!/^\d{4}$/.test(n.cod1)) return erro('O código precisa ter 4 números (os 4 primeiros do seu CPF).');
  if (n.cod1 !== n.cod2) return erro('Os dois códigos não são iguais. Digite de novo.');
  S.erro = ''; S.dados = {}; DISP = new Set(); S.etapa = 'quadro'; montar(); window.scrollTo(0, 0);
}
// ---- Enviar (o servidor confere o código de novo) ----
async function enviar() {
  const n = S.novo;
  const d = n ? { novo: true, completo: n.completo, tel: n.tel, materias: n.materias, codigo: n.cod1, indisp: [...DISP], obs: $('fObs').value }
    : { nome: S.prof.nome, codigo: S.codigo, indisp: [...DISP], obs: $('fObs').value };
  $('fBtn').disabled = true; ocupado(true);
  try {
    const r = await chamar('formEnviar', d);
    S.codigo = ''; S.etapa = 'fim'; if (n) { n.cod1 = ''; n.cod2 = ''; }
    $('pagina').innerHTML = `<div class="card fim"><div class="ok">✓</div><h2>Recebido, obrigado!</h2><p class="suave">Registrado em ${esc(r.quando)}.${n ? ' A coordenação vai conferir seu cadastro.' : ''} Para mudar algo, é só abrir o link de novo.</p></div>`;
    window.scrollTo(0, 0);
  } catch (e) {
    const t = tipoErro(e);
    if (t && !n) { S.erro = msgErro(e); S.codigo = ''; S.travado = t !== 'CODIGO_ERRADO'; S.etapa = 'codigo'; montar(); window.scrollTo(0, 0); }
    else { toast(msgErro(e), 'erro'); $('fBtn').disabled = false; }
  } finally { ocupado(false); }
}
iniciar();
</script>
</body>
</html>
